name: catalogmx
description: Enterprise Mexican library for Flutter/Dart: validators, generators, tax calculators, CFDI helpers and official SAT/INEGI/SEPOMEX/Banxico/IFT/CNBV catalogs.
version: 0.5.1
homepage: https://catalogmx.openbancor.com
repository: https://github.com/openbancor/catalogmx
issue_tracker: https://github.com/openbancor/catalogmx/issues
documentation: https://catalogmx.openbancor.com/docs

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=1.10.0'

dependencies:
  # For accent removal (like unidecode in Python)
  diacritic: ^0.1.5
  # For HTTP requests in data updater
  http: ^1.1.0
  # Flutter platform channels (CFDI validation/signing on device)
  flutter:
    sdk: flutter
  # For XML parsing (CFDI helpers)
  xml: ^6.5.0

dev_dependencies:
  test: ^1.24.0
  lints: ^6.0.0
  faker: ^2.2.0  # For identity generation examples/tests

# Platform support
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

flutter:
  plugin:
    platforms:
      android:
        package: com.openbancor.catalogmx
        pluginClass: CatalogmxPlugin
      ios:
        pluginClass: CatalogmxPlugin

topics:
  - mexico
  - validation
  - fintech
  - catalogs
  - sat
