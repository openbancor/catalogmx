<!doctype html>
<html lang="es" class="">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Catálogos oficiales de México: SAT, INEGI, Banxico, SEPOMEX. Validadores de RFC, CURP, CLABE, NSS. Calculadoras de ISR, IVA, tipo de cambio." />
		<meta name="theme-color" content="#0066b3" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		%sveltekit.head%
		<script>
			// Dark mode detection
			if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
				document.documentElement.classList.add('dark');
			}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover" class="min-h-screen bg-white dark:bg-slate-900">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
