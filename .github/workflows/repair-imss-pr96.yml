name: Temporary PR96 IMSS Repair

on:
  push:
    branches: [fix/fiscal-integrity-2026]
    paths:
      - .github/workflows/repair-imss-pr96.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fiscal-integrity-2026
          fetch-depth: 0

      - name: Patch stale Modalidad 40 coverage tests
        shell: python
        run: |
          from pathlib import Path

          path = Path("packages/typescript/tests/coverage-validators-calculators.test.ts")
          text = path.read_text(encoding="utf-8")
          old = """  // Modalidad 40 salary bounds. The legal minimum depends on the worker's
          // last registered SBC, which this API does not receive; do not invent 1 UMA.
          test('calcularModalidad40 preserves input when prior SBC is unknown', () => {
            const result = IMSSCalculator.calcularModalidad40(1, 2025);
            expect(result.salario_base_cotizacion).toBe(1);
          });

          test('calcularModalidad40 clamps salary to maximum (line 321-322)', () => {
            const result = IMSSCalculator.calcularModalidad40(999999, 2025);
            expect(result.salario_base_cotizacion).toBeLessThan(999999);
          });
          """
          new = """  test('calcularModalidad40 rejects salary below last registered SBC', () => {
            expect(() => IMSSCalculator.calcularModalidad40(1, 5000, 2025)).toThrow(
              'no puede ser menor al último SBC'
            );
          });

          test('calcularModalidad40 clamps salary to maximum', () => {
            const result = IMSSCalculator.calcularModalidad40(999999, 10000, 2025);
            expect(result.salario_base_cotizacion).toBeLessThan(999999);
          });
          """
          if old not in text:
              raise SystemExit("Expected stale Modalidad 40 coverage block was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Format and test Python IMSS
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./packages/python[dev]"
          black packages/python/catalogmx/calculators/imss.py
          ruff check --fix packages/python/catalogmx/calculators/imss.py
          black packages/python/catalogmx/calculators/imss.py
          cd packages/python
          pytest tests/test_imss_calculator.py tests/test_imss_vectors_shared.py -q

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Format and test TypeScript IMSS
        run: |
          cd packages/typescript
          npm install
          npx prettier --write src/calculators/imss-calculator.ts src/fiscal/index.ts
          npm run typecheck
          npx jest --runInBand tests/imss-vectors.test.ts tests/fiscal-history.test.ts tests/coverage-validators-calculators.test.ts

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Format and test Dart IMSS
        run: |
          cd packages/dart
          flutter pub get
          dart format lib/src/calculators/imss.dart test/imss_vectors_test.dart
          dart analyze lib/src/calculators/imss.dart test/imss_vectors_test.dart
          flutter test test/imss_vectors_test.dart

      - name: Commit repaired and formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/typescript/tests/coverage-validators-calculators.test.ts \
            packages/typescript/src/calculators/imss-calculator.ts \
            packages/typescript/src/fiscal/index.ts \
            packages/python/catalogmx/calculators/imss.py \
            packages/dart/lib/src/calculators/imss.dart \
            packages/dart/test/imss_vectors_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "chore(imss): format audited cross-runtime fixes"
            git push origin HEAD:fix/fiscal-integrity-2026
          fi
