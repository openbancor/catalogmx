name: Temporary PR96 IMSS Repair

on:
  push:
    branches: [fix/fiscal-integrity-2026]
    paths:
      - .github/workflows/repair-imss-pr96.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fiscal-integrity-2026
          fetch-depth: 0

      - name: Make the new Modalidad 40 signature unambiguous
        shell: python
        run: |
          from pathlib import Path

          ts_path = Path("packages/typescript/src/calculators/imss-calculator.ts")
          ts = ts_path.read_text(encoding="utf-8")
          old_ts = "    year: IMSSYear = 2026,\n    fecha?: string | Date\n  ): Modalidad40Result {"
          new_ts = "    year: IMSSYear,\n    fecha?: string | Date\n  ): Modalidad40Result {"
          if old_ts in ts:
              ts = ts.replace(old_ts, new_ts, 1)
              ts_path.write_text(ts, encoding="utf-8")
          elif new_ts not in ts:
              raise SystemExit("Expected TypeScript Modalidad 40 signature was not found")

          py_path = Path("packages/python/catalogmx/calculators/imss.py")
          py = py_path.read_text(encoding="utf-8")
          old_py = "    year: IMSSYear = 2026,\n) -> Modalidad40Result:"
          new_py = "    year: IMSSYear,\n) -> Modalidad40Result:"
          if old_py in py:
              py = py.replace(old_py, new_py, 1)
              py_path.write_text(py, encoding="utf-8")
          elif new_py not in py:
              raise SystemExit("Expected Python Modalidad 40 signature was not found")

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Format and test Python IMSS
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./packages/python[dev]"
          black packages/python/catalogmx/calculators/imss.py
          ruff check packages/python/catalogmx/calculators/imss.py
          cd packages/python
          pytest tests/test_imss_calculator.py tests/test_imss_vectors_shared.py -q

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Format and test TypeScript IMSS
        run: |
          cd packages/typescript
          npm install
          npx prettier --write src/calculators/imss-calculator.ts
          npm run typecheck
          npx jest --runInBand tests/imss-vectors.test.ts tests/fiscal-history.test.ts tests/coverage-validators-calculators.test.ts

      - name: Commit API hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/typescript/src/calculators/imss-calculator.ts \
            packages/python/catalogmx/calculators/imss.py
          if ! git diff --cached --quiet; then
            git commit -m "fix(imss): require explicit M40 exercise after SBC"
            git push origin HEAD:fix/fiscal-integrity-2026
          fi
