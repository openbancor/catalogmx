name: Validate tax identity

on:
  push:
    branches:
      - feat/resolver-backed-tax-identity

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/resolver-backed-tax-identity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e 'packages/python[dev]'
      - name: Static checks
        run: |
          ruff check \
            packages/python/catalogmx/catalogs/sat/comercio_exterior/_cfdi_views.py \
            packages/python/catalogmx/catalogs/sat/comercio_exterior/registro_ident_trib.py \
            packages/python/catalogmx/catalogs/sat/comercio_exterior/validator.py \
            packages/python/tests/test_sat_tax_identity_resolver.py
          black --check \
            packages/python/catalogmx/catalogs/sat/comercio_exterior/_cfdi_views.py \
            packages/python/catalogmx/catalogs/sat/comercio_exterior/registro_ident_trib.py \
            packages/python/catalogmx/catalogs/sat/comercio_exterior/validator.py \
            packages/python/tests/test_sat_tax_identity_resolver.py
          git diff --check
      - name: Behavioral tests
        working-directory: packages/python
        run: |
          pytest -q \
            tests/test_sat_tax_identity_resolver.py \
            tests/test_remaining_coverage.py \
            tests/test_final_coverage.py \
            tests/test_final_100_percent.py \
            tests/test_100_percent_coverage.py \
            tests/test_every_remaining_gap.py \
            tests/test_absolute_final_push.py
