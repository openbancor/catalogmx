name: Rebaseline fiscal vectors

on:
  push:
    branches:
      - fix/fiscal-integrity-2026

permissions:
  contents: write

jobs:
  rebaseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fiscal-integrity-2026
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build TypeScript package
        working-directory: packages/typescript
        run: |
          npm ci
          npm run build
      - name: Recalculate worker-cost vectors and remove obsolete M40 assumption
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { calcularCostoTotal } = require('./packages/typescript/dist/calculators/worker-cost-calculator.js');

          const vectorsPath = path.resolve('packages/shared-data/tests/costo_trabajador_vectors.json');
          const vectors = JSON.parse(fs.readFileSync(vectorsPath, 'utf8'));
          const round = (value) => Number(value.toFixed(6));

          for (const vector of vectors) {
            const result = calcularCostoTotal(vector.input);
            vector.expected = Object.fromEntries(
              Object.entries(result).map(([key, value]) => [key, typeof value === 'number' ? round(value) : value])
            );
          }
          fs.writeFileSync(vectorsPath, JSON.stringify(vectors, null, 2) + '\n');
          NODE

          python <<'PY'
          from pathlib import Path
          path = Path('packages/typescript/tests/coverage-validators-calculators.test.ts')
          text = path.read_text(encoding='utf-8')
          old = """  // Modalidad 40 salary bounds\n  test('calcularModalidad40 clamps salary to minimum (line 319-320)', () => {\n    const result = IMSSCalculator.calcularModalidad40(1, 2025);\n    expect(result.salario_base_cotizacion).toBeGreaterThan(1);\n  });\n\n  test('calcularModalidad40 clamps salary to maximum (line 321-322)', () => {\n"""
          new = """  // Modalidad 40 salary bounds. The legal minimum depends on the worker's\n  // last registered SBC, which this API does not receive; do not invent 1 UMA.\n  test('calcularModalidad40 preserves input when prior SBC is unknown', () => {\n    const result = IMSSCalculator.calcularModalidad40(1, 2025);\n    expect(result.salario_base_cotizacion).toBe(1);\n  });\n\n  test('calcularModalidad40 clamps salary to maximum (line 321-322)', () => {\n"""
          if old not in text:
              if new not in text:
                  raise SystemExit('Modalidad 40 legacy coverage block not found')
          else:
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          cd packages/typescript
          npx prettier --write tests/coverage-validators-calculators.test.ts
      - name: Commit if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'catalogmx-data[bot]'
          git config user.email 'catalogmx-data[bot]@users.noreply.github.com'
          git add packages/shared-data/tests/costo_trabajador_vectors.json packages/typescript/tests/coverage-validators-calculators.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test(ts): rebaseline historical fiscal vectors'
          git push origin HEAD:fix/fiscal-integrity-2026
