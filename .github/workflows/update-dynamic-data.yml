name: Update Dynamic Data (Daily)

# Banxico time-series data has an independent lifecycle from CatalogMX code.
# Publication is fail-closed: every source updater must either succeed or report
# a valid no-observation window, the resulting SQLite database must pass
# structural/content validation, and compatibility assets are byte-verified
# before the stable resolver pointer is moved. The legacy `latest` asset remains
# for DataUpdater compatibility.

on:
  schedule:
    - cron: '30 18 * * *'
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-dynamic-data.yml'
      - 'scripts/banxico/build_dynamic_manifest.py'
      - 'scripts/publish_dataset_release.sh'
      - 'packages/shared-data/scripts/fetch_*_banxico.py'
      - 'packages/shared-data/scripts/banxico_sqlite_helper.py'
      - 'packages/shared-data/catalog-registry.json'
      - 'packages/python/catalogmx/data/dataset_contract.json'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force publication verification even if semantic data is unchanged'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: update-dynamic-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout reviewed master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate publication tooling
        run: bash -n scripts/publish_dataset_release.sh

      - name: Seed from current published database when valid
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          seed_dir=$(mktemp -d)
          trap 'rm -rf "$seed_dir"' EXIT

          if gh release view latest >/dev/null 2>&1 && \
             gh release download latest \
               --pattern mexico_dynamic.sqlite3 \
               --dir "$seed_dir" >/dev/null 2>&1; then
            if python scripts/banxico/build_dynamic_manifest.py \
                 "$seed_dir/mexico_dynamic.sqlite3" \
                 --output "$seed_dir/mexico_dynamic.manifest.json" >/dev/null 2>&1; then
              cp "$seed_dir/mexico_dynamic.sqlite3" \
                packages/shared-data/mexico_dynamic.sqlite3
              echo 'Seeded updater from a validated current published database.'
            else
              echo 'Published legacy latest database failed validation; using reviewed repository seed.' >&2
            fi
          else
            echo 'No published legacy latest database available; using reviewed repository seed.'
          fi

      - name: Fetch all configured official data
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd packages/shared-data

          failures=()

          # Legacy fetchers use exit 1 for both a real failure and a valid
          # Banxico window with no observations (weekends, holidays, publication
          # gaps). Distinguish the two states from their explicit messages until
          # the legacy fetcher CLI contract is normalized. Also fail closed if a
          # multi-series updater reports an internal partial-source error.
          run_updater() {
            label="$1"
            shift
            log=$(mktemp)

            set +e
            "$@" 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e

            if grep -Fq 'Error with' "$log"; then
              echo "[workflow] $label reported a partial source failure." >&2
              failures+=("$label")
            elif [ "$status" -eq 0 ]; then
              :
            elif [ "$status" -eq 1 ] && \
                 grep -Fq '[fetch] No new records' "$log" && \
                 ! grep -Fq '[fetch] ERROR' "$log"; then
              echo "[workflow] $label has no new observations; treating as a successful no-op."
            else
              failures+=("$label")
            fi

            rm -f "$log"
          }

          run_updater UDIs python scripts/fetch_udis_banxico.py
          run_updater TipoCambio python scripts/fetch_tipo_cambio_banxico.py
          run_updater TipoCambioHist python scripts/fetch_tipo_cambio_hist_banxico.py
          run_updater TIIE python scripts/fetch_tiie_banxico.py
          run_updater CETES python scripts/fetch_cetes_banxico.py
          run_updater Inflacion python scripts/fetch_inflacion_banxico.py
          run_updater Salarios python scripts/fetch_salarios_minimos_banxico.py

          if [ ${#failures[@]} -ne 0 ]; then
            printf 'Dynamic data source update failed:' >&2
            printf ' %s' "${failures[@]}" >&2
            printf '\nRefusing to publish a partial refresh.\n' >&2
            exit 1
          fi

      - name: Validate database and build resolver manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          cd packages/shared-data
          python ../../scripts/banxico/build_dynamic_manifest.py \
            mexico_dynamic.sqlite3 \
            --output mexico_dynamic.manifest.json

          echo "content_sha=$(jq -r '.dataset.content_sha256' mexico_dynamic.manifest.json)" \
            >> "$GITHUB_OUTPUT"
          echo "data_version=$(jq -r '.data_version' mexico_dynamic.manifest.json)" \
            >> "$GITHUB_OUTPUT"

      - name: Decide whether publication state needs repair
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          channel=data-banxico-sie-dynamic-1-latest
          database=mexico_dynamic.sqlite3
          manifest=mexico_dynamic.manifest.json
          local_dir=packages/shared-data
          content_sha='${{ steps.manifest.outputs.content_sha }}'
          data_version='${{ steps.manifest.outputs.data_version }}'
          archive_tag="data-${data_version}-${content_sha:0:12}"
          previous_sha=''
          previous_release_tag=''
          needs_publication=false

          if gh release view "$channel" --json body >/dev/null 2>&1; then
            body=$(gh release view "$channel" --json body --jq '.body')
            if ! pointer=$(printf '%s' "$body" | jq -ce '
              select(type == "object")
              | select(.schema_version == 1)
              | select(.dataset_id == "banxico.sie_dynamic")
              | select((.dataset_version | tostring) == "1")
              | select(.artifact == "mexico_dynamic.sqlite3")
              | select(.manifest == "mexico_dynamic.manifest.json")
              | select(.content_sha256 | type == "string" and test("^[0-9a-f]{64}$"))
              | select(.release_tag == ("data-banxico-sie-dynamic-1-" + .content_sha256))
            '); then
              echo 'Existing dynamic resolver channel has invalid pointer metadata.' >&2
              exit 1
            fi
            previous_sha=$(printf '%s' "$pointer" | jq -r '.content_sha256')
            previous_release_tag=$(printf '%s' "$pointer" | jq -r '.release_tag')
          fi

          release_matches() {
            tag="$1"
            verify_dir=$(mktemp -d)
            if ! gh release view "$tag" >/dev/null 2>&1 || \
               ! gh release download "$tag" \
                 --pattern "$database" \
                 --pattern "$manifest" \
                 --dir "$verify_dir" >/dev/null 2>&1 || \
               [ ! -f "$verify_dir/$database" ] || \
               [ ! -f "$verify_dir/$manifest" ] || \
               ! cmp -s "$local_dir/$database" "$verify_dir/$database" || \
               ! cmp -s "$local_dir/$manifest" "$verify_dir/$manifest"; then
              rm -rf "$verify_dir"
              return 1
            fi
            rm -rf "$verify_dir"
            return 0
          }

          if [ "$previous_sha" != "$content_sha" ]; then
            needs_publication=true
            echo 'Resolver pointer is absent or references different semantic content.'
          elif ! release_matches "$previous_release_tag"; then
            needs_publication=true
            echo 'Resolver immutable release is absent, incomplete, or does not match reviewed bytes.'
          fi

          if ! release_matches latest; then
            needs_publication=true
            echo 'Legacy latest channel is absent, incomplete, or stale.'
          fi

          if ! release_matches "$archive_tag"; then
            needs_publication=true
            echo "Content-addressed archive $archive_tag is absent or incomplete."
          fi

          force='${{ github.event.inputs.force_update }}'
          if [ "$force" = 'true' ]; then
            needs_publication=true
            echo 'Manual force_update requested publication verification.'
          fi

          if [ "$needs_publication" = 'true' ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Dynamic semantic content and all publication channels are already verified.'
          fi

      - name: Publish compatibility data then resolver pointer
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin master
          reviewed_sha=$(git rev-parse HEAD)
          master_sha=$(git rev-parse origin/master)
          if [ "$reviewed_sha" != "$master_sha" ]; then
            echo 'Reviewed master advanced during dynamic publication; refusing stale publish.' >&2
            exit 1
          fi

          cd packages/shared-data
          database=mexico_dynamic.sqlite3
          manifest=mexico_dynamic.manifest.json
          content_sha='${{ steps.manifest.outputs.content_sha }}'
          data_version='${{ steps.manifest.outputs.data_version }}'
          channel=data-banxico-sie-dynamic-1-latest
          immutable="data-banxico-sie-dynamic-1-${content_sha}"
          archive_tag="data-${data_version}-${content_sha:0:12}"
          verify_dir=$(mktemp -d)
          notes_file=$(mktemp)
          trap 'rm -rf "$verify_dir" "$notes_file"' EXIT

          cat > "$notes_file" <<EOF
          # Dynamic Mexico data — ${data_version}

          Independently versioned time-series data refreshed from configured official sources.

          - Dataset: \`banxico.sie_dynamic\`
          - Contract version: \`1\`
          - Source-data cut: \`${data_version}\`
          - Semantic SHA-256: \`${content_sha}\`

          This data release is independent from CatalogMX package versions.
          EOF

          verify_release_assets() {
            tag="$1"
            rm -rf "$verify_dir"
            mkdir -p "$verify_dir"
            gh release download "$tag" \
              --pattern "$database" \
              --pattern "$manifest" \
              --dir "$verify_dir" >/dev/null
            cmp "$database" "$verify_dir/$database"
            cmp "$manifest" "$verify_dir/$manifest"
            remote_sha=$(jq -r '.dataset.content_sha256 // empty' \
              "$verify_dir/$manifest")
            [ "$remote_sha" = "$content_sha" ]
          }

          # Compatibility channel for existing DataUpdater clients. Keep the
          # historical URL stable while adding the verified manifest.
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$database" "$manifest" --clobber
            gh release edit latest \
              --title "Latest Data (${data_version})" \
              --notes-file "$notes_file" \
              --target "$reviewed_sha" \
              --latest=false
          else
            gh release create latest "$database" "$manifest" \
              --title "Latest Data (${data_version})" \
              --notes-file "$notes_file" \
              --target "$reviewed_sha" \
              --latest=false
          fi
          verify_release_assets latest

          # Human-readable archives are immutable per semantic content. A new
          # semantic state creates a new date+hash tag instead of clobbering an
          # older archive that happened to share the same source-data cut.
          if gh release view "$archive_tag" >/dev/null 2>&1; then
            if ! verify_release_assets "$archive_tag"; then
              echo "Existing dynamic archive $archive_tag does not match reviewed bytes." >&2
              exit 1
            fi
          else
            gh release create "$archive_tag" "$database" "$manifest" \
              --title "Data Update ${data_version} (${content_sha:0:12})" \
              --notes-file "$notes_file" \
              --target "$reviewed_sha" \
              --latest=true
            verify_release_assets "$archive_tag"
          fi

          # The common publisher owns the canonical immutable release and stable
          # metadata pointer. It runs last so any compatibility failure leaves the
          # previous resolver pointer live and makes the next run retry safely.
          bash ../../scripts/publish_dataset_release.sh \
            --manifest "$manifest" \
            --artifact "$database" \
            --channel "$channel" \
            --target "$reviewed_sha"

          {
            echo '## Dynamic data publication'
            echo
            echo "- Source-data cut: \`$data_version\`"
            echo "- Content SHA-256: \`$content_sha\`"
            echo "- Immutable tag: \`$immutable\`"
            echo "- Resolver channel: \`$channel\`"
            echo "- Legacy channel: \`latest\`"
            echo "- Archive tag: \`$archive_tag\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          if [ '${{ steps.changes.outputs.changed }}' = 'true' ]; then
            echo 'Dynamic data validated and publication was attempted.'
          else
            echo 'No semantic data or publication-state change required publication.'
          fi