name: Update Dynamic Data (Daily)

# Banxico time-series data has an independent lifecycle from CatalogMX code.
# Publication is fail-closed: every source updater must succeed, the resulting
# SQLite database must pass structural/content validation, and the immutable
# release is downloaded and byte-verified before the stable resolver pointer is
# moved. The legacy `latest` asset remains for DataUpdater compatibility.

on:
  schedule:
    - cron: '30 18 * * *'
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-dynamic-data.yml'
      - 'scripts/banxico/build_dynamic_manifest.py'
      - 'packages/shared-data/catalog-registry.json'
      - 'packages/python/catalogmx/data/dataset_contract.json'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force republishing compatibility channels even if semantic data is unchanged'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: update-dynamic-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout reviewed master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Seed from current published database when available
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          seed_dir=$(mktemp -d)
          trap 'rm -rf "$seed_dir"' EXIT
          if gh release view latest >/dev/null 2>&1 && \
             gh release download latest \
               --pattern mexico_dynamic.sqlite3 \
               --dir "$seed_dir" >/dev/null 2>&1; then
            cp "$seed_dir/mexico_dynamic.sqlite3" \
              packages/shared-data/mexico_dynamic.sqlite3
            echo 'Seeded updater from the current published dynamic database.'
          else
            echo 'No published legacy latest database available; using reviewed repository seed.'
          fi

      - name: Fetch all configured official data
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd packages/shared-data

          failures=()
          python scripts/fetch_udis_banxico.py || failures+=(UDIs)
          python scripts/fetch_tipo_cambio_banxico.py || failures+=(TipoCambio)
          python scripts/fetch_tipo_cambio_hist_banxico.py || failures+=(TipoCambioHist)
          python scripts/fetch_tiie_banxico.py || failures+=(TIIE)
          python scripts/fetch_cetes_banxico.py || failures+=(CETES)
          python scripts/fetch_inflacion_banxico.py || failures+=(Inflacion)
          python scripts/fetch_salarios_minimos_banxico.py || failures+=(Salarios)

          if [ ${#failures[@]} -ne 0 ]; then
            printf 'Dynamic data source update failed:' >&2
            printf ' %s' "${failures[@]}" >&2
            printf '\nRefusing to publish a partial refresh.\n' >&2
            exit 1
          fi

      - name: Validate database and build resolver manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          cd packages/shared-data
          python ../../scripts/banxico/build_dynamic_manifest.py \
            mexico_dynamic.sqlite3 \
            --output mexico_dynamic.manifest.json

          echo "content_sha=$(jq -r '.dataset.content_sha256' mexico_dynamic.manifest.json)" \
            >> "$GITHUB_OUTPUT"
          echo "data_version=$(jq -r '.data_version' mexico_dynamic.manifest.json)" \
            >> "$GITHUB_OUTPUT"

      - name: Decide whether semantic data changed
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          channel=data-banxico-sie-dynamic-1-latest
          previous_sha=''
          if gh release view "$channel" --json body >/dev/null 2>&1; then
            body=$(gh release view "$channel" --json body --jq '.body')
            if ! previous_sha=$(printf '%s' "$body" | jq -er '.content_sha256'); then
              echo 'Existing dynamic resolver channel has invalid pointer metadata.' >&2
              exit 1
            fi
          fi

          force='${{ github.event.inputs.force_update }}'
          if [ "$force" != 'true' ] && \
             [ "$previous_sha" = '${{ steps.manifest.outputs.content_sha }}' ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Dynamic semantic content is unchanged.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish verified resolver release and compatibility channels
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin master
          reviewed_sha=$(git rev-parse HEAD)
          master_sha=$(git rev-parse origin/master)
          if [ "$reviewed_sha" != "$master_sha" ]; then
            echo 'Reviewed master advanced during dynamic publication; refusing stale publish.' >&2
            exit 1
          fi

          cd packages/shared-data
          database=mexico_dynamic.sqlite3
          manifest=mexico_dynamic.manifest.json
          content_sha='${{ steps.manifest.outputs.content_sha }}'
          data_version='${{ steps.manifest.outputs.data_version }}'
          channel=data-banxico-sie-dynamic-1-latest
          immutable="data-banxico-sie-dynamic-1-${content_sha}"
          archive_tag="data-${data_version}"
          verify_dir=$(mktemp -d)
          trap 'rm -rf "$verify_dir"' EXIT

          pointer=$(jq -cn \
            --arg dataset_id 'banxico.sie_dynamic' \
            --arg dataset_version '1' \
            --arg release_tag "$immutable" \
            --arg content_sha256 "$content_sha" \
            --arg artifact "$database" \
            --arg manifest "$manifest" \
            '{
              schema_version: 1,
              dataset_id: $dataset_id,
              dataset_version: $dataset_version,
              release_tag: $release_tag,
              content_sha256: $content_sha256,
              artifact: $artifact,
              manifest: $manifest
            }')

          notes_file=$(mktemp)
          cat > "$notes_file" <<EOF
          # Dynamic Mexico data — ${data_version}

          Independently versioned time-series data refreshed from configured official sources.

          - Dataset: \`banxico.sie_dynamic\`
          - Contract version: \`1\`
          - Data version: \`${data_version}\`
          - Semantic SHA-256: \`${content_sha}\`

          This data release is independent from CatalogMX package versions.
          EOF

          verify_immutable() {
            rm -rf "$verify_dir"
            mkdir -p "$verify_dir"
            gh release download "$immutable" \
              --pattern "$database" \
              --pattern "$manifest" \
              --dir "$verify_dir" >/dev/null
            cmp "$database" "$verify_dir/$database"
            cmp "$manifest" "$verify_dir/$manifest"
            remote_sha=$(jq -r '.dataset.content_sha256 // empty' \
              "$verify_dir/$manifest")
            [ "$remote_sha" = "$content_sha" ]
          }

          if gh release view "$immutable" >/dev/null 2>&1; then
            if ! verify_immutable; then
              echo 'Existing immutable dynamic release does not match local verified bytes.' >&2
              exit 1
            fi
          else
            gh release create "$immutable" "$database" "$manifest" \
              --title "banxico.sie_dynamic 1 ${content_sha}" \
              --notes-file "$notes_file" \
              --target "$reviewed_sha" \
              --latest=false
            verify_immutable
          fi

          if gh release view "$channel" >/dev/null 2>&1; then
            gh release edit "$channel" \
              --title 'banxico.sie_dynamic 1 (latest)' \
              --notes "$pointer" \
              --target "$reviewed_sha" \
              --latest=false
          else
            gh release create "$channel" \
              --title 'banxico.sie_dynamic 1 (latest)' \
              --notes "$pointer" \
              --target "$reviewed_sha" \
              --latest=false
          fi

          # Compatibility channel for existing DataUpdater clients. Keep the
          # historical URL stable while adding the manifest as a second asset.
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$database" "$manifest" --clobber
            gh release edit latest \
              --title "Latest Data (${data_version})" \
              --notes-file "$notes_file" \
              --target "$reviewed_sha" \
              --latest=false
          else
            gh release create latest "$database" "$manifest" \
              --title "Latest Data (${data_version})" \
              --notes-file "$notes_file" \
              --target "$reviewed_sha" \
              --latest=false
          fi

          # Human-readable dated archive. Re-runs on the same data version are
          # idempotent and refresh assets only after canonical validation.
          if gh release view "$archive_tag" >/dev/null 2>&1; then
            gh release upload "$archive_tag" "$database" "$manifest" --clobber
            gh release edit "$archive_tag" \
              --title "Data Update ${data_version}" \
              --notes-file "$notes_file" \
              --target "$reviewed_sha" \
              --latest=true
          else
            gh release create "$archive_tag" "$database" "$manifest" \
              --title "Data Update ${data_version}" \
              --notes-file "$notes_file" \
              --target "$reviewed_sha" \
              --latest=true
          fi

          {
            echo '## Dynamic data publication'
            echo
            echo "- Data version: \`$data_version\`"
            echo "- Content SHA-256: \`$content_sha\`"
            echo "- Immutable tag: \`$immutable\`"
            echo "- Resolver channel: \`$channel\`"
            echo "- Legacy channel: \`latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          if [ '${{ steps.changes.outputs.changed }}' = 'true' ]; then
            echo 'Dynamic data validated and publication was attempted.'
          else
            echo 'No semantic data change required publication.'
          fi
