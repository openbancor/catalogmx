name: Patch fiscal manifest runtime

on:
  push:
    branches:
      - fix/fiscal-integrity-2026

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fiscal-integrity-2026
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch generator and API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          builder = Path('scripts/build_fiscal_manifest.py')
          text = builder.read_text(encoding='utf-8')
          old_hash = '''    manifest: dict[str, Any] = {\n        "schema_version": 1,\n        "manifest_id": "catalogmx.fiscal",\n        "policy": {\n            "verified": "Source-audited and safe for the declared exercise/vigencia.",\n            "pending_review": "Present for compatibility but consumers should reject for audited payroll.",\n            "legacy_unverified": "Historical snapshot retained; provenance audit not complete.",\n        },\n        "sources": sources,\n        "datasets": datasets,\n    }\n    manifest["content_sha256"] = digest(manifest["datasets"])\n    return manifest\n'''
          new_hash = '''    manifest: dict[str, Any] = {\n        "schema_version": 1,\n        "manifest_id": "catalogmx.fiscal",\n        "policy": {\n            "verified": "Source-audited and safe for the declared exercise/vigencia.",\n            "pending_review": "Present for compatibility but consumers should reject for audited payroll.",\n            "legacy_unverified": "Historical snapshot retained; provenance audit not complete.",\n        },\n        "sources": sources,\n        "datasets": datasets,\n    }\n    # Hash the complete provenance-bearing payload, not only the numeric tables.\n    # A source/provenance change therefore changes the manifest identity too.\n    manifest["content_sha256"] = digest(manifest)\n    return manifest\n'''
          if old_hash not in text:
              raise SystemExit('manifest hash block not found')
          text = text.replace(old_hash, new_hash)

          old_render = '''def render_typescript(manifest: dict[str, Any]) -> str:\n    payload = json.dumps(manifest, ensure_ascii=False, sort_keys=True, indent=2)\n    return (\n        "// Generated by scripts/build_fiscal_manifest.py. DO NOT EDIT.\\n"\n        "export const FISCAL_MANIFEST = "\n        + payload\n        + " as const;\\n"\n    )\n'''
          new_render = '''def render_typescript(manifest: dict[str, Any]) -> str:\n    payload = json.dumps(manifest, ensure_ascii=False, sort_keys=True, indent=2)\n    if "`" in payload or "${" in payload:\n        raise SystemExit("Fiscal manifest contains template-literal control text")\n    dataset_ids = sorted(manifest["datasets"])\n    ids = "\\n".join(f"  '{dataset_id}'," for dataset_id in dataset_ids)\n    return (\n        "// Generated by scripts/build_fiscal_manifest.py. DO NOT EDIT.\\n"\n        "export const FISCAL_DATASET_IDS = [\\n"\n        + ids\n        + "\\n] as const;\\n\\n"\n        "export const FISCAL_MANIFEST_JSON = String.raw`"\n        + payload\n        + "`;\\n\\n"\n        "export const FISCAL_MANIFEST = JSON.parse(FISCAL_MANIFEST_JSON);\\n"\n    )\n'''
          if old_render not in text:
              raise SystemExit('typescript render block not found')
          text = text.replace(old_render, new_render)
          builder.write_text(text, encoding='utf-8')

          fiscal = Path('packages/typescript/src/fiscal/index.ts')
          text = fiscal.read_text(encoding='utf-8')
          text = text.replace(
              "import { FISCAL_MANIFEST } from './manifest.generated';",
              "import { FISCAL_DATASET_IDS, FISCAL_MANIFEST } from './manifest.generated';",
          )
          text = text.replace(
              "export type FiscalDatasetId = keyof typeof FISCAL_MANIFEST.datasets;",
              "export type FiscalDatasetId = (typeof FISCAL_DATASET_IDS)[number];",
          )
          fiscal.write_text(text, encoding='utf-8')

          test = Path('packages/typescript/tests/fiscal-history.test.ts')
          text = test.read_text(encoding='utf-8')
          if "assertFiscalDataVerified" not in text:
              text = text.replace(
                  "import { IMSSCalculator } from '../src/calculators/imss-calculator';",
                  "import { IMSSCalculator } from '../src/calculators/imss-calculator';\nimport {\n  assertFiscalDataVerified,\n  fiscalEntry,\n  fiscalManifest,\n  fiscalSources,\n} from '../src/fiscal';",
              )
              insert = '''\n  test('exposes provenance and verification status programmatically', () => {\n    const manifest = fiscalManifest();\n    expect(manifest.manifest_id).toBe('catalogmx.fiscal');\n    expect(manifest.content_sha256).toMatch(/^[0-9a-f]{64}$/);\n\n    const uma2026 = assertFiscalDataVerified('uma', 2026);\n    expect(uma2026.valid_from).toBe('2026-02-01');\n    expect(uma2026.values).toMatchObject({ daily: 117.31, monthly: 3566.22 });\n    expect(uma2026.sha256).toMatch(/^[0-9a-f]{64}$/);\n    expect(fiscalSources('uma', 2026)[0]?.source?.authority).toBe('INEGI');\n\n    expect(fiscalEntry('isr_payroll', 2026)?.status).toBe('pending_review');\n    expect(() => assertFiscalDataVerified('isr_payroll', 2026)).toThrow('pending_review');\n    expect(fiscalEntry('imss_modalidad_10', 2026)?.status).toBe('pending_review');\n  });\n'''
              text = text.replace("\n});\n", insert + "\n});\n")
          test.write_text(text, encoding='utf-8')
          PY
          python scripts/build_fiscal_manifest.py
          cd packages/typescript
          npm ci
          npx prettier --write src/fiscal/index.ts src/fiscal/manifest.generated.ts tests/fiscal-history.test.ts
          cd ../..
          python scripts/build_fiscal_manifest.py --check
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'catalogmx-data[bot]'
          git config user.email 'catalogmx-data[bot]@users.noreply.github.com'
          git add scripts/build_fiscal_manifest.py packages/shared-data/fiscal-manifest.json packages/typescript/src/fiscal/index.ts packages/typescript/src/fiscal/manifest.generated.ts packages/typescript/tests/fiscal-history.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat(data): harden fiscal manifest identity'
          git push origin HEAD:fix/fiscal-integrity-2026
