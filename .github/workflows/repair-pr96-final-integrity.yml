name: Temporary PR96 Final Integrity Repair

on:
  push:
    branches: [fix/fiscal-integrity-2026]
    paths:
      - .github/workflows/repair-pr96-final-integrity.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fiscal-integrity-2026
          fetch-depth: 0

      - name: Apply final cross-runtime integrity repairs
        shell: python
        run: |
          import json
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old in text:
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise SystemExit(f"Patch marker not found: {label}")

          shared_imss = Path("packages/shared-data/imss-tables.json")
          browser_imss = Path("packages/webapp-svelte/static/data/imss-tables.json")
          browser_imss.write_bytes(shared_imss.read_bytes())

          ts_path = Path("packages/typescript/src/calculators/imss-calculator.ts")
          ts = ts_path.read_text(encoding="utf-8")
          ts = replace_once(
              ts,
              """    const umaMensual = uma.mensual;
              const salarioMaximo = umaMensual * mod40.limites_salario.maximo_uma;
              if (!Number.isFinite(ultimoSbcMensual) || ultimoSbcMensual <= 0) {""",
              """    const umaMensual = uma.mensual;
              const salarioMaximo = umaMensual * mod40.limites_salario.maximo_uma;
              if (!Number.isFinite(salarioBaseCotizacionMensual) || salarioBaseCotizacionMensual <= 0) {
                throw new RangeError('El SBC mensual de Modalidad 40 debe ser mayor que cero');
              }
              if (!Number.isFinite(ultimoSbcMensual) || ultimoSbcMensual <= 0) {""",
              "TypeScript finite requested M40 SBC",
          )
          ts_path.write_text(ts, encoding="utf-8")

          ts_test_path = Path("packages/typescript/tests/imss-vectors.test.ts")
          ts_test = ts_test_path.read_text(encoding="utf-8")
          ts_test = replace_once(
              ts_test,
              """    clase_riesgo: number;
                  expected: {""",
              """    clase_riesgo: number;
                  fecha?: string;
                  expected: {""",
              "TypeScript vector optional fecha",
          )
          ts_test = replace_once(
              ts_test,
              """        toIMSSYear(vector.year),
                    toClaseRiesgo(vector.clase_riesgo)
                  );""",
              """        toIMSSYear(vector.year),
                    toClaseRiesgo(vector.clase_riesgo),
                    vector.fecha
                  );""",
              "TypeScript vector fecha call",
          )
          if "modalidad 40 rejects non-finite requested salary" not in ts_test:
              marker = "\n  test('modalidad 10', () => {"
              if marker not in ts_test:
                  raise SystemExit("TypeScript finite test insertion marker not found")
              finite_test = """
            test('modalidad 40 rejects non-finite requested salary', () => {
              expect(() => IMSSCalculator.calcularModalidad40(Number.NaN, 10000, 2026)).toThrow(
                'debe ser mayor que cero'
              );
              expect(() => IMSSCalculator.calcularModalidad40(Number.POSITIVE_INFINITY, 10000, 2026)).toThrow(
                'debe ser mayor que cero'
              );
            });
          """
              ts_test = ts_test.replace(marker, finite_test + marker, 1)
          ts_test_path.write_text(ts_test, encoding="utf-8")

          vectors_path = Path("packages/shared-data/tests/imss_vectors.json")
          vectors = json.loads(vectors_path.read_text(encoding="utf-8"))
          if not any(v.get("fecha") == "2026-01-15" for v in vectors["cuotas_obrero_patronales"]):
              vectors["cuotas_obrero_patronales"].append(
                  {
                      "salario_diario": 500.0,
                      "dias": 30,
                      "year": 2026,
                      "clase_riesgo": 2,
                      "fecha": "2026-01-15",
                      "expected": {
                          "total_imss": 3392.4753,
                          "total_patron": 3016.9557,
                          "total_trabajador": 375.5196,
                      },
                  }
              )
          vectors_path.write_text(json.dumps(vectors, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          py_path = Path("packages/python/catalogmx/calculators/imss.py")
          py = py_path.read_text(encoding="utf-8")
          py = replace_once(
              py,
              """import json
          import math
          from pathlib import Path""",
              """import json
          import math
          from datetime import date, datetime
          from pathlib import Path""",
              "Python datetime imports",
          )
          py = replace_once(
              py,
              """ClaseRiesgo = Literal[1, 2, 3, 4, 5]
          """,
              """ClaseRiesgo = Literal[1, 2, 3, 4, 5]
          DateInput = str | date | datetime
          """,
              "Python DateInput alias",
          )
          get_uma_start = py.index("def get_uma(year: IMSSYear) -> UMAInfo:")
          get_sm_start = py.index("\ndef get_salario_minimo", get_uma_start)
          get_uma_block = '''def get_uma(year: IMSSYear) -> UMAInfo:
              """Return the UMA published for an exercise."""
              tables = _load_imss_tables()
              uma_data = tables["uma"][str(year)]
              return UMAInfo(
                  diaria=uma_data["diaria"],
                  mensual=uma_data["mensual"],
                  anual=uma_data["anual"],
              )


          def _to_iso_date(fecha: DateInput) -> str:
              """Normalize a supported date input to YYYY-MM-DD."""
              if isinstance(fecha, datetime):
                  return fecha.date().isoformat()
              if isinstance(fecha, date):
                  return fecha.isoformat()
              try:
                  return date.fromisoformat(fecha[:10]).isoformat()
              except (TypeError, ValueError) as exc:
                  raise ValueError(f"Fecha inválida: {fecha}") from exc


          def get_uma_for_date(fecha: DateInput) -> UMAInfo:
              """Return the UMA legally in force on a concrete date."""
              tables = _load_imss_tables()
              iso = _to_iso_date(fecha)
              for uma_data in tables["uma"].values():
                  desde = uma_data.get("vigencia_desde")
                  hasta = uma_data.get("vigencia_hasta")
                  if desde and hasta and desde <= iso <= hasta:
                      return UMAInfo(
                          diaria=uma_data["diaria"],
                          mensual=uma_data["mensual"],
                          anual=uma_data["anual"],
                      )
              raise ValueError(f"No se encontró UMA vigente para {iso}")

'''
          py = py[:get_uma_start] + get_uma_block + py[get_sm_start + 1:]
          py = replace_once(
              py,
              "def _get_ceav_patron_rate(salario_diario: float, year: IMSSYear) -> float:",
              "def _get_ceav_patron_rate(\n    salario_diario: float, year: IMSSYear, fecha: DateInput | None = None\n) -> float:",
              "Python CEAV date signature",
          )
          py = replace_once(
              py,
              "    uma_diaria = get_uma(year)[\"diaria\"]",
              "    uma_diaria = (get_uma(year) if fecha is None else get_uma_for_date(fecha))[\"diaria\"]",
              "Python CEAV date UMA",
          )
          py = replace_once(
              py,
              """    clase_riesgo: ClaseRiesgo = 1,
          ) -> CuotasIMSSResult:""",
              """    clase_riesgo: ClaseRiesgo = 1,
              fecha: DateInput | None = None,
          ) -> CuotasIMSSResult:""",
              "Python cuotas fecha signature",
          )
          py = replace_once(
              py,
              """    tables = _load_imss_tables()
              uma = get_uma(year)
              cuotas = tables[\"cuotas_imss\"]""",
              """    tables = _load_imss_tables()
              uma = get_uma(year) if fecha is None else get_uma_for_date(fecha)
              cuotas = tables[\"cuotas_imss\"]""",
              "Python cuotas date UMA",
          )
          py = replace_once(
              py,
              "    ceav_patron_rate = _get_ceav_patron_rate(salario_diario, year)",
              "    ceav_patron_rate = _get_ceav_patron_rate(salario_diario, year, fecha)",
              "Python cuotas CEAV fecha",
          )
          py = replace_once(
              py,
              """    ultimo_sbc_mensual: float,
              year: IMSSYear,
          ) -> Modalidad40Result:""",
              """    ultimo_sbc_mensual: float,
              year: IMSSYear,
              fecha: DateInput | None = None,
          ) -> Modalidad40Result:""",
              "Python M40 fecha signature",
          )
          m40_start = py.index("def calcular_modalidad_40(")
          m10_start = py.index("\ndef calcular_modalidad_10", m40_start)
          m40 = py[m40_start:m10_start]
          m40 = replace_once(m40, "    uma = get_uma(year)", "    uma = get_uma(year) if fecha is None else get_uma_for_date(fecha)", "Python M40 date UMA")
          m40 = replace_once(
              m40,
              """    if not math.isfinite(ultimo_sbc_mensual) or ultimo_sbc_mensual <= 0:
                  raise ValueError(\"El último SBC mensual debe ser mayor que cero\")""",
              """    if not math.isfinite(salario_base_cotizacion) or salario_base_cotizacion <= 0:
                  raise ValueError(\"El SBC mensual de Modalidad 40 debe ser mayor que cero\")
              if not math.isfinite(ultimo_sbc_mensual) or ultimo_sbc_mensual <= 0:
                  raise ValueError(\"El último SBC mensual debe ser mayor que cero\")""",
              "Python M40 finite requested SBC",
          )
          m40 = replace_once(
              m40,
              "    ceav_patron_rate = _get_ceav_patron_rate(salario_diario_equivalente, year)",
              "    ceav_patron_rate = _get_ceav_patron_rate(salario_diario_equivalente, year, fecha)",
              "Python M40 CEAV fecha",
          )
          py = py[:m40_start] + m40 + py[m10_start:]
          py = replace_once(
              py,
              """def calcular_modalidad_10(
              salario_base_cotizacion: float, year: IMSSYear = 2026
          ) -> Modalidad10Result:""",
              """def calcular_modalidad_10(
              salario_base_cotizacion: float,
              year: IMSSYear = 2026,
              fecha: DateInput | None = None,
          ) -> Modalidad10Result:""",
              "Python M10 fecha signature",
          )
          m10_start = py.index("def calcular_modalidad_10(")
          m10 = py[m10_start:]
          m10 = replace_once(m10, "    uma = get_uma(year)", "    uma = get_uma(year) if fecha is None else get_uma_for_date(fecha)", "Python M10 date UMA")
          py = py[:m10_start] + m10
          py_path.write_text(py, encoding="utf-8")

          py_test_path = Path("packages/python/tests/test_imss_vectors_shared.py")
          py_test = py_test_path.read_text(encoding="utf-8")
          py_test = replace_once(
              py_test,
              """            clase_riesgo=case[\"clase_riesgo\"],
                  )""",
              """            clase_riesgo=case[\"clase_riesgo\"],
                      fecha=case.get(\"fecha\"),
                  )""",
              "Python shared vector fecha",
          )
          if "import pytest\n" not in py_test:
              py_test = py_test.replace("import json\n", "import json\n\nimport pytest\n", 1)
          if "test_modalidad_40_rejects_non_finite_requested_salary" not in py_test:
              py_test += '''\n\ndef test_modalidad_40_rejects_non_finite_requested_salary() -> None:\n    with pytest.raises(ValueError, match="debe ser mayor que cero"):\n        calcular_modalidad_40(float("nan"), 10000, 2026)\n    with pytest.raises(ValueError, match="debe ser mayor que cero"):\n        calcular_modalidad_40(float("inf"), 10000, 2026)\n'''
          py_test_path.write_text(py_test, encoding="utf-8")

          dart_path = Path("packages/dart/lib/src/calculators/imss.dart")
          dart = dart_path.read_text(encoding="utf-8")
          dart = replace_once(
              dart,
              """  static UMAInfo getUMA(IMSSYear year) {
              final tables = _loadIMSSTables();
              return UMAInfo.fromJson(tables['uma']![year.value.toString()]!);
            }
          """,
              """  static UMAInfo getUMA(IMSSYear year) {
              final tables = _loadIMSSTables();
              return UMAInfo.fromJson(tables['uma']![year.value.toString()]!);
            }

            /// Get the UMA legally in force on a concrete date.
            static UMAInfo getUMAForDate(DateTime fecha) {
              final tables = _loadIMSSTables();
              final rows = tables['uma']! as Map<String, dynamic>;
              final target = DateTime(fecha.year, fecha.month, fecha.day);
              for (final raw in rows.values) {
                final row = raw as Map<String, dynamic>;
                final desdeText = row['vigencia_desde'] as String?;
                final hastaText = row['vigencia_hasta'] as String?;
                if (desdeText == null || hastaText == null) continue;
                final desde = DateTime.parse(desdeText);
                final hasta = DateTime.parse(hastaText);
                if (!target.isBefore(desde) && !target.isAfter(hasta)) {
                  return UMAInfo.fromJson(row);
                }
              }
              throw StateError(
                'No se encontró UMA vigente para ${target.toIso8601String().substring(0, 10)}',
              );
            }
          """,
              "Dart getUMAForDate",
          )
          dart = replace_once(
              dart,
              "  static double _getCEAVPatronRate(double salarioDiario, IMSSYear year) {",
              "  static double _getCEAVPatronRate(\n    double salarioDiario,\n    IMSSYear year, [\n    DateTime? fecha,\n  ]) {",
              "Dart CEAV date signature",
          )
          dart = replace_once(
              dart,
              "    final ratio = salarioDiario / getUMA(year).diaria;",
              "    final uma = fecha == null ? getUMA(year) : getUMAForDate(fecha);\n    final ratio = salarioDiario / uma.diaria;",
              "Dart CEAV date UMA",
          )
          dart = replace_once(
              dart,
              """    ClaseRiesgo claseRiesgo = ClaseRiesgo.clase1,
            }) {
              final tables = _loadIMSSTables();
              final uma = getUMA(year);""",
              """    ClaseRiesgo claseRiesgo = ClaseRiesgo.clase1,
              DateTime? fecha,
            }) {
              final tables = _loadIMSSTables();
              final uma = fecha == null ? getUMA(year) : getUMAForDate(fecha);""",
              "Dart cuotas fecha",
          )
          dart = replace_once(
              dart,
              "    final ceavPatronRate = _getCEAVPatronRate(salarioDiario, year);",
              "    final ceavPatronRate = _getCEAVPatronRate(salarioDiario, year, fecha);",
              "Dart cuotas CEAV fecha",
          )
          dart = replace_once(
              dart,
              """    required double ultimoSbcMensual,
              IMSSYear year = IMSSYear.year2026,
            }) {
              final tables = _loadIMSSTables();
              final uma = getUMA(year);""",
              """    required double ultimoSbcMensual,
              IMSSYear year = IMSSYear.year2026,
              DateTime? fecha,
            }) {
              final tables = _loadIMSSTables();
              final uma = fecha == null ? getUMA(year) : getUMAForDate(fecha);""",
              "Dart M40 fecha",
          )
          dart = replace_once(
              dart,
              """    final salarioMaximo =
                  uma.mensual * (limits['maximo_uma']! as num).toDouble();
              if (!ultimoSbcMensual.isFinite || ultimoSbcMensual <= 0) {""",
              """    final salarioMaximo =
                  uma.mensual * (limits['maximo_uma']! as num).toDouble();
              if (!salarioBaseCotizacion.isFinite || salarioBaseCotizacion <= 0) {
                throw ArgumentError(
                  'El SBC mensual de Modalidad 40 debe ser mayor que cero',
                );
              }
              if (!ultimoSbcMensual.isFinite || ultimoSbcMensual <= 0) {""",
              "Dart M40 finite requested SBC",
          )
          dart = replace_once(
              dart,
              "    final ceavPatronRate = _getCEAVPatronRate(salarioDiarioEquivalente, year);",
              "    final ceavPatronRate =\n        _getCEAVPatronRate(salarioDiarioEquivalente, year, fecha);",
              "Dart M40 CEAV fecha",
          )
          dart = replace_once(
              dart,
              """    IMSSYear year = IMSSYear.year2026,
            }) {
              final tables = _loadIMSSTables();
              final uma = getUMA(year);
              final mod10 = tables['modalidad_10']! as Map<String, dynamic>;""",
              """    IMSSYear year = IMSSYear.year2026,
              DateTime? fecha,
            }) {
              final tables = _loadIMSSTables();
              final uma = fecha == null ? getUMA(year) : getUMAForDate(fecha);
              final mod10 = tables['modalidad_10']! as Map<String, dynamic>;""",
              "Dart M10 fecha",
          )
          dart_path.write_text(dart, encoding="utf-8")

          dart_test_path = Path("packages/dart/test/imss_vectors_test.dart")
          dart_test = dart_test_path.read_text(encoding="utf-8")
          dart_test = replace_once(
              dart_test,
              """        claseRiesgo: _riesgoFromInt(vector['clase_riesgo'] as int),
              );""",
              """        claseRiesgo: _riesgoFromInt(vector['clase_riesgo'] as int),
                fecha: vector['fecha'] == null
                    ? null
                    : DateTime.parse(vector['fecha'] as String),
              );""",
              "Dart vector fecha",
          )
          if "Modalidad 40 rejects non-finite requested salary" not in dart_test:
              finite = '''\n\n  test('Modalidad 40 rejects non-finite requested salary', () {\n    expect(\n      () => IMSSCalculator.calcularModalidad40(\n        double.nan,\n        ultimoSbcMensual: 10000,\n      ),\n      throwsArgumentError,\n    );\n    expect(\n      () => IMSSCalculator.calcularModalidad40(\n        double.infinity,\n        ultimoSbcMensual: 10000,\n      ),\n      throwsArgumentError,\n    );\n  });\n'''
              pos = dart_test.rfind("\n}\n")
              if pos < 0:
                  raise SystemExit("Dart test final marker not found")
              dart_test = dart_test[:pos] + finite + dart_test[pos:]
          dart_test_path.write_text(dart_test, encoding="utf-8")

          manifest_script_path = Path("scripts/build_fiscal_manifest.py")
          script = manifest_script_path.read_text(encoding="utf-8")
          start = script.index("def ensure_history_is_additive(")
          end = script.index("\n\ndef render_json", start)
          additive = '''def ensure_history_is_additive(\n    manifest: dict[str, Any], baseline_path: Path | None = None\n) -> None:\n    previous_path = baseline_path if baseline_path is not None else MANIFEST_PATH\n    if not previous_path.exists():\n        return\n    previous = json.loads(previous_path.read_text(encoding="utf-8"))\n    missing: list[str] = []\n    for dataset_id, old_dataset in previous.get("datasets", {}).items():\n        new_dataset = manifest["datasets"].get(dataset_id)\n        if new_dataset is None:\n            missing.append(f"{dataset_id}:<dataset>")\n            continue\n        old_exercises = set(old_dataset.get("entries", {}))\n        new_exercises = set(new_dataset.get("entries", {}))\n        for exercise in sorted(old_exercises - new_exercises):\n            missing.append(f"{dataset_id}:{exercise}")\n    if missing:\n        raise SystemExit(\n            "Fiscal history removal is not allowed by normal generation: "\n            + ", ".join(missing)\n        )\n'''
          script = script[:start] + additive + script[end:]
          script = replace_once(
              script,
              """    parser = argparse.ArgumentParser()
              parser.add_argument("--check", action="store_true")
              args = parser.parse_args()""",
              """    parser = argparse.ArgumentParser()
              parser.add_argument("--check", action="store_true")
              parser.add_argument(
                  "--history-baseline",
                  type=Path,
                  help="Prior fiscal-manifest.json revision used to enforce additive history",
              )
              args = parser.parse_args()""",
              "Manifest baseline CLI",
          )
          script = replace_once(
              script,
              "    ensure_history_is_additive(manifest)",
              "    ensure_history_is_additive(manifest, args.history_baseline)",
              "Manifest baseline call",
          )
          manifest_script_path.write_text(script, encoding="utf-8")

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate manifest history gate and Python runtime
        run: |
          cmp packages/shared-data/imss-tables.json packages/webapp-svelte/static/data/imss-tables.json
          python scripts/build_fiscal_manifest.py --check --history-baseline packages/shared-data/fiscal-manifest.json
          cp packages/shared-data/fiscal-manifest.json "$RUNNER_TEMP/baseline-with-extra-history.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'baseline-with-extra-history.json'
          data = json.loads(path.read_text(encoding='utf-8'))
          data['datasets']['uma']['entries']['9999'] = dict(data['datasets']['uma']['entries']['2026'])
          data['datasets']['uma']['entries']['9999']['exercise'] = 9999
          path.write_text(json.dumps(data), encoding='utf-8')
          PY
          if python scripts/build_fiscal_manifest.py --check --history-baseline "$RUNNER_TEMP/baseline-with-extra-history.json"; then
            echo 'Expected additive-history guard to reject removed historical exercise'
            exit 1
          fi
          python -m pip install --upgrade pip
          python -m pip install -e "./packages/python[dev]"
          black packages/python/catalogmx/calculators/imss.py packages/python/tests/test_imss_vectors_shared.py
          ruff check --fix packages/python/catalogmx/calculators/imss.py packages/python/tests/test_imss_vectors_shared.py
          black packages/python/catalogmx/calculators/imss.py packages/python/tests/test_imss_vectors_shared.py
          cd packages/python
          pytest tests/test_imss_calculator.py tests/test_imss_vectors_shared.py -q

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate TypeScript fiscal and IMSS surfaces
        run: |
          cd packages/typescript
          npm ci
          npx prettier --write src/calculators/imss-calculator.ts tests/imss-vectors.test.ts
          npm run typecheck
          npm run lint
          npx jest --runInBand tests/imss-vectors.test.ts tests/fiscal-history.test.ts

      - name: Validate Svelte browser consumer
        run: |
          cd packages/webapp-svelte
          npm ci
          npm run check
          npm run build

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Validate Dart IMSS surface
        run: |
          cd packages/dart
          flutter pub get
          dart format lib/src/calculators/imss.dart test/imss_vectors_test.dart
          dart analyze lib/src/calculators/imss.dart test/imss_vectors_test.dart
          flutter test test/imss_vectors_test.dart

      - name: Commit final integrity repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/shared-data/tests/imss_vectors.json \
            packages/typescript/src/calculators/imss-calculator.ts \
            packages/typescript/tests/imss-vectors.test.ts \
            packages/python/catalogmx/calculators/imss.py \
            packages/python/tests/test_imss_vectors_shared.py \
            packages/dart/lib/src/calculators/imss.dart \
            packages/dart/test/imss_vectors_test.dart \
            packages/webapp-svelte/static/data/imss-tables.json \
            scripts/build_fiscal_manifest.py
          if ! git diff --cached --quiet; then
            git commit -m "fix(imss): close cross-runtime fiscal integrity gaps"
            git push origin HEAD:fix/fiscal-integrity-2026
          fi
