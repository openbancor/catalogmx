name: Prepare runtime package cleanup

on:
  push:
    branches:
      - feat/finish-data-lifecycle

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'apply runtime package cleanup') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/finish-data-lifecycle
          fetch-depth: 0
      - name: Apply package boundary cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          pyproject = Path('packages/python/pyproject.toml')
          text = pyproject.read_text(encoding='utf-8')
          text = text.replace('    "data/*.sqlite3",\n    "data/*.db",\n', '')
          pyproject.write_text(text, encoding='utf-8')

          cli = Path('packages/python/catalogmx/cli.py')
          text = cli.read_text(encoding='utf-8')
          marker = 'def rfc_generate_moral(razon_social, fecha):'
          before, after = text.split(marker, 1)
          after = after.replace(
              'click.echo(f"Birth date: {fecha}")',
              'click.echo(f"Incorporation date: {fecha}")',
              1,
          )
          cli.write_text(before + marker + after, encoding='utf-8')
          PY
          git rm packages/python/catalogmx/data/mexico_dynamic.sqlite3
      - name: Format and validate
        run: |
          python -m pip install black==25.1.0
          black packages/python/catalogmx/cli.py packages/python/catalogmx/data/updater.py packages/python/tests/test_data_updater.py packages/python/tests/test_data_lifecycle_contract.py
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name 'catalogmx-lifecycle[bot]'
          git config user.email 'catalogmx-lifecycle[bot]@users.noreply.github.com'
          git add packages/python/pyproject.toml packages/python/catalogmx/cli.py packages/python/catalogmx/data/updater.py packages/python/tests/test_data_updater.py packages/python/tests/test_data_lifecycle_contract.py
          git commit -m 'refactor(data): apply runtime package cleanup'
          git push origin HEAD:feat/finish-data-lifecycle
