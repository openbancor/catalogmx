name: Format TasaOCuota test

on:
  push:
    branches:
      - fix/cfdi-tasa-o-cuota

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cfdi-tasa-o-cuota
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Format
        run: |
          python -m pip install black ruff
          black packages/python/tests/test_tasa_o_cuota_complete.py
          ruff check --fix packages/python/tests/test_tasa_o_cuota_complete.py
          black packages/python/tests/test_tasa_o_cuota_complete.py
          git diff --check
      - name: Commit if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'catalogmx-data[bot]'
          git config user.email 'catalogmx-data[bot]@users.noreply.github.com'
          git add packages/python/tests/test_tasa_o_cuota_complete.py
          git commit -m 'style(data): format TasaOCuota test adjustment'
          git push origin HEAD:fix/cfdi-tasa-o-cuota
