name: Inspect Carta Porte consumer contract

on:
  push:
    branches:
      - feat/resolver-backed-carta-porte-consumers

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/resolver-backed-carta-porte-consumers
      - name: Inspect compatibility JSON and canonical SQLite
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sqlite3
          import urllib.request
          from pathlib import Path

          shared = Path('packages/shared-data/sat/carta_porte_3')
          print('=== LEGACY JSON SHAPES ===')
          for path in sorted(shared.glob('*.json')):
              payload = json.loads(path.read_text(encoding='utf-8'))
              rows = payload if isinstance(payload, list) else next(
                  (value for value in payload.values() if isinstance(value, list)), []
              )
              sample = rows[0] if rows else None
              print(json.dumps({
                  'file': path.name,
                  'rows': len(rows),
                  'keys': sorted(sample) if isinstance(sample, dict) else [],
                  'sample': sample,
              }, ensure_ascii=False))

          url = (
              'https://github.com/openbancor/catalogmx/releases/download/'
              'data-sat-carta-porte-3-1-04a0d49e0121a12e1409bca82a7c9c2317e05b114832d1ddea955c119e2883b4/'
              'sat_carta_porte_31.sqlite3'
          )
          db = Path('/tmp/sat_carta_porte_31.sqlite3')
          urllib.request.urlretrieve(url, db)
          con = sqlite3.connect(db)
          try:
              tables = [row[0] for row in con.execute(
                  "SELECT name FROM sqlite_master WHERE type='table' AND name LIKE 'ccp_31_%' ORDER BY name"
              )]
              print('=== CANONICAL TABLES ===')
              for table in tables:
                  cols = [row[1] for row in con.execute(f'PRAGMA table_info("{table}")')]
                  count = con.execute(f'SELECT COUNT(*) FROM "{table}"').fetchone()[0]
                  samples = con.execute(f'SELECT * FROM "{table}" LIMIT 3').fetchall()
                  print(json.dumps({
                      'table': table,
                      'rows': count,
                      'columns': cols,
                      'samples': [list(row) for row in samples],
                  }, ensure_ascii=False, default=str))
          finally:
              con.close()
          PY
