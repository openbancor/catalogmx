name: Inspect Comercio Exterior contract

on:
  push:
    branches:
      - feat/resolver-backed-comercio-exterior-consumers

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/resolver-backed-comercio-exterior-consumers
      - name: Inspect migration targets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sqlite3
          import urllib.request
          from pathlib import Path

          pointer = json.loads(urllib.request.urlopen(
              'https://api.github.com/repos/openbancor/catalogmx/releases/tags/data-sat-comercio-exterior-2-0-latest'
          ).read())
          body = json.loads(pointer['body'])
          url = (
              'https://github.com/openbancor/catalogmx/releases/download/'
              f"{body['release_tag']}/{body['artifact']}"
          )
          db = Path('/tmp/cce.sqlite3')
          urllib.request.urlretrieve(url, db)
          con = sqlite3.connect(db)
          try:
              print('=== ESTADOS BY COUNTRY ===')
              for row in con.execute(
                  'SELECT pais, COUNT(*) FROM cce_20_estados GROUP BY pais ORDER BY pais'
              ):
                  print(row)
              print('=== USA/CAN DUPLICATE STATE CODES ===')
              for row in con.execute(
                  "SELECT estado, GROUP_CONCAT(pais), COUNT(*) FROM cce_20_estados "
                  "WHERE pais IN ('USA','CAN') GROUP BY estado HAVING COUNT(*) > 1 ORDER BY estado"
              ):
                  print(row)
              print('=== USA/CAN ROWS ===')
              for row in con.execute(
                  "SELECT estado,pais,texto,vigencia_desde,vigencia_hasta "
                  "FROM cce_20_estados WHERE pais IN ('USA','CAN') ORDER BY pais,estado"
              ):
                  print(row)
              for table in (
                  'cce_20_incoterms',
                  'cce_20_motivos_traslado',
                  'cce_20_unidades_medida',
              ):
                  print('===', table, '===')
                  for row in con.execute(f'SELECT * FROM "{table}" ORDER BY 1'):
                      print(row)
          finally:
              con.close()
          PY
