name: Validate Carta Porte consumers

on:
  push:
    branches:
      - feat/resolver-backed-carta-porte-consumers

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/resolver-backed-carta-porte-consumers
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e 'packages/python[dev]'
      - name: Static checks
        run: |
          ruff check \
            packages/python/catalogmx/catalogs/sat/carta_porte/_resolver_views.py \
            packages/python/catalogmx/catalogs/sat/carta_porte/config_autotransporte.py \
            packages/python/catalogmx/catalogs/sat/carta_porte/material_peligroso.py \
            packages/python/catalogmx/catalogs/sat/carta_porte/tipo_embalaje.py \
            packages/python/catalogmx/catalogs/sat/carta_porte/tipo_permiso.py \
            packages/python/tests/test_sat_carta_porte_resolver_consumers.py
          black --check \
            packages/python/catalogmx/catalogs/sat/carta_porte/_resolver_views.py \
            packages/python/catalogmx/catalogs/sat/carta_porte/config_autotransporte.py \
            packages/python/catalogmx/catalogs/sat/carta_porte/material_peligroso.py \
            packages/python/catalogmx/catalogs/sat/carta_porte/tipo_embalaje.py \
            packages/python/catalogmx/catalogs/sat/carta_porte/tipo_permiso.py \
            packages/python/tests/test_sat_carta_porte_resolver_consumers.py
          git diff --check
      - name: Behavioral tests
        working-directory: packages/python
        run: |
          pytest -q \
            tests/test_sat_carta_porte_resolver_consumers.py \
            tests/test_100_percent_coverage.py \
            tests/test_final_coverage.py \
            tests/test_every_remaining_gap.py \
            tests/test_remaining_coverage.py
