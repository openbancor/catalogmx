name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, master]
    paths:
      - "packages/webapp-svelte/**"
      - "packages/shared-data/**"
      - ".github/workflows/cloudflare-pages.yml"
  workflow_run:
    workflows: ["Build and Publish SQLite Assets"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: "cloudflare-pages"
  cancel-in-progress: true

env:
  R2_BUCKET: catalogmx-data
  R2_PUBLIC_URL: https://pub-dddf4b79a8b04229b8931ea97e2243f3.r2.dev

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/webapp-svelte/package-lock.json

      - name: Download SQLite from releases
        run: |
          echo "📥 Downloading mexico.sqlite3 from sqlite-assets tag..."
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/sqlite-assets/mexico.sqlite3"
          curl --fail --location --retry 3 --retry-delay 2 -o /tmp/mexico.sqlite3 "$RELEASE_URL"
          echo "✅ Downloaded mexico.sqlite3 from sqlite-assets"

      - name: Validate SQLite freshness
        run: |
          python - <<'PY'
          import datetime as dt
          import sqlite3
          import sys

          db = sqlite3.connect("/tmp/mexico.sqlite3")
          today = dt.date.today()

          checks = [
              ("banxico_udis", "fecha", 14),
              ("banxico_tipo_cambio", "fecha", 14),
              ("banxico_tiie", "fecha", 14),
              ("banxico_cetes", "fecha", 21),
              ("banxico_inflacion", "fecha", 75),
              ("banxico_salarios_minimos", "fecha", 75),
          ]

          failures = []
          for table, column, max_age_days in checks:
              row = db.execute(
                  f"SELECT MAX({column}) FROM {table} WHERE {column} IS NOT NULL"
              ).fetchone()
              value = row[0] if row else None
              if not value:
                  failures.append(f"{table}: missing max date")
                  continue
              try:
                  latest = dt.date.fromisoformat(value[:10])
              except ValueError:
                  failures.append(f"{table}: invalid date {value!r}")
                  continue

              age = (today - latest).days
              print(f"{table}: {latest.isoformat()} ({age} days old)")
              if age > max_age_days:
                  failures.append(
                      f"{table}: stale ({age} days old, max {max_age_days})"
                  )

          db.close()
          if failures:
              print("❌ Freshness check failed:")
              for failure in failures:
                  print(f"  - {failure}")
              sys.exit(1)

          print("✅ SQLite freshness check passed")
          PY

      - name: Upload SQLite to R2
        run: |
          npm install -g wrangler

          # Upload SQLite file
          wrangler r2 object put ${{ env.R2_BUCKET }}/mexico.sqlite3 \
            --file=/tmp/mexico.sqlite3 --remote

          # Generate and upload metadata
          DB_LENGTH=$(stat -c %s /tmp/mexico.sqlite3)
          DB_HASH=$(sha256sum /tmp/mexico.sqlite3 | awk '{print $1}')
          echo "{\"length\": $DB_LENGTH, \"cacheBust\": \"$DB_HASH\"}" > /tmp/mexico.sqlite3.meta.json

          wrangler r2 object put ${{ env.R2_BUCKET }}/mexico.sqlite3.meta.json \
            --file=/tmp/mexico.sqlite3.meta.json --remote

          echo "✅ Uploaded to R2: $DB_LENGTH bytes"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Install dependencies
        working-directory: packages/webapp-svelte
        run: npm ci

      - name: Build
        working-directory: packages/webapp-svelte
        run: npm run build
        env:
          DEPLOY_TARGET: cloudflare-pages
          VITE_DATA_BASE_URL: ${{ env.R2_PUBLIC_URL }}
          VITE_SQLITE_MODE: full

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/webapp-svelte/build --project-name=catalogmx --branch=master --commit-dirty=true
