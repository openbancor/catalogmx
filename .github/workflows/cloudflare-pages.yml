name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, master]
    paths:
      - "packages/webapp-svelte/**"
      - "packages/shared-data/**"
      - ".github/workflows/cloudflare-pages.yml"
  workflow_run:
    workflows: ["Build and Publish SQLite Assets"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: "cloudflare-pages"
  cancel-in-progress: true

env:
  R2_BUCKET: catalogmx-data
  R2_PUBLIC_URL: https://pub-dddf4b79a8b04229b8931ea97e2243f3.r2.dev

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/webapp-svelte/package-lock.json

      - name: Download SQLite from releases
        run: |
          echo "📥 Downloading mexico.sqlite3 from releases..."
          RELEASE_URL=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases | \
            jq -r '[.[] | select(.assets[].name == "mexico.sqlite3")] | first | .assets[] | select(.name == "mexico.sqlite3") | .browser_download_url')

          if [ -z "$RELEASE_URL" ] || [ "$RELEASE_URL" = "null" ]; then
            echo "❌ No mexico.sqlite3 release asset found"
            exit 1
          fi

          curl -L -o /tmp/mexico.sqlite3 "$RELEASE_URL"
          echo "✅ Downloaded mexico.sqlite3"

      - name: Upload SQLite to R2
        run: |
          npm install -g wrangler

          # Upload SQLite file
          wrangler r2 object put ${{ env.R2_BUCKET }}/mexico.sqlite3 \
            --file=/tmp/mexico.sqlite3 --remote

          # Generate and upload metadata
          DB_LENGTH=$(stat -c %s /tmp/mexico.sqlite3)
          DB_HASH=$(sha256sum /tmp/mexico.sqlite3 | awk '{print $1}')
          echo "{\"length\": $DB_LENGTH, \"cacheBust\": \"$DB_HASH\"}" > /tmp/mexico.sqlite3.meta.json

          wrangler r2 object put ${{ env.R2_BUCKET }}/mexico.sqlite3.meta.json \
            --file=/tmp/mexico.sqlite3.meta.json --remote

          echo "✅ Uploaded to R2: $DB_LENGTH bytes"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Install dependencies
        working-directory: packages/webapp-svelte
        run: npm ci

      - name: Build
        working-directory: packages/webapp-svelte
        run: npm run build
        env:
          DEPLOY_TARGET: cloudflare-pages
          VITE_DATA_BASE_URL: ${{ env.R2_PUBLIC_URL }}
          VITE_SQLITE_MODE: full

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/webapp-svelte/build --project-name=catalogmx --branch=master --commit-dirty=true
