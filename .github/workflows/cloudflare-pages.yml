name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, master]
    paths:
      - "packages/webapp-svelte/**"
      - "packages/shared-data/**"
      - ".github/workflows/cloudflare-pages.yml"
  workflow_run:
    workflows: ["Build and Publish SQLite Assets"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: "cloudflare-pages"
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/webapp-svelte/package-lock.json

      - name: Download SQLite from releases
        run: |
          echo "📥 Downloading mexico.sqlite3 from releases..."
          RELEASE_URL=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases | \
            jq -r '[.[] | select(.assets[].name == "mexico.sqlite3")] | first | .assets[] | select(.name == "mexico.sqlite3") | .browser_download_url')

          if [ -z "$RELEASE_URL" ] || [ "$RELEASE_URL" = "null" ]; then
            echo "❌ No mexico.sqlite3 release asset found"
            exit 1
          fi

          mkdir -p packages/webapp-svelte/static/data
          curl -L -o packages/webapp-svelte/static/data/mexico.sqlite3 "$RELEASE_URL"
          echo "✅ Downloaded mexico.sqlite3"

      - name: Split SQLite into chunks
        run: |
          DB_PATH="packages/webapp-svelte/static/data/mexico.sqlite3"
          python3 - <<'PY'
          import os
          from pathlib import Path

          db_path = Path(os.environ.get("DB_PATH", "packages/webapp-svelte/static/data/mexico.sqlite3"))
          chunk_size = 1048576  # 1MB chunks
          suffix_length = 4

          count = 0
          with db_path.open("rb") as handle:
              while True:
                  chunk = handle.read(chunk_size)
                  if not chunk:
                      break
                  out_path = Path(f"{db_path}.{count:0{suffix_length}d}")
                  out_path.write_bytes(chunk)
                  count += 1

          print(f"✅ Created {count} chunks from {db_path}")
          PY
        env:
          DB_PATH: packages/webapp-svelte/static/data/mexico.sqlite3

      - name: Generate SQLite metadata
        run: |
          DB_PATH="packages/webapp-svelte/static/data/mexico.sqlite3"
          DB_LENGTH=$(stat -c %s "$DB_PATH")
          DB_HASH=$(sha256sum "$DB_PATH" | awk '{print $1}')

          # Export for Vite build (chunked mode)
          echo "VITE_SQLITE_LENGTH=$DB_LENGTH" >> "$GITHUB_ENV"
          echo "VITE_SQLITE_HASH=$DB_HASH" >> "$GITHUB_ENV"
          echo "VITE_SQLITE_CHUNK_SIZE=1048576" >> "$GITHUB_ENV"
          echo "VITE_SQLITE_SUFFIX_LENGTH=4" >> "$GITHUB_ENV"

          # Create metadata file
          cat > packages/webapp-svelte/static/data/mexico.sqlite3.meta.json << EOF
          {"length": $DB_LENGTH, "cacheBust": "$DB_HASH"}
          EOF

          # Remove original large file (keep only chunks)
          rm "$DB_PATH"

          echo "✅ SQLite metadata: $DB_LENGTH bytes, hash: ${DB_HASH:0:12}..."

      - name: Install dependencies
        working-directory: packages/webapp-svelte
        run: npm ci

      - name: Build
        working-directory: packages/webapp-svelte
        run: npm run build
        env:
          DEPLOY_TARGET: cloudflare-pages

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/webapp-svelte/build --project-name=catalogmx --commit-dirty=true
