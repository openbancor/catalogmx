name: Deploy Webapp to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "packages/webapp-svelte/**"
      - "packages/shared-data/**"
      - ".github/workflows/webapp-pages.yml"
  workflow_run:
    workflows: ["Build and Publish SQLite Assets"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-webapp"
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/webapp-svelte/package-lock.json

      - name: Download latest SQLite release asset
        run: |
          echo "📥 Downloading mexico.sqlite3 from releases..."
          RELEASE_URL=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases | \
            jq -r '[.[] | select(.assets[].name == "mexico.sqlite3")] | first | .assets[] | select(.name == "mexico.sqlite3") | .browser_download_url')

          if [ -z "$RELEASE_URL" ] || [ "$RELEASE_URL" = "null" ]; then
            echo "❌ No mexico.sqlite3 release asset found"
            exit 1
          fi

          mkdir -p packages/webapp-svelte/static/data
          curl -L -o packages/webapp-svelte/static/data/mexico.sqlite3 "$RELEASE_URL"
          echo "✅ Downloaded mexico.sqlite3 from releases"

      - name: Split SQLite into chunks
        run: |
          DB_PATH="packages/webapp-svelte/static/data/mexico.sqlite3"
          CHUNK_SIZE=1048576
          SUFFIX_LENGTH=4
          python - <<'PY'
          import os
          from pathlib import Path

          db_path = Path(os.environ["DB_PATH"])
          chunk_size = int(os.environ["CHUNK_SIZE"])
          suffix_length = int(os.environ["SUFFIX_LENGTH"])

          count = 0
          with db_path.open("rb") as handle:
            while True:
              chunk = handle.read(chunk_size)
              if not chunk:
                break
              out_path = Path(f"{db_path}.{count:0{suffix_length}d}")
              out_path.write_bytes(chunk)
              count += 1

          print(f"✅ Wrote {count} chunks to {db_path}.0000..")
          PY
        env:
          DB_PATH: packages/webapp-svelte/static/data/mexico.sqlite3
          CHUNK_SIZE: 1048576
          SUFFIX_LENGTH: 4

      - name: Export SQLite metadata
        run: |
          DB_PATH="packages/webapp-svelte/static/data/mexico.sqlite3"
          DB_LENGTH=$(stat -c %s "$DB_PATH")
          DB_HASH=$(sha256sum "$DB_PATH" | awk '{print $1}')
          echo "VITE_SQLITE_LENGTH=$DB_LENGTH" >> "$GITHUB_ENV"
          echo "VITE_SQLITE_HASH=$DB_HASH" >> "$GITHUB_ENV"
          echo "VITE_SQLITE_CHUNK_SIZE=1048576" >> "$GITHUB_ENV"
          echo "VITE_SQLITE_SUFFIX_LENGTH=4" >> "$GITHUB_ENV"
          echo "✅ SQLite metadata exported"

      - name: Install dependencies
        working-directory: packages/webapp-svelte
        run: npm ci

      - name: Build
        working-directory: packages/webapp-svelte
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/webapp-svelte/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
