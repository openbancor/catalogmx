name: Deploy Webapp to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "packages/webapp-svelte/**"
      - "packages/shared-data/**"
      - ".github/workflows/webapp-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-webapp"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/webapp-svelte/package-lock.json

      - name: Install dependencies
        working-directory: packages/webapp-svelte
        run: npm ci

      - name: Build
        working-directory: packages/webapp-svelte
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/webapp-svelte/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
