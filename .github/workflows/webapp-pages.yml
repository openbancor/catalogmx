name: Deploy Webapp to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "packages/webapp-svelte/**"
      - ".github/workflows/webapp-pages.yml"
  workflow_run:
    workflows: ["Build and Publish SQLite Assets"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-webapp"
  cancel-in-progress: true

env:
  # Use Cloudflare R2 for SQLite data (supports Range requests)
  R2_PUBLIC_URL: https://pub-dddf4b79a8b04229b8931ea97e2243f3.r2.dev

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/webapp-svelte/package-lock.json

      - name: Install dependencies
        working-directory: packages/webapp-svelte
        run: npm ci

      - name: Build
        working-directory: packages/webapp-svelte
        run: npm run build
        env:
          DEPLOY_TARGET: github-pages
          VITE_DATA_BASE_URL: ${{ env.R2_PUBLIC_URL }}
          VITE_SQLITE_MODE: full

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/webapp-svelte/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
