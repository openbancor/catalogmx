name: PR96 Integrity Repair

on:
  push:
    branches:
      - fix/fiscal-integrity-2026
    paths:
      - '.github/workflows/pr96-integrity-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fiscal-integrity-2026
          fetch-depth: 0

      - name: Apply reviewed integrity fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          # TypeScript: strict calendar dates + exercise/date consistency.
          ts = 'packages/typescript/src/calculators/imss-calculator.ts'
          replace_once(
              ts,
              "  static getSalarioMinimo(year: IMSSYear, zona: ZonaSalario = 'general'): number {",
              """  private static assertFechaMatchesExercise(year: IMSSYear, fecha?: string | Date): void {
            if (fecha === undefined) return;
            const iso = this.toIsoDate(fecha);
            if (Number(iso.slice(0, 4)) !== year) {
              throw new RangeError(`La fecha ${iso} no pertenece al ejercicio ${year}`);
            }
          }

          static getSalarioMinimo(year: IMSSYear, zona: ZonaSalario = 'general'): number {""",
          )
          replace_once(
              ts,
              """  static getCEAVPatronRate(salarioDiario: number, year: IMSSYear, fecha?: string | Date): number {
            this.loadTablesData();
            const rates =""",
              """  static getCEAVPatronRate(salarioDiario: number, year: IMSSYear, fecha?: string | Date): number {
            this.loadTablesData();
            this.assertFechaMatchesExercise(year, fecha);
            const rates =""",
          )
          for signature in (
              """  ): CuotasIMSSResult {
            this.loadTablesData();
            const uma =""",
              """  ): Modalidad40Result {
            this.loadTablesData();
            const uma =""",
              """  ): Modalidad10Result {
            this.loadTablesData();
            const uma =""",
          ):
              replace_once(
                  ts,
                  signature,
                  signature.replace(
                      '    const uma =',
                      '    this.assertFechaMatchesExercise(year, fecha);\n    const uma =',
                  ),
              )
          replace_once(
              ts,
              """    if (typeof fecha === 'string') {
                const match = /^\\d{4}-\\d{2}-\\d{2}/.exec(fecha);
                if (!match) {
                  throw new Error(`Fecha inválida: ${fecha}`);
                }
                return match[0];
              }""",
              """    if (typeof fecha === 'string') {
                const match = /^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(fecha);
                if (!match) {
                  throw new Error(`Fecha inválida: ${fecha}`);
                }
                const year = Number(match[1]);
                const month = Number(match[2]);
                const day = Number(match[3]);
                const parsed = new Date(Date.UTC(year, month - 1, day));
                if (
                  parsed.getUTCFullYear() !== year ||
                  parsed.getUTCMonth() !== month - 1 ||
                  parsed.getUTCDate() !== day
                ) {
                  throw new Error(`Fecha inválida: ${fecha}`);
                }
                return fecha;
              }""",
          )

          ts_test = 'packages/typescript/tests/fiscal-history.test.ts'
          replace_once(
              ts_test,
              """  test('keeps CEAV patronal rates by exercise instead of overwriting history', () => {""",
              """  test('rejects invalid calendar dates and dates from another exercise', () => {
            expect(() => IMSSCalculator.getUMAForDate('2026-02-31')).toThrow('Fecha inválida');
            expect(() =>
              IMSSCalculator.calcularCuotasObreroPatronales(500, 30, 2026, 2, '2025-12-31')
            ).toThrow('no pertenece al ejercicio 2026');
            expect(() => IMSSCalculator.getCEAVPatronRate(315.04, 2026, '2025-12-31')).toThrow(
              'no pertenece al ejercicio 2026'
            );
            expect(() => IMSSCalculator.calcularModalidad40(15000, 12000, 2026, '2025-12-31')).toThrow(
              'no pertenece al ejercicio 2026'
            );
            expect(() => IMSSCalculator.calcularModalidad10(10000, 2026, '2025-12-31')).toThrow(
              'no pertenece al ejercicio 2026'
            );
          });

          test('keeps CEAV patronal rates by exercise instead of overwriting history', () => {""",
          )

          # Python: reject cross-exercise effective dates on all public calculation surfaces.
          py = 'packages/python/catalogmx/calculators/imss.py'
          replace_once(
              py,
              """def get_salario_minimo(year: IMSSYear, zona: ZonaSalario = "general") -> float:""",
              """def _assert_fecha_matches_exercise(
              year: IMSSYear, fecha: DateInput | None
          ) -> None:
              \"\"\"Reject an effective date whose calendar year differs from the exercise.\"\"\"
              if fecha is None:
                  return
              iso = _to_iso_date(fecha)
              if int(iso[:4]) != year:
                  raise ValueError(f\"La fecha {iso} no pertenece al ejercicio {year}\")


          def get_salario_minimo(year: IMSSYear, zona: ZonaSalario = "general") -> float:""",
          )
          replace_once(
              py,
              """    \"\"\"Select the employer CEAV rate, preserving the special 1-SM row.\"\"\"
              tables = _load_imss_tables()""",
              """    \"\"\"Select the employer CEAV rate, preserving the special 1-SM row.\"\"\"
              _assert_fecha_matches_exercise(year, fecha)
              tables = _load_imss_tables()""",
          )
          replace_once(
              py,
              """    \"\"\"Calculate IMSS employer and employee contributions.\"\"\"
              tables = _load_imss_tables()""",
              """    \"\"\"Calculate IMSS employer and employee contributions.\"\"\"
              _assert_fecha_matches_exercise(year, fecha)
              tables = _load_imss_tables()""",
          )
          replace_once(
              py,
              """    \"\"\"Calculate Modalidad 40 using explicit monthly salary amounts.\"\"\"
              tables = _load_imss_tables()""",
              """    \"\"\"Calculate Modalidad 40 using explicit monthly salary amounts.\"\"\"
              _assert_fecha_matches_exercise(year, fecha)
              tables = _load_imss_tables()""",
          )
          replace_once(
              py,
              """    \"\"\"Calculate the legacy Modalidad 10 model pending its dedicated audit.\"\"\"
              tables = _load_imss_tables()""",
              """    \"\"\"Calculate the legacy Modalidad 10 model pending its dedicated audit.\"\"\"
              _assert_fecha_matches_exercise(year, fecha)
              tables = _load_imss_tables()""",
          )

          py_test = 'packages/python/tests/test_imss_vectors_shared.py'
          Path(py_test).write_text(
              Path(py_test).read_text(encoding='utf-8')
              + """

          def test_imss_date_must_match_selected_exercise() -> None:
              with pytest.raises(ValueError, match="no pertenece al ejercicio 2026"):
                  calcular_cuotas_obrero_patronales(500, 30, 2026, 2, "2025-12-31")
              with pytest.raises(ValueError, match="no pertenece al ejercicio 2026"):
                  calcular_modalidad_40(15000, 12000, 2026, "2025-12-31")
              with pytest.raises(ValueError, match="no pertenece al ejercicio 2026"):
                  calcular_modalidad_10(10000, 2026, "2025-12-31")
          """,
              encoding='utf-8',
          )

          # Dart: same calendar-year/exercise contract.
          dart = 'packages/dart/lib/src/calculators/imss.dart'
          replace_once(
              dart,
              """  static bool _almostEqual(double left, double right) {""",
              """  static void _assertFechaMatchesExercise(
            IMSSYear year,
            DateTime? fecha,
          ) {
            if (fecha != null && fecha.year != year.value) {
              throw ArgumentError(
                'La fecha no pertenece al ejercicio ${year.value}',
              );
            }
          }

          static bool _almostEqual(double left, double right) {""",
          )
          replace_once(
              dart,
              """  ]) {
            final tables = _loadIMSSTables();
            final cuotas = tables['cuotas_imss']! as Map<String, dynamic>;""",
              """  ]) {
            _assertFechaMatchesExercise(year, fecha);
            final tables = _loadIMSSTables();
            final cuotas = tables['cuotas_imss']! as Map<String, dynamic>;""",
          )
          replace_once(
              dart,
              """  }) {
            final tables = _loadIMSSTables();
            final uma = fecha == null ? getUMA(year) : getUMAForDate(fecha);
            final cuotas = tables['cuotas_imss']! as Map<String, dynamic>;""",
              """  }) {
            _assertFechaMatchesExercise(year, fecha);
            final tables = _loadIMSSTables();
            final uma = fecha == null ? getUMA(year) : getUMAForDate(fecha);
            final cuotas = tables['cuotas_imss']! as Map<String, dynamic>;""",
          )
          # The next two occurrences are M40 then M10.
          text = Path(dart).read_text(encoding='utf-8')
          needle = """  }) {
            final tables = _loadIMSSTables();
            final uma = fecha == null ? getUMA(year) : getUMAForDate(fecha);"""
          if text.count(needle) != 2:
              raise SystemExit(f'{dart}: expected two M40/M10 insertion points, found {text.count(needle)}')
          text = text.replace(
              needle,
              """  }) {
            _assertFechaMatchesExercise(year, fecha);
            final tables = _loadIMSSTables();
            final uma = fecha == null ? getUMA(year) : getUMAForDate(fecha);""",
          )
          Path(dart).write_text(text, encoding='utf-8')

          dart_test = 'packages/dart/test/imss_vectors_test.dart'
          replace_once(
              dart_test,
              """  test('Modalidad 40 rejects non-finite requested salary', () {""",
              """  test('IMSS calculations reject dates from another exercise', () {
            final wrongDate = DateTime(2025, 12, 31);
            expect(
              () => IMSSCalculator.calcularCuotasObreroPatronales(
                500,
                year: IMSSYear.year2026,
                fecha: wrongDate,
              ),
              throwsArgumentError,
            );
            expect(
              () => IMSSCalculator.calcularModalidad40(
                15000,
                ultimoSbcMensual: 12000,
                year: IMSSYear.year2026,
                fecha: wrongDate,
              ),
              throwsArgumentError,
            );
            expect(
              () => IMSSCalculator.calcularModalidad10(
                10000,
                year: IMSSYear.year2026,
                fecha: wrongDate,
              ),
              throwsArgumentError,
            );
          });

          test('Modalidad 40 rejects non-finite requested salary', () {""",
          )

          # Manifest generator: enforce canonical/runtime UMA and minimum-wage parity.
          generator = 'scripts/build_fiscal_manifest.py'
          replace_once(
              generator,
              """def build_manifest() -> dict[str, Any]:""",
              """def ensure_imss_parameter_parity(
              uma_rows: list[dict[str, Any]],
              wage_rows: list[dict[str, Any]],
              imss: dict[str, Any],
          ) -> None:
              \"\"\"Ensure canonical regulatory parameters match IMSS runtime copies.\"\"\"
              canonical_uma = {int(row[\"año\"]): row for row in uma_rows}
              canonical_wages = {int(row[\"año\"]): row for row in wage_rows}
              errors: list[str] = []

              for year in sorted(VERIFIED_YEARS):
                  runtime_uma = imss.get(\"uma\", {}).get(str(year))
                  source_uma = canonical_uma.get(year)
                  if runtime_uma is None or source_uma is None:
                      errors.append(f\"UMA {year}: missing canonical/runtime row\")
                  else:
                      for source_key, runtime_key in (
                          (\"valor_diario\", \"diaria\"),
                          (\"valor_mensual\", \"mensual\"),
                          (\"valor_anual\", \"anual\"),
                          (\"vigencia_inicio\", \"vigencia_desde\"),
                          (\"vigencia_fin\", \"vigencia_hasta\"),
                      ):
                          if source_uma.get(source_key) != runtime_uma.get(runtime_key):
                              errors.append(
                                  f\"UMA {year}:{runtime_key} canonical={source_uma.get(source_key)!r} \"
                                  f\"runtime={runtime_uma.get(runtime_key)!r}\"
                              )

                  runtime_wage = imss.get(\"salario_minimo\", {}).get(str(year))
                  source_wage = canonical_wages.get(year)
                  if runtime_wage is None or source_wage is None:
                      errors.append(f\"Salario mínimo {year}: missing canonical/runtime row\")
                  else:
                      for source_key, runtime_key in (
                          (\"resto_pais\", \"general\"),
                          (\"zona_frontera_norte\", \"frontera\"),
                          (\"vigencia_inicio\", \"vigencia_desde\"),
                      ):
                          if source_wage.get(source_key) != runtime_wage.get(runtime_key):
                              errors.append(
                                  f\"Salario mínimo {year}:{runtime_key} \"
                                  f\"canonical={source_wage.get(source_key)!r} \"
                                  f\"runtime={runtime_wage.get(runtime_key)!r}\"
                              )

              if errors:
                  raise SystemExit(
                      \"IMSS canonical/runtime parameter drift: \" + \"; \".join(errors)
                  )


          def build_manifest() -> dict[str, Any]:""",
          )
          replace_once(
              generator,
              """    imss = json.loads((SHARED / "imss-tables.json").read_text(encoding="utf-8"))
              isr = json.loads((SHARED / "isr-tables.json").read_text(encoding="utf-8"))

              sources = dict(imss.get("_meta", {}).get("sources", {}))""",
              """    imss = json.loads((SHARED / "imss-tables.json").read_text(encoding="utf-8"))
              isr = json.loads((SHARED / "isr-tables.json").read_text(encoding="utf-8"))
              ensure_imss_parameter_parity(uma_rows, wage_rows, imss)

              sources = dict(imss.get("_meta", {}).get("sources", {}))""",
          )
          PY

      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/typescript/src/calculators/imss-calculator.ts \
                  packages/typescript/tests/fiscal-history.test.ts \
                  packages/python/catalogmx/calculators/imss.py \
                  packages/python/tests/test_imss_vectors_shared.py \
                  packages/dart/lib/src/calculators/imss.dart \
                  packages/dart/test/imss_vectors_test.dart \
                  scripts/build_fiscal_manifest.py
          git diff --cached --check
          git commit -m "fix(imss): enforce fiscal date and parameter integrity"
          git push origin HEAD:fix/fiscal-integrity-2026
