name: Temporary PR96 M40 Svelte Repair

on:
  push:
    branches: [fix/fiscal-integrity-2026]
    paths:
      - .github/workflows/repair-imss-svelte-pr96.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fiscal-integrity-2026
          fetch-depth: 0

      - name: Patch the Modalidad 40 web form
        shell: python
        run: |
          from pathlib import Path

          path = Path("packages/webapp-svelte/src/routes/calculadoras/imss/+page.svelte")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f"{label} marker not found")

          replace_once(
              "\tlet salarioDiario = $state<number>(500);\n\tlet claseRiesgo = $state<ClaseRiesgo>(1);",
              "\tlet salarioDiario = $state<number>(500);\n\tlet ultimoSbcDiario = $state<number>(500);\n\tlet errorModalidad40 = $state<string | null>(null);\n\tlet claseRiesgo = $state<ClaseRiesgo>(1);",
              "state",
          )

          start = text.index("\tfunction calculateModalidad40() {")
          end = text.index("\n\tfunction calculateModalidad10()", start)
          text = text[:start] + """\tfunction calculateModalidad40() {
          \t\terrorModalidad40 = null;
          \t\tresultadoMod40 = null;

          \t\tif (!ultimoSbcDiario || ultimoSbcDiario <= 0) {
          \t\t\terrorModalidad40 = 'Captura el último SBC diario registrado.';
          \t\t\treturn;
          \t\t}
          \t\tif (salarioDiario < ultimoSbcDiario) {
          \t\t\terrorModalidad40 = 'El SBC elegido no puede ser menor al último SBC registrado.';
          \t\t\treturn;
          \t\t}

          \t\tconst uma = IMSSCalculator.getUMA(year);
          \t\tconst factorMensual = uma.mensual / uma.diaria;

          \t\ttry {
          \t\t\tconst result = IMSSCalculator.calcularModalidad40(
          \t\t\t\tsalarioDiario * factorMensual,
          \t\t\t\tultimoSbcDiario * factorMensual,
          \t\t\t\tyear
          \t\t\t);

          \t\t\tresultadoMod40 = {
          \t\t\t\tsalarioDiario: result.salario_base_cotizacion / factorMensual,
          \t\t\t\tsalarioMensual: result.salario_base_cotizacion,
          \t\t\t\tcuotaMensual: result.cuota_mensual,
          \t\t\t\tcuotaAnual: result.cuota_mensual * 12,
          \t\t\t\tporcentajeTotal: result.porcentaje_total
          \t\t\t};
          \t\t} catch (error) {
          \t\t\terrorModalidad40 =
          \t\t\t\terror instanceof Error ? error.message : 'No fue posible calcular Modalidad 40.';
          \t\t}
          \t}
          """ + text[end:]

          replace_once(
              "\t\t\tresultadoMod10 = null;\n\t\t\treturn;",
              "\t\t\tresultadoMod10 = null;\n\t\t\terrorModalidad40 = null;\n\t\t\treturn;",
              "general validation",
          )

          replace_once(
              "\t\t\t\t\t\t\tSalario diario integrado (SDI)",
              "\t\t\t\t\t\t\t{tipoCalculo === 'modalidad40' ? 'SBC diario elegido' : 'Salario diario integrado (SDI)'}",
              "salary label",
          )

          replace_once(
              "\t\t\t\t\t\t\tSalario mensual: {formatCurrency(salarioDiario * 30)}",
              """\t\t\t\t\t\t\t{#if tipoCalculo === 'modalidad40'}
          \t\t\t\t\t\t\t\tEquivalente mensual M40: {formatCurrency(
          \t\t\t\t\t\t\t\t\tsalarioDiario *
          \t\t\t\t\t\t\t\t\t\t(IMSSCalculator.getUMA(year).mensual / IMSSCalculator.getUMA(year).diaria)
          \t\t\t\t\t\t\t\t)}
          \t\t\t\t\t\t\t{:else}
          \t\t\t\t\t\t\t\tSalario mensual: {formatCurrency(salarioDiario * 30)}
          \t\t\t\t\t\t\t{/if}""",
              "monthly helper",
          )

          marker = """\t\t\t\t\t{#if tipoCalculo === 'modalidad40'}
          \t\t\t\t\t\t<div class=\"p-4 bg-blue-50 dark:bg-blue-900/20 rounded-lg border border-blue-200 dark:border-blue-800\">"""
          replacement = """\t\t\t\t\t{#if tipoCalculo === 'modalidad40'}
          \t\t\t\t\t\t<div>
          \t\t\t\t\t\t\t<label for=\"ultimoSbcDiario\" class=\"block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2\">
          \t\t\t\t\t\t\t\tÚltimo SBC diario registrado
          \t\t\t\t\t\t\t</label>
          \t\t\t\t\t\t\t<div class=\"relative\">
          \t\t\t\t\t\t\t\t<span class=\"absolute left-3 top-1/2 -translate-y-1/2 text-slate-500\">$</span>
          \t\t\t\t\t\t\t\t<input
          \t\t\t\t\t\t\t\t\tid=\"ultimoSbcDiario\"
          \t\t\t\t\t\t\t\t\ttype=\"number\"
          \t\t\t\t\t\t\t\t\tbind:value={ultimoSbcDiario}
          \t\t\t\t\t\t\t\t\tmin=\"0.01\"
          \t\t\t\t\t\t\t\t\tmax={IMSSCalculator.getUMA(year).diaria * 25}
          \t\t\t\t\t\t\t\t\tstep=\"0.01\"
          \t\t\t\t\t\t\t\t\tclass=\"input pl-8 tabular-nums\"
          \t\t\t\t\t\t\t\t/>
          \t\t\t\t\t\t\t</div>
          \t\t\t\t\t\t\t<p class=\"text-xs text-slate-500 mt-1\">
          \t\t\t\t\t\t\t\tEquivalente mensual: {formatCurrency(
          \t\t\t\t\t\t\t\t\tultimoSbcDiario *
          \t\t\t\t\t\t\t\t\t\t(IMSSCalculator.getUMA(year).mensual / IMSSCalculator.getUMA(year).diaria)
          \t\t\t\t\t\t\t\t)}. El SBC elegido no puede ser menor; el tope es 25 UMA.
          \t\t\t\t\t\t\t</p>
          \t\t\t\t\t\t</div>

          \t\t\t\t\t\t{#if errorModalidad40}
          \t\t\t\t\t\t\t<div class=\"p-3 rounded-lg border border-red-200 bg-red-50 text-sm text-red-800 dark:border-red-800 dark:bg-red-900/20 dark:text-red-300\">
          \t\t\t\t\t\t\t\t{errorModalidad40}
          \t\t\t\t\t\t\t</div>
          \t\t\t\t\t\t{/if}

          \t\t\t\t\t\t<div class=\"p-4 bg-blue-50 dark:bg-blue-900/20 rounded-lg border border-blue-200 dark:border-blue-800\">"""
          replace_once(marker, replacement, "M40 form")

          path.write_text(text, encoding="utf-8")

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/webapp-svelte/package-lock.json

      - name: Validate the Svelte webapp
        working-directory: packages/webapp-svelte
        run: |
          npm ci
          npm run check
          npm run build

      - name: Commit the M40 web form repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/webapp-svelte/src/routes/calculadoras/imss/+page.svelte
          if ! git diff --cached --quiet; then
            git commit -m "fix(webapp): require last SBC for Modalidad 40"
            git push origin HEAD:fix/fiscal-integrity-2026
          fi
