name: Format final lifecycle changes

on:
  push:
    branches:
      - feat/finish-data-lifecycle

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'apply final lifecycle formatting') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/finish-data-lifecycle
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Format Python runtime files
        run: |
          python -m pip install black==26.5.1 ruff==0.16.5
          ruff check --fix packages/python/catalogmx/data/updater.py packages/python/catalogmx/data/resolver.py
          black packages/python/catalogmx/data/updater.py packages/python/catalogmx/data/resolver.py
          ruff check packages/python/catalogmx/data/updater.py packages/python/catalogmx/data/resolver.py
          git diff --check
      - name: Commit formatting
        run: |
          git config user.name 'catalogmx-lifecycle[bot]'
          git config user.email 'catalogmx-lifecycle[bot]@users.noreply.github.com'
          git add packages/python/catalogmx/data/updater.py packages/python/catalogmx/data/resolver.py
          git commit -m 'style(data): apply final lifecycle formatting'
          git push origin HEAD:feat/finish-data-lifecycle
