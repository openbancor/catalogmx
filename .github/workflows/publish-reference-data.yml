name: Publish Reference Data

on:
  push:
    branches: [master]
    paths:
      - 'packages/shared-data/banxico/**'
      - 'packages/shared-data/conapo/**'
      - 'packages/shared-data/ift/**'
      - 'packages/shared-data/catalog-registry.json'
      - 'packages/python/catalogmx/data/dataset_contract.json'
      - 'scripts/banxico/build_reference.py'
      - 'scripts/build_reviewed_reference.py'
      - 'scripts/inegi/build_ageeml.py'
      - 'scripts/sat/build_carta_porte_31.py'
      - 'scripts/sat/build_cfdi_40.py'
      - 'scripts/sat/build_comercio_exterior_20.py'
      - 'scripts/sat/build_nomina_12.py'
      - 'scripts/sepomex/build_postal_codes.py'
      - 'scripts/publish_dataset_release.sh'
      - 'scripts/render_dataset_contract.py'
      - '.github/workflows/publish-reference-data.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-reference-data
  cancel-in-progress: false

jobs:
  banxico-reference:
    name: Banxico Reference
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate registry and runtime contract
        run: |
          python scripts/catalog_registry.py validate
          python scripts/render_dataset_contract.py --check
          bash -n scripts/publish_dataset_release.sh

      - name: Build reviewed Banxico bundle
        run: |
          python scripts/banxico/build_reference.py \
            --output-dir dist/catalog-artifacts/banxico-reference
          git diff --exit-code -- packages/shared-data/banxico

      - name: Publish immutable bundle and move channel pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          reviewed_sha=$(git rev-parse HEAD)
          master_sha=$(git rev-parse origin/master)
          if [ "$reviewed_sha" != "$master_sha" ]; then
            echo "Checked-out publication source is not origin/master" >&2
            exit 1
          fi

          dir=dist/catalog-artifacts/banxico-reference
          contract=packages/python/catalogmx/data/dataset_contract.json
          channel=$(jq -er '.datasets["banxico.reference"].artifact.channel' "$contract")
          artifact_name=$(jq -er '.datasets["banxico.reference"].artifact.file' "$contract")
          manifest_name=$(jq -er '.datasets["banxico.reference"].artifact.manifest' "$contract")

          bash scripts/publish_dataset_release.sh \
            --manifest "$dir/$manifest_name" \
            --artifact "$dir/$artifact_name" \
            --channel "$channel" \
            --target "$reviewed_sha"

  reviewed-reference-datasets:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CONAPO territorial reference
            dataset_id: conapo.territorial
            output_dir: dist/catalog-artifacts/conapo-territorial
          - name: IFT numbering reference
            dataset_id: ift.numbering
            output_dir: dist/catalog-artifacts/ift-numbering

    steps:
      - name: Checkout reviewed master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate registry, runtime contract and publisher
        run: |
          python scripts/catalog_registry.py validate
          python scripts/render_dataset_contract.py --check
          bash -n scripts/publish_dataset_release.sh

      - name: Build reviewed reference bundle
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_reviewed_reference.py \
            --dataset "${{ matrix.dataset_id }}" \
            --output-dir "${{ matrix.output_dir }}"
          git diff --exit-code -- packages/shared-data

      - name: Verify generated manifest against runtime contract
        shell: bash
        run: |
          set -euo pipefail
          contract=packages/python/catalogmx/data/dataset_contract.json
          dataset_id='${{ matrix.dataset_id }}'
          dir='${{ matrix.output_dir }}'
          artifact_name=$(jq -er --arg id "$dataset_id" '.datasets[$id].artifact.file' "$contract")
          manifest_name=$(jq -er --arg id "$dataset_id" '.datasets[$id].artifact.manifest' "$contract")
          expected_version=$(jq -er --arg id "$dataset_id" '.datasets[$id].artifact.version | tostring' "$contract")
          expected_format=$(jq -er --arg id "$dataset_id" '.datasets[$id].artifact.format' "$contract")
          expected_mount=$(jq -er --arg id "$dataset_id" '.datasets[$id].artifact.mount_path' "$contract")
          manifest="$dir/$manifest_name"
          artifact="$dir/$artifact_name"
          test -f "$manifest"
          test -f "$artifact"
          jq -e \
            --arg id "$dataset_id" \
            --arg version "$expected_version" \
            --arg file "$artifact_name" \
            --arg format "$expected_format" \
            --arg mount "$expected_mount" \
            '.schema_version == 1
             and .dataset_id == $id
             and (.dataset_version | tostring) == $version
             and .dataset.file == $file
             and .dataset.format == $format
             and .dataset.mount_path == $mount
             and (.dataset.file_sha256 | test("^[0-9a-f]{64}$"))
             and (.dataset.content_sha256 | test("^[0-9a-f]{64}$"))
             and (.dataset.files | length > 0)' \
            "$manifest" >/dev/null

      - name: Publish immutable bundle and move channel pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          reviewed_sha=$(git rev-parse HEAD)
          git fetch origin master
          master_sha=$(git rev-parse origin/master)
          if [ "$reviewed_sha" != "$master_sha" ]; then
            echo "Checked-out publication source is not origin/master" >&2
            exit 1
          fi
          contract=packages/python/catalogmx/data/dataset_contract.json
          dataset_id='${{ matrix.dataset_id }}'
          dir='${{ matrix.output_dir }}'
          channel=$(jq -er --arg id "$dataset_id" '.datasets[$id].artifact.channel' "$contract")
          artifact_name=$(jq -er --arg id "$dataset_id" '.datasets[$id].artifact.file' "$contract")
          manifest_name=$(jq -er --arg id "$dataset_id" '.datasets[$id].artifact.manifest' "$contract")
          bash scripts/publish_dataset_release.sh \
            --manifest "$dir/$manifest_name" \
            --artifact "$dir/$artifact_name" \
            --channel "$channel" \
            --target "$reviewed_sha"

  resolver-file-datasets:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: INEGI AGEEML
            dataset_id: inegi.ageeml
            builder: scripts/inegi/build_ageeml.py
            output_dir: dist/catalog-artifacts/inegi-ageeml
          - name: SAT Carta Porte 3.1
            dataset_id: sat.carta_porte
            builder: scripts/sat/build_carta_porte_31.py
            output_dir: dist/catalog-artifacts/sat-carta-porte-31
          - name: SAT CFDI 4.0
            dataset_id: sat.cfdi_4
            builder: scripts/sat/build_cfdi_40.py
            output_dir: dist/catalog-artifacts/sat-cfdi-40
          - name: SAT Comercio Exterior 2.0
            dataset_id: sat.comercio_exterior
            builder: scripts/sat/build_comercio_exterior_20.py
            output_dir: dist/catalog-artifacts/sat-comercio-exterior-20
          - name: SAT Nomina 1.2 revision E
            dataset_id: sat.nomina_1_2
            builder: scripts/sat/build_nomina_12.py
            output_dir: dist/catalog-artifacts/sat-nomina-12
          - name: SEPOMEX postal codes
            dataset_id: sepomex.codigos_postales
            builder: scripts/sepomex/build_postal_codes.py
            output_dir: dist/catalog-artifacts/sepomex-codigos-postales

    steps:
      - name: Checkout reviewed master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate registry, runtime contract and publisher
        run: |
          python scripts/catalog_registry.py validate
          python scripts/render_dataset_contract.py --check
          bash -n scripts/publish_dataset_release.sh

      - name: Build canonical dataset
        shell: bash
        run: |
          set -euo pipefail
          python "${{ matrix.builder }}" --output-dir "${{ matrix.output_dir }}"
          git diff --exit-code -- packages/shared-data

      - name: Verify generated manifest against runtime contract
        shell: bash
        run: |
          set -euo pipefail
          contract=packages/python/catalogmx/data/dataset_contract.json
          dataset_id='${{ matrix.dataset_id }}'
          dir='${{ matrix.output_dir }}'

          artifact_name=$(jq -er --arg id "$dataset_id" '.datasets[$id].artifact.file' "$contract")
          manifest_name=$(jq -er --arg id "$dataset_id" '.datasets[$id].artifact.manifest' "$contract")
          expected_version=$(jq -er --arg id "$dataset_id" '.datasets[$id].artifact.version | tostring' "$contract")
          expected_format=$(jq -er --arg id "$dataset_id" '.datasets[$id].artifact.format' "$contract")
          expected_mount=$(jq -er --arg id "$dataset_id" '.datasets[$id].artifact.mount_path' "$contract")
          manifest="$dir/$manifest_name"
          artifact="$dir/$artifact_name"

          test -f "$manifest"
          test -f "$artifact"
          jq -e \
            --arg id "$dataset_id" \
            --arg version "$expected_version" \
            --arg file "$artifact_name" \
            --arg format "$expected_format" \
            --arg mount "$expected_mount" \
            '.schema_version == 1
             and .dataset_id == $id
             and (.dataset_version | tostring) == $version
             and .dataset.file == $file
             and .dataset.format == $format
             and .dataset.mount_path == $mount
             and (.dataset.file_sha256 | test("^[0-9a-f]{64}$"))
             and (.dataset.content_sha256 | test("^[0-9a-f]{64}$"))' \
            "$manifest" >/dev/null

      - name: Publish immutable artifact and move channel pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          reviewed_sha=$(git rev-parse HEAD)
          git fetch origin master
          master_sha=$(git rev-parse origin/master)
          if [ "$reviewed_sha" != "$master_sha" ]; then
            echo "Checked-out publication source is not origin/master" >&2
            exit 1
          fi

          contract=packages/python/catalogmx/data/dataset_contract.json
          dataset_id='${{ matrix.dataset_id }}'
          dir='${{ matrix.output_dir }}'
          channel=$(jq -er --arg id "$dataset_id" '.datasets[$id].artifact.channel' "$contract")
          artifact_name=$(jq -er --arg id "$dataset_id" '.datasets[$id].artifact.file' "$contract")
          manifest_name=$(jq -er --arg id "$dataset_id" '.datasets[$id].artifact.manifest' "$contract")

          bash scripts/publish_dataset_release.sh \
            --manifest "$dir/$manifest_name" \
            --artifact "$dir/$artifact_name" \
            --channel "$channel" \
            --target "$reviewed_sha"
