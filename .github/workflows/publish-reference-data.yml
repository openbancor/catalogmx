name: Publish Reference Data

on:
  push:
    branches: [master]
    paths:
      - 'packages/shared-data/banxico/**'
      - 'packages/shared-data/catalog-registry.json'
      - 'packages/python/catalogmx/data/dataset_contract.json'
      - 'scripts/banxico/build_reference.py'
      - 'scripts/publish_dataset_release.sh'
      - 'scripts/render_dataset_contract.py'
      - '.github/workflows/publish-reference-data.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-reference-data-banxico-reference
  cancel-in-progress: false

jobs:
  banxico-reference:
    name: Banxico Reference
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate registry and runtime contract
        run: |
          python scripts/catalog_registry.py validate
          python scripts/render_dataset_contract.py --check
          bash -n scripts/publish_dataset_release.sh

      - name: Build reviewed Banxico bundle
        run: |
          python scripts/banxico/build_reference.py \
            --output-dir dist/catalog-artifacts/banxico-reference
          git diff --exit-code -- packages/shared-data/banxico

      - name: Publish immutable bundle and move channel pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          reviewed_sha=$(git rev-parse HEAD)
          master_sha=$(git rev-parse origin/master)
          if [ "$reviewed_sha" != "$master_sha" ]; then
            echo "Checked-out publication source is not origin/master" >&2
            exit 1
          fi

          dir=dist/catalog-artifacts/banxico-reference
          contract=packages/python/catalogmx/data/dataset_contract.json
          channel=$(jq -er '.datasets["banxico.reference"].artifact.channel' "$contract")
          artifact_name=$(jq -er '.datasets["banxico.reference"].artifact.file' "$contract")
          manifest_name=$(jq -er '.datasets["banxico.reference"].artifact.manifest' "$contract")

          bash scripts/publish_dataset_release.sh \
            --manifest "$dir/$manifest_name" \
            --artifact "$dir/$artifact_name" \
            --channel "$channel" \
            --target "$reviewed_sha"
