name: Publish Reference Data

on:
  push:
    branches: [master]
    paths:
      - 'packages/shared-data/banxico/**'
      - 'packages/shared-data/catalog-registry.json'
      - 'packages/python/catalogmx/data/dataset_contract.json'
      - 'scripts/banxico/build_reference.py'
      - 'scripts/render_dataset_contract.py'
      - '.github/workflows/publish-reference-data.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-reference-data
  cancel-in-progress: false

jobs:
  banxico-reference:
    name: Banxico Reference
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate registry and runtime contract
        run: |
          python scripts/catalog_registry.py validate
          python scripts/render_dataset_contract.py --check

      - name: Build reviewed Banxico bundle
        run: |
          python scripts/banxico/build_reference.py \
            --output-dir dist/catalog-artifacts/banxico-reference
          git diff --exit-code -- packages/shared-data/banxico

      - name: Publish immutable bundle and move channel pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          dir=dist/catalog-artifacts/banxico-reference
          contract=packages/python/catalogmx/data/dataset_contract.json
          channel=$(jq -r '.datasets["banxico.reference"].artifact.channel' "$contract")
          artifact_name=$(jq -r '.datasets["banxico.reference"].artifact.file' "$contract")
          manifest_name=$(jq -r '.datasets["banxico.reference"].artifact.manifest' "$contract")
          version=$(jq -r '.datasets["banxico.reference"].artifact.version' "$contract")
          manifest="$dir/$manifest_name"
          artifact="$dir/$artifact_name"
          content_sha=$(jq -r '.dataset.content_sha256' "$manifest")
          immutable="data-banxico-reference-${version}-${content_sha}"
          verify_dir=$(mktemp -d)
          trap 'rm -rf "$verify_dir"' EXIT

          pointer=$(jq -cn \
            --arg dataset_id "banxico.reference" \
            --arg dataset_version "$version" \
            --arg release_tag "$immutable" \
            --arg content_sha256 "$content_sha" \
            --arg artifact "$artifact_name" \
            --arg manifest "$manifest_name" \
            '{
              schema_version: 1,
              dataset_id: $dataset_id,
              dataset_version: $dataset_version,
              release_tag: $release_tag,
              content_sha256: $content_sha256,
              artifact: $artifact,
              manifest: $manifest
            }')

          previous_sha=""
          previous_release_tag=""
          if gh release view "$channel" >/dev/null 2>&1; then
            previous_body=$(gh release view "$channel" --json body --jq '.body' || true)
            previous_sha=$(printf '%s' "$previous_body" \
              | jq -r '.content_sha256 // empty' 2>/dev/null || true)
            previous_release_tag=$(printf '%s' "$previous_body" \
              | jq -r '.release_tag // empty' 2>/dev/null || true)
          fi

          notes="CatalogMX reviewed Banco de México reference-data bundle. Semantic content SHA-256: $content_sha. The manifest records the exact files and SHA-256 digests. This data release is independent from library package versions."

          verify_immutable() {
            rm -rf "$verify_dir"
            mkdir -p "$verify_dir"
            if ! gh release download "$immutable" \
              --pattern "$artifact_name" \
              --pattern "$manifest_name" \
              --dir "$verify_dir"; then
              return 1
            fi
            [ -f "$verify_dir/$artifact_name" ] || return 1
            [ -f "$verify_dir/$manifest_name" ] || return 1
            cmp "$artifact" "$verify_dir/$artifact_name" || return 1
            cmp "$manifest" "$verify_dir/$manifest_name" || return 1
            remote_sha=$(jq -r '.dataset.content_sha256 // empty' \
              "$verify_dir/$manifest_name")
            [ "$remote_sha" = "$content_sha" ]
          }

          create_immutable() {
            gh release create "$immutable" "$artifact" "$manifest" \
              --title "banxico.reference $version $content_sha" \
              --notes "$notes" \
              --target "${GITHUB_SHA}"
          }

          # Immutable releases own the artifact/manifest pair. A failed first
          # upload can leave an incomplete release, so a retry verifies it and
          # safely recreates it only when the live channel does not point there.
          if gh release view "$immutable" >/dev/null 2>&1; then
            if ! verify_immutable; then
              if [ "$previous_release_tag" = "$immutable" ]; then
                echo "Live immutable release is incomplete; refusing to mutate the current channel target" >&2
                exit 1
              fi
              gh release delete "$immutable" --cleanup-tag --yes
              create_immutable
            fi
          else
            create_immutable
          fi

          if ! verify_immutable; then
            echo "Immutable release is incomplete or does not match the reviewed build" >&2
            exit 1
          fi

          if [ "$previous_sha" = "$content_sha" ] \
             && [ "$previous_release_tag" = "$immutable" ]; then
            echo "banxico.reference unchanged and verified: $content_sha"
            exit 0
          fi

          # The channel contains only a JSON metadata pointer. Editing one
          # metadata field is the publication commit: until this succeeds,
          # clients continue to resolve the previous immutable release.
          if gh release view "$channel" >/dev/null 2>&1; then
            gh release edit "$channel" \
              --title "banxico.reference $version (latest)" \
              --notes "$pointer" \
              --target "${GITHUB_SHA}"
          else
            gh release create "$channel" \
              --title "banxico.reference $version (latest)" \
              --notes "$pointer" \
              --target "${GITHUB_SHA}"
          fi

          {
            echo '## Banxico reference publication'
            echo
            echo "- Content SHA-256: \`$content_sha\`"
            echo "- Immutable tag: \`$immutable\`"
            echo "- Channel tag: \`$channel\`"
            echo "- Channel publication: metadata pointer only"
          } >> "$GITHUB_STEP_SUMMARY"
