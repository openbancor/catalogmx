name: Inspect SAT runtime schemas

on:
  push:
    branches:
      - feat/resolver-backed-sat-consumers

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect published SQLite schemas
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sqlite3
          import urllib.request
          from pathlib import Path

          datasets = {
              "cfdi": (
                  "https://github.com/openbancor/catalogmx/releases/download/"
                  "data-sat-cfdi-4-4-0-6a15f6bdf37682967be4105d1522de7e9d5401fc0e74ce944bc633d6d05347f6/"
                  "sat_cfdi_40.sqlite3",
                  [
                      "cfdi_40_claves_unidades",
                      "cfdi_40_formas_pago",
                      "cfdi_40_meses",
                      "cfdi_40_usos_cfdi",
                      "cfdi_40_regimenes_fiscales",
                  ],
              ),
              "nomina": (
                  "https://github.com/openbancor/catalogmx/releases/download/"
                  "data-sat-nomina-1-2-1-2-revision-e-db29162b14f533a6af37970d1da88c45ae1be5945c57bd1efa12f1b88cb2e75c/"
                  "sat_nomina_12.sqlite3",
                  [],
              ),
          }

          for name, (url, requested_tables) in datasets.items():
              path = Path(f"/tmp/{name}.sqlite3")
              urllib.request.urlretrieve(url, path)
              con = sqlite3.connect(path)
              try:
                  all_tables = [r[0] for r in con.execute(
                      "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"
                  )]
                  tables = requested_tables or all_tables
                  print(f"=== {name} tables ===")
                  print(json.dumps(all_tables, ensure_ascii=False))
                  for table in tables:
                      columns = [dict(zip(
                          ["cid", "name", "type", "notnull", "default", "pk"], row
                      )) for row in con.execute(f'PRAGMA table_info("{table}")')]
                      rows = con.execute(f'SELECT * FROM "{table}" LIMIT 3').fetchall()
                      print(f"=== {name}:{table} ===")
                      print("columns=" + json.dumps(columns, ensure_ascii=False))
                      print("rows=" + json.dumps(rows, ensure_ascii=False, default=str))
              finally:
                  con.close()
          PY
