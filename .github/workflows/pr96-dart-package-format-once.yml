name: PR96 Dart Package Format Once

on:
  push:
    branches:
      - fix/fiscal-integrity-2026
    paths:
      - '.github/workflows/pr96-dart-package-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fiscal-integrity-2026
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Reproduce Dart CI package context
        working-directory: packages/dart
        run: |
          flutter pub get
          git checkout -- analysis_options.yaml
          dart format lib/src/calculators/imss.dart
      - name: Commit formatter-only change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/dart/lib/src/calculators/imss.dart
          git diff --cached --check
          git commit -m "style(dart): format IMSS guards in CI package context"
          git push origin HEAD:fix/fiscal-integrity-2026
