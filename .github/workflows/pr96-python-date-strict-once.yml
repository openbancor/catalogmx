name: PR96 Strict Python Date Once

on:
  push:
    branches:
      - fix/fiscal-integrity-2026
    paths:
      - '.github/workflows/pr96-python-date-strict-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fiscal-integrity-2026
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply strict date-only parsing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/python/catalogmx/calculators/imss.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import math\n', 'import math\nimport re\n', 1)
          old = '''    try:\n        return date.fromisoformat(fecha[:10]).isoformat()\n    except (TypeError, ValueError) as exc:\n        raise ValueError(f"Fecha inválida: {fecha}") from exc\n'''
          new = '''    if not isinstance(fecha, str) or re.fullmatch(r"\\d{4}-\\d{2}-\\d{2}", fecha) is None:\n        raise ValueError(f"Fecha inválida: {fecha}")\n    try:\n        return date.fromisoformat(fecha).isoformat()\n    except ValueError as exc:\n        raise ValueError(f"Fecha inválida: {fecha}") from exc\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one _to_iso_date string block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('packages/python/tests/test_imss_vectors_shared.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '''def test_public_date_aware_uma_helper() -> None:\n    assert get_uma_for_date("2026-01-31")["diaria"] == 113.14\n    assert get_uma_for_date("2026-02-01")["diaria"] == 117.31\n'''
          replacement = marker + '''\n\ndef test_public_date_aware_uma_helper_rejects_non_date_strings() -> None:\n    for invalid in ("2026-01-31junk", "2026-01-31T23:59:00", "2026-02-31"):\n        with pytest.raises(ValueError, match="Fecha inválida"):\n            get_uma_for_date(invalid)\n'''
          if tests.count(marker) != 1:
              raise SystemExit(f'expected one public UMA helper test, found {tests.count(marker)}')
          test_path.write_text(tests.replace(marker, replacement, 1), encoding='utf-8')
          PY
      - name: Validate Python change
        working-directory: packages/python
        run: |
          pip install -e '.[dev]'
          ruff check --fix tests/test_imss_vectors_shared.py
          black catalogmx/calculators/imss.py tests/test_imss_vectors_shared.py
          ruff check catalogmx/ tests/test_imss_vectors_shared.py
          black --check catalogmx/ tests/test_imss_vectors_shared.py
          pytest tests/test_imss_vectors_shared.py -v
      - name: Commit strict parser
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/python/catalogmx/calculators/imss.py packages/python/tests/test_imss_vectors_shared.py
          git diff --cached --check
          git commit -m "fix(python): require exact IMSS date strings"
          git push origin HEAD:fix/fiscal-integrity-2026
