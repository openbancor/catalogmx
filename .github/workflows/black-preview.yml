name: Black Preview

on:
  pull_request:
    branches: [master]

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Black
        run: python -m pip install 'black==26.5.1'
      - name: Show exact formatter diff
        working-directory: packages/python
        run: black --diff --check catalogmx/data/cli.py catalogmx/data/resolver.py
