name: Validate CFDI resolver consumers

on:
  push:
    branches:
      - feat/resolver-backed-cfdi-consumers

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/resolver-backed-cfdi-consumers
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e 'packages/python[dev]'
      - name: Static checks
        run: |
          ruff check packages/python/catalogmx/catalogs/sat/cfdi_4 packages/python/tests/test_sat_cfdi_resolver_consumers.py
          black --check packages/python/catalogmx/catalogs/sat/cfdi_4 packages/python/tests/test_sat_cfdi_resolver_consumers.py
          git diff --check
      - name: Deterministic resolver-backed fixture
        working-directory: packages/python
        run: pytest -q tests/test_sat_cfdi_resolver_consumers.py
      - name: Historical CFDI API regression tests
        working-directory: packages/python
        run: |
          pytest -q \
            tests/test_clave_unidad_complete.py \
            tests/test_new_catalogs.py \
            tests/test_all_catalog_loading.py
