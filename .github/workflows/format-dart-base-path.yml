name: Format Dart shared-data path fix

on:
  push:
    branches:
      - feat/sat-nomina-api-parity

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[dart-base-formatted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sat-nomina-api-parity
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Format in exact Dart CI context
        working-directory: packages/dart
        run: |
          flutter pub get
          git checkout -- analysis_options.yaml
          dart format lib/src/catalogs/base_catalog.dart test/base_catalog_test.dart
          git checkout -- pubspec.lock 2>/dev/null || true

      - name: Verify formatter scope
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          printf '%s\n' "$changed" | grep -qx 'packages/dart/lib/src/catalogs/base_catalog.dart'
          printf '%s\n' "$changed" | grep -qx 'packages/dart/test/base_catalog_test.dart'
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 2

      - name: Commit and remove helper
        run: |
          rm .github/workflows/format-dart-base-path.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/dart/lib/src/catalogs/base_catalog.dart packages/dart/test/base_catalog_test.dart .github/workflows/format-dart-base-path.yml
          git diff --cached --check
          git commit -m "style(dart): format shared-data path fix [dart-base-formatted]"
          git push origin HEAD:feat/sat-nomina-api-parity
