name: Run CFDI consumer patcher

on:
  push:
    branches:
      - feat/resolver-backed-cfdi-consumers

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'cut over CFDI JSON consumers') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/resolver-backed-cfdi-consumers
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch and validate modules
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_cutover_cfdi_consumers.py
          python -m pip install -e 'packages/python[dev]'
          ruff check --fix packages/python/catalogmx/catalogs/sat/cfdi_4
          black packages/python/catalogmx/catalogs/sat/cfdi_4
          ruff check packages/python/catalogmx/catalogs/sat/cfdi_4
          git diff --check
          python -m compileall -q packages/python/catalogmx/catalogs/sat/cfdi_4
      - name: Commit cutover
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/_cutover_cfdi_consumers.py
          git config user.name 'catalogmx-data[bot]'
          git config user.email 'catalogmx-data[bot]@users.noreply.github.com'
          git add packages/python/catalogmx/catalogs/sat/cfdi_4 scripts/_cutover_cfdi_consumers.py
          git commit -m 'refactor(data): cut over CFDI JSON consumers'
          git push origin HEAD:feat/resolver-backed-cfdi-consumers
