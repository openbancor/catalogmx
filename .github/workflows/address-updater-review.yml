name: Address DataUpdater review

on:
  push:
    branches:
      - feat/finish-data-lifecycle

permissions:
  contents: write

jobs:
  address-review:
    if: ${{ !contains(github.event.head_commit.message, 'honor resolver runtime policy') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/finish-data-lifecycle
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply runtime mode and TTL precedence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          updater = Path('packages/python/catalogmx/data/updater.py')
          text = updater.read_text(encoding='utf-8')
          text = text.replace(
              '    def auto_update(self, max_age_hours: int = 24, verbose: bool = False) -> Path:\n',
              '    def auto_update(\n        self, max_age_hours: int | float | None = None, verbose: bool = False\n    ) -> Path:\n',
              1,
          )
          text = text.replace(
              '''        ``max_age_hours`` is retained for API compatibility and is translated to\n        the resolver TTL. Network failures prefer a previously verified resolver\n        object and may use the explicitly declared package bootstrap only when no\n        verified cache is available.\n        """\n        mode = "refresh" if AUTO_UPDATE_ENABLED else "offline"\n        resolver = self._resolver(mode=mode, max_age_hours=max_age_hours)\n''',
              '''        An explicitly supplied ``max_age_hours`` remains a legacy TTL override.\n        When omitted, ``CATALOGMX_CACHE_TTL`` and then the dataset registry SLA\n        remain authoritative. ``CATALOGMX_DATA_MODE`` likewise takes precedence\n        over the legacy auto-update flag when explicitly configured.\n        """\n        configured_mode = os.getenv("CATALOGMX_DATA_MODE")\n        mode = configured_mode or ("refresh" if AUTO_UPDATE_ENABLED else "offline")\n        resolver = self._resolver(mode=mode, max_age_hours=max_age_hours)\n''',
              1,
          )
          text = text.replace(
              '    def get_database_path(self, auto_update: bool = True, max_age_hours: int = 24) -> Path:\n',
              '    def get_database_path(\n        self, auto_update: bool = True, max_age_hours: int | float | None = None\n    ) -> Path:\n',
              1,
          )
          text = text.replace(
              'def get_database_path(auto_update: bool = True, max_age_hours: int = 24) -> Path:\n',
              'def get_database_path(\n    auto_update: bool = True, max_age_hours: int | float | None = None\n) -> Path:\n',
              1,
          )
          updater.write_text(text, encoding='utf-8')

          banxico = Path('packages/python/catalogmx/catalogs/banxico')
          changed = []
          for path in sorted(banxico.glob('*_sqlite.py')):
              source = path.read_text(encoding='utf-8')
              updated = source.replace(', max_age_hours=24', '')
              if updated != source:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.as_posix())
          if not changed:
              raise SystemExit('no Banxico SQLite adapter TTL overrides were removed')
          print('updated adapters:', ', '.join(changed))
          PY

      - name: Update regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/python/tests/test_data_updater.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '''    resolver_type.assert_called_once_with(\n        cache_dir=tmp_path / "cache",\n        mode="offline",\n        cache_ttl_seconds=86400,\n    )\n''',
              '''    resolver_type.assert_called_once_with(\n        cache_dir=tmp_path / "cache",\n        mode="offline",\n        cache_ttl_seconds=None,\n    )\n''',
              1,
          )
          text += '''\n\n@pytest.mark.parametrize("data_mode", ["offline", "fetch-missing", "refresh"])\ndef test_explicit_data_mode_outranks_legacy_auto_update_flag(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch, data_mode: str\n) -> None:\n    root = tmp_path / "dynamic"\n    database = _database(root)\n    resolver = mock.Mock()\n    resolver.resolve_dataset_root.return_value = root\n    monkeypatch.setenv("CATALOGMX_DATA_MODE", data_mode)\n\n    with (\n        mock.patch.object(updater_module, "AUTO_UPDATE_ENABLED", True),\n        mock.patch(\n            "catalogmx.data.updater.DatasetResolver", return_value=resolver\n        ) as resolver_type,\n    ):\n        updater = DataUpdater(cache_dir=tmp_path / "cache")\n        assert updater.auto_update() == database\n\n    resolver_type.assert_called_once_with(\n        cache_dir=tmp_path / "cache",\n        mode=data_mode,\n        cache_ttl_seconds=None,\n    )\n\n\ndef test_environment_ttl_reaches_default_dynamic_consumer(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    monkeypatch.setenv("CATALOGMX_CACHE_TTL", "86400")\n    updater = DataUpdater(cache_dir=tmp_path / "cache")\n    resolver = updater._resolver(mode="refresh")\n    assert resolver.cache_ttl_seconds == 86400\n\n\ndef test_registry_freshness_applies_when_no_legacy_or_environment_ttl(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    monkeypatch.delenv("CATALOGMX_CACHE_TTL", raising=False)\n    updater = DataUpdater(cache_dir=tmp_path / "cache")\n    resolver = updater._resolver(mode="refresh")\n    dataset = resolver._dataset(DATASET_ID)\n    assert resolver.cache_ttl_seconds is None\n    assert resolver._cache_ttl(dataset) == 2 * 86400\n'''
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate review fixes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e 'packages/python[dev]'
          ruff check --fix packages/python/catalogmx/data/updater.py packages/python/catalogmx/catalogs/banxico packages/python/tests/test_data_updater.py
          black packages/python/catalogmx/data/updater.py packages/python/catalogmx/catalogs/banxico packages/python/tests/test_data_updater.py
          ruff check packages/python/catalogmx/data/updater.py packages/python/catalogmx/catalogs/banxico packages/python/tests/test_data_updater.py
          git diff --check
          cd packages/python
          pytest -q tests/test_data_updater.py tests/test_banxico_dynamic_resolver.py tests/test_python_wheel_lifecycle_contract.py tests/test_dataset_resolver.py tests/test_dataset_resolver_hardening.py

      - name: Commit review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'catalogmx-lifecycle[bot]'
          git config user.email 'catalogmx-lifecycle[bot]@users.noreply.github.com'
          git add packages/python/catalogmx/data/updater.py packages/python/catalogmx/catalogs/banxico packages/python/tests/test_data_updater.py
          git commit -m 'fix(data): honor resolver runtime policy'
          git push origin HEAD:feat/finish-data-lifecycle
