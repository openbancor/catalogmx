name: Generate fiscal manifest

on:
  push:
    branches:
      - fix/fiscal-integrity-2026

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fiscal-integrity-2026
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate manifest
        run: python scripts/build_fiscal_manifest.py
      - name: Commit generated artifacts
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- packages/shared-data/fiscal-manifest.json packages/typescript/src/fiscal/manifest.generated.ts)" ]; then
            exit 0
          fi
          git config user.name 'catalogmx-data[bot]'
          git config user.email 'catalogmx-data[bot]@users.noreply.github.com'
          git add packages/shared-data/fiscal-manifest.json packages/typescript/src/fiscal/manifest.generated.ts
          git commit -m 'feat(data): generate fiscal manifest artifacts'
          git push origin HEAD:fix/fiscal-integrity-2026
