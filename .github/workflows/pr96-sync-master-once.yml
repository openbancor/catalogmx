name: PR96 Sync Master Once

on:
  push:
    branches:
      - fix/fiscal-integrity-2026
    paths:
      - '.github/workflows/pr96-sync-master-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fiscal-integrity-2026
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge current master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git merge --no-edit origin/master
          git status --short
          git diff --check HEAD^1..HEAD
      - name: Validate fiscal artifacts
        run: |
          python scripts/build_fiscal_manifest.py --check
      - name: Validate TypeScript fiscal surface
        working-directory: packages/typescript
        run: |
          npm ci
          npm run format:check
          npm run typecheck
          npx jest tests/imss-vectors.test.ts tests/fiscal-history.test.ts --runInBand
      - name: Push synchronized branch
        run: |
          git push origin HEAD:fix/fiscal-integrity-2026
