name: PR96 Integrity Repair V2

on:
  push:
    branches:
      - fix/fiscal-integrity-2026
    paths:
      - '.github/workflows/pr96-integrity-repair-v2.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fiscal-integrity-2026
          fetch-depth: 0

      - name: Apply integrity fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          def insert_before(text: str, marker: str, insertion: str, label: str) -> str:
              count = text.count(marker)
              print(f'{label}: marker count={count}')
              if count != 1:
                  raise SystemExit(f'{label}: expected one marker, found {count}')
              return text.replace(marker, insertion + marker, 1)

          def insert_before_after(text: str, start: str, marker: str, insertion: str, label: str) -> str:
              start_pos = text.find(start)
              if start_pos < 0:
                  raise SystemExit(f'{label}: function marker not found')
              marker_pos = text.find(marker, start_pos)
              if marker_pos < 0:
                  raise SystemExit(f'{label}: target marker not found after function marker')
              return text[:marker_pos] + insertion + text[marker_pos:]

          # TypeScript
          ts_path = 'packages/typescript/src/calculators/imss-calculator.ts'
          ts = read(ts_path)
          if 'assertFechaMatchesExercise' not in ts:
              ts = insert_before(
                  ts,
                  "  static getSalarioMinimo(year: IMSSYear, zona: ZonaSalario = 'general'): number {",
                  """  private static assertFechaMatchesExercise(
            year: IMSSYear,
            fecha?: string | Date
          ): void {
            if (fecha === undefined) return;
            const iso = this.toIsoDate(fecha);
            if (Number(iso.slice(0, 4)) !== year) {
              throw new RangeError(`La fecha ${iso} no pertenece al ejercicio ${year}`);
            }
          }

          """,
                  'ts helper',
              )
              for fn in (
                  'static getCEAVPatronRate(',
                  'static calcularCuotasObreroPatronales(',
                  'static calcularModalidad40(',
                  'static calcularModalidad10(',
              ):
                  ts = insert_before_after(
                      ts,
                      fn,
                      '    this.loadTablesData();',
                      '    this.assertFechaMatchesExercise(year, fecha);\n',
                      f'ts {fn}',
                  )

          to_iso_start = ts.find('  private static toIsoDate(fecha: string | Date): string {')
          if to_iso_start < 0:
              raise SystemExit('ts toIsoDate not found')
          to_iso_tail = ts[to_iso_start:]
          old_block = re.search(
              r"    if \(typeof fecha === 'string'\) \{\n.*?      return match\[0\];\n    \}",
              to_iso_tail,
              flags=re.S,
          )
          if old_block:
              strict_block = """    if (typeof fecha === 'string') {
                const match = /^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(fecha);
                if (!match) {
                  throw new Error(`Fecha inválida: ${fecha}`);
                }
                const year = Number(match[1]);
                const month = Number(match[2]);
                const day = Number(match[3]);
                const parsed = new Date(Date.UTC(year, month - 1, day));
                if (
                  parsed.getUTCFullYear() !== year ||
                  parsed.getUTCMonth() !== month - 1 ||
                  parsed.getUTCDate() !== day
                ) {
                  throw new Error(`Fecha inválida: ${fecha}`);
                }
                return fecha;
              }"""
              absolute_start = to_iso_start + old_block.start()
              absolute_end = to_iso_start + old_block.end()
              ts = ts[:absolute_start] + strict_block + ts[absolute_end:]
          elif "const match = /^(\\d{4})-(\\d{2})-(\\d{2})$/" not in to_iso_tail:
              raise SystemExit('ts toIsoDate string block not recognized')
          write(ts_path, ts)

          ts_test_path = 'packages/typescript/tests/fiscal-history.test.ts'
          ts_test = read(ts_test_path)
          if 'rejects invalid calendar dates and dates from another exercise' not in ts_test:
              ts_test = insert_before(
                  ts_test,
                  "  test('keeps CEAV patronal rates by exercise instead of overwriting history', () => {",
                  """  test('rejects invalid calendar dates and dates from another exercise', () => {
            expect(() => IMSSCalculator.getUMAForDate('2026-02-31')).toThrow('Fecha inválida');
            expect(() =>
              IMSSCalculator.calcularCuotasObreroPatronales(500, 30, 2026, 2, '2025-12-31')
            ).toThrow('no pertenece al ejercicio 2026');
            expect(() => IMSSCalculator.getCEAVPatronRate(315.04, 2026, '2025-12-31')).toThrow(
              'no pertenece al ejercicio 2026'
            );
            expect(() => IMSSCalculator.calcularModalidad40(15000, 12000, 2026, '2025-12-31')).toThrow(
              'no pertenece al ejercicio 2026'
            );
            expect(() => IMSSCalculator.calcularModalidad10(10000, 2026, '2025-12-31')).toThrow(
              'no pertenece al ejercicio 2026'
            );
          });

          """,
                  'ts tests',
              )
          write(ts_test_path, ts_test)

          # Python
          py_path = 'packages/python/catalogmx/calculators/imss.py'
          py = read(py_path)
          if '_assert_fecha_matches_exercise' not in py:
              py = insert_before(
                  py,
                  'def get_salario_minimo(',
                  """def _assert_fecha_matches_exercise(
              year: IMSSYear, fecha: DateInput | None
          ) -> None:
              \"\"\"Reject an effective date whose calendar year differs from the exercise.\"\"\"
              if fecha is None:
                  return
              iso = _to_iso_date(fecha)
              if int(iso[:4]) != year:
                  raise ValueError(f\"La fecha {iso} no pertenece al ejercicio {year}\")


          """,
                  'python helper',
              )
              for fn in (
                  'def _get_ceav_patron_rate(',
                  'def calcular_cuotas_obrero_patronales(',
                  'def calcular_modalidad_40(',
                  'def calcular_modalidad_10(',
              ):
                  py = insert_before_after(
                      py,
                      fn,
                      '    tables = _load_imss_tables()',
                      '    _assert_fecha_matches_exercise(year, fecha)\n',
                      f'python {fn}',
                  )
          write(py_path, py)

          py_test_path = 'packages/python/tests/test_imss_vectors_shared.py'
          py_test = read(py_test_path)
          if 'test_imss_date_must_match_selected_exercise' not in py_test:
              py_test += """

          def test_imss_date_must_match_selected_exercise() -> None:
              with pytest.raises(ValueError, match="no pertenece al ejercicio 2026"):
                  calcular_cuotas_obrero_patronales(500, 30, 2026, 2, "2025-12-31")
              with pytest.raises(ValueError, match="no pertenece al ejercicio 2026"):
                  calcular_modalidad_40(15000, 12000, 2026, "2025-12-31")
              with pytest.raises(ValueError, match="no pertenece al ejercicio 2026"):
                  calcular_modalidad_10(10000, 2026, "2025-12-31")
          """
          write(py_test_path, py_test)

          # Dart
          dart_path = 'packages/dart/lib/src/calculators/imss.dart'
          dart = read(dart_path)
          if '_assertFechaMatchesExercise' not in dart:
              dart = insert_before(
                  dart,
                  '  static bool _almostEqual(double left, double right) {',
                  """  static void _assertFechaMatchesExercise(
            IMSSYear year,
            DateTime? fecha,
          ) {
            if (fecha != null && fecha.year != year.value) {
              throw ArgumentError(
                'La fecha no pertenece al ejercicio ${year.value}',
              );
            }
          }

          """,
                  'dart helper',
              )
              for fn in (
                  'static double _getCEAVPatronRate(',
                  'static CuotasIMSSResult calcularCuotasObreroPatronales(',
                  'static Modalidad40Result calcularModalidad40(',
                  'static Modalidad10Result calcularModalidad10(',
              ):
                  dart = insert_before_after(
                      dart,
                      fn,
                      '    final tables = _loadIMSSTables();',
                      '    _assertFechaMatchesExercise(year, fecha);\n',
                      f'dart {fn}',
                  )
          write(dart_path, dart)

          dart_test_path = 'packages/dart/test/imss_vectors_test.dart'
          dart_test = read(dart_test_path)
          if 'IMSS calculations reject dates from another exercise' not in dart_test:
              dart_test = insert_before(
                  dart_test,
                  "  test('Modalidad 40 rejects non-finite requested salary', () {",
                  """  test('IMSS calculations reject dates from another exercise', () {
            final wrongDate = DateTime(2025, 12, 31);
            expect(
              () => IMSSCalculator.calcularCuotasObreroPatronales(
                500,
                year: IMSSYear.year2026,
                fecha: wrongDate,
              ),
              throwsArgumentError,
            );
            expect(
              () => IMSSCalculator.calcularModalidad40(
                15000,
                ultimoSbcMensual: 12000,
                year: IMSSYear.year2026,
                fecha: wrongDate,
              ),
              throwsArgumentError,
            );
            expect(
              () => IMSSCalculator.calcularModalidad10(
                10000,
                year: IMSSYear.year2026,
                fecha: wrongDate,
              ),
              throwsArgumentError,
            );
          });

          """,
                  'dart tests',
              )
          write(dart_test_path, dart_test)

          # Fiscal manifest generator parity gate
          gen_path = 'scripts/build_fiscal_manifest.py'
          gen = read(gen_path)
          if 'ensure_imss_parameter_parity' not in gen:
              gen = insert_before(
                  gen,
                  'def build_manifest() -> dict[str, Any]:',
                  """def ensure_imss_parameter_parity(
              uma_rows: list[dict[str, Any]],
              wage_rows: list[dict[str, Any]],
              imss: dict[str, Any],
          ) -> None:
              \"\"\"Ensure canonical fiscal parameters match the IMSS runtime copy.\"\"\"
              canonical_uma = {int(row[\"año\"]): row for row in uma_rows}
              canonical_wages = {int(row[\"año\"]): row for row in wage_rows}
              errors: list[str] = []

              for year in sorted(VERIFIED_YEARS):
                  runtime_uma = imss.get(\"uma\", {}).get(str(year))
                  source_uma = canonical_uma.get(year)
                  if runtime_uma is None or source_uma is None:
                      errors.append(f\"UMA {year}: missing canonical/runtime row\")
                  else:
                      for source_key, runtime_key in (
                          (\"valor_diario\", \"diaria\"),
                          (\"valor_mensual\", \"mensual\"),
                          (\"valor_anual\", \"anual\"),
                          (\"vigencia_inicio\", \"vigencia_desde\"),
                          (\"vigencia_fin\", \"vigencia_hasta\"),
                      ):
                          if source_uma.get(source_key) != runtime_uma.get(runtime_key):
                              errors.append(
                                  f\"UMA {year}:{runtime_key} canonical={source_uma.get(source_key)!r} \"
                                  f\"runtime={runtime_uma.get(runtime_key)!r}\"
                              )

                  runtime_wage = imss.get(\"salario_minimo\", {}).get(str(year))
                  source_wage = canonical_wages.get(year)
                  if runtime_wage is None or source_wage is None:
                      errors.append(f\"Salario mínimo {year}: missing canonical/runtime row\")
                  else:
                      for source_key, runtime_key in (
                          (\"resto_pais\", \"general\"),
                          (\"zona_frontera_norte\", \"frontera\"),
                          (\"vigencia_inicio\", \"vigencia_desde\"),
                      ):
                          if source_wage.get(source_key) != runtime_wage.get(runtime_key):
                              errors.append(
                                  f\"Salario mínimo {year}:{runtime_key} \"
                                  f\"canonical={source_wage.get(source_key)!r} \"
                                  f\"runtime={runtime_wage.get(runtime_key)!r}\"
                              )

              if errors:
                  raise SystemExit(
                      \"IMSS canonical/runtime parameter drift: \" + \"; \".join(errors)
                  )


          """,
                  'manifest parity helper',
              )
              call_marker = '    sources = dict(imss.get("_meta", {}).get("sources", {}))'
              gen = insert_before(
                  gen,
                  call_marker,
                  '    ensure_imss_parameter_parity(uma_rows, wage_rows, imss)\n\n',
                  'manifest parity call',
              )
          write(gen_path, gen)
          PY

      - name: Validate patched sources
        run: |
          python -m py_compile packages/python/catalogmx/calculators/imss.py scripts/build_fiscal_manifest.py
          python scripts/build_fiscal_manifest.py --check
          git diff --check

      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/typescript/src/calculators/imss-calculator.ts \
                  packages/typescript/tests/fiscal-history.test.ts \
                  packages/python/catalogmx/calculators/imss.py \
                  packages/python/tests/test_imss_vectors_shared.py \
                  packages/dart/lib/src/calculators/imss.dart \
                  packages/dart/test/imss_vectors_test.dart \
                  scripts/build_fiscal_manifest.py
          git commit -m "fix(imss): enforce fiscal date and parameter integrity"
          git push origin HEAD:fix/fiscal-integrity-2026
