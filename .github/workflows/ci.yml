name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # YAML Lint - Validates all YAML files
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}, truthy: disable}}" .github/workflows/

  # Python Testing and Linting
  python-tests:
    name: Python ${{ matrix.python-version }} Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    defaults:
      run:
        working-directory: packages/python

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check catalogmx/

      - name: Check format with black
        run: |
          black --check catalogmx/

      - name: Type check with mypy
        run: |
          mypy catalogmx/
        continue-on-error: true  # Don't fail on type errors yet

      - name: Run tests with pytest
        run: |
          pytest tests/ -v --cov=catalogmx --cov-report=xml --cov-report=term-missing --cov-branch

      - name: Check coverage threshold (100%)
        run: |
          coverage report --fail-under=100
        continue-on-error: true  # Don't fail build yet, just warn

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./packages/python/coverage.xml
          flags: python
          name: python-${{ matrix.python-version }}
        if: matrix.python-version == '3.12'
        continue-on-error: true  # Don't fail if codecov upload fails

  # TypeScript Testing and Linting
  typescript-tests:
    name: TypeScript Node ${{ matrix.node-version }} Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    defaults:
      run:
        working-directory: packages/typescript

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Lint with ESLint
        run: npm run lint

      - name: Format check with Prettier
        run: npm run format:check

      - name: Type check with TypeScript
        run: npm run typecheck

      - name: Run tests with Jest
        run: npm run test:coverage

      - name: Check coverage threshold (100%)
        run: |
          node -e "
            const coverage = require('./coverage/coverage-summary.json');
            const total = coverage.total;
            const metrics = ['lines', 'statements', 'functions', 'branches'];
            let failed = false;
            metrics.forEach(metric => {
              if (total[metric].pct < 100) {
                console.log(\`❌ ${metric}: ${total[metric].pct}% (expected 100%)\`);
                failed = true;
              } else {
                console.log(\`✅ ${metric}: ${total[metric].pct}%\`);
              }
            });
            if (failed) {
              console.log('⚠️  Coverage is below 100% threshold');
              process.exit(0);  // Don't fail yet, just warn
            } else {
              console.log('✅ All coverage metrics at 100%!');
            }
          "
        continue-on-error: true  # Don't fail build yet, just warn

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./packages/typescript/coverage/coverage-final.json
          flags: typescript
          name: typescript-node-${{ matrix.node-version }}
        if: matrix.node-version == '20'
        continue-on-error: true  # Don't fail if codecov upload fails

  # Svelte webapp type checking and production build
  webapp-tests:
    name: Svelte Webapp
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/webapp-svelte

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/webapp-svelte/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type and Svelte check
        run: npm run check

      - name: Production build
        run: npm run build

  # Dart/Flutter Testing and Analysis
  dart-tests:
    name: Dart ${{ matrix.dart-version }} Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dart-version: [stable, beta]

    defaults:
      run:
        working-directory: packages/dart

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.dart-version }}

      - name: Get dependencies
        run: flutter pub get

      - name: Restore Flutter-migrated analysis options
        run: git checkout -- analysis_options.yaml

      - name: Verify dependencies
        run: flutter pub deps

      - name: Analyze code
        run: dart analyze

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./packages/dart/coverage/lcov.info
          flags: dart
          name: dart-${{ matrix.dart-version }}
        if: matrix.dart-version == 'stable'
        continue-on-error: true

      - name: Dry run pub.dev publish
        run: |
          git checkout -- analysis_options.yaml
          flutter pub publish --dry-run
        if: matrix.dart-version == 'stable'

  # Kotlin/JVM Testing
  kotlin-tests:
    name: Kotlin Java ${{ matrix.java-version }} Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [11, 17, 21]

    defaults:
      run:
        working-directory: packages/kotlin

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run tests with Gradle
        run: ./gradlew test

      - name: Generate coverage report
        run: ./gradlew jacocoTestReport
        if: matrix.java-version == '17'

      - name: Check coverage threshold (85%)
        run: ./gradlew jacocoTestCoverageVerification
        if: matrix.java-version == '17'
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./packages/kotlin/build/reports/jacoco/test/jacocoTestReport.xml
          flags: kotlin
          name: kotlin-java-${{ matrix.java-version }}
        if: matrix.java-version == '17'
        continue-on-error: true

      - name: Run detekt
        run: ./gradlew detekt
        continue-on-error: true

      - name: Build package
        run: ./gradlew build

  # Combined Quality Check
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [python-tests, typescript-tests, webapp-tests, dart-tests, kotlin-tests]
    steps:
      - name: All tests passed
        run: echo "✅ All quality checks passed!"
