name: Format tax identity

on:
  push:
    branches:
      - feat/resolver-backed-tax-identity

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/resolver-backed-tax-identity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Format
        run: |
          python -m pip install black ruff
          black packages/python/catalogmx/catalogs/sat/comercio_exterior/registro_ident_trib.py
          ruff check --fix packages/python/catalogmx/catalogs/sat/comercio_exterior/registro_ident_trib.py
          black packages/python/catalogmx/catalogs/sat/comercio_exterior/registro_ident_trib.py
          git diff --check
      - name: Commit if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'catalogmx-data[bot]'
          git config user.email 'catalogmx-data[bot]@users.noreply.github.com'
          git add packages/python/catalogmx/catalogs/sat/comercio_exterior/registro_ident_trib.py
          git commit -m 'style(data): format tax identity facade'
          git push origin HEAD:feat/resolver-backed-tax-identity
