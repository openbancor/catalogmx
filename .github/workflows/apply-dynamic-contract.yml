name: Apply Dynamic Contract

on:
  push:
    branches: [feat/data-resolver-dynamic]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/data-resolver-dynamic
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update canonical registry and generated runtime contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('packages/shared-data/catalog-registry.json')
          registry = json.loads(path.read_text(encoding='utf-8'))
          profiles = registry.setdefault('profiles', {})
          profiles['banxico-dynamic'] = {
              'description': (
                  'Banco de México SIE time-series data with independent daily refresh.'
              ),
              'datasets': ['banxico.sie_dynamic'],
          }

          dataset = next(
              item for item in registry['datasets']
              if item['id'] == 'banxico.sie_dynamic'
          )
          dataset['version'] = '1'
          dataset['artifact'] = {
              'version': '1',
              'channel': 'latest',
              'file': 'mexico_dynamic.sqlite3',
              'manifest': 'mexico_dynamic.manifest.json',
              'format': 'file',
              'mount_path': 'dynamic',
          }
          dataset['implementation'] = {
              'status': 'resolver_ready',
              'canonical_distribution': 'release',
              'release_artifact': 'mexico_dynamic.sqlite3',
              'manifest': 'mexico_dynamic.manifest.json',
              'legacy_data_updater_compatibility': True,
          }
          dataset['notes'] = (
              'Daily Banxico SIE time-series data remains independently released by '
              'update-dynamic-data.yml. The release now carries a validated manifest '
              'and is addressable through the common DatasetResolver while the legacy '
              'DataUpdater API remains a compatibility facade during migration.'
          )
          registry['inventory_checked_at'] = '2026-08-27'
          path.write_text(
              json.dumps(registry, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          python scripts/catalog_registry.py validate
          python scripts/render_dataset_contract.py
          python scripts/render_dataset_contract.py --check
          git diff --check
      - name: Commit contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/shared-data/catalog-registry.json \
            packages/python/catalogmx/data/dataset_contract.json
          git commit -m 'data: register dynamic Banxico resolver contract'
          git push origin HEAD:feat/data-resolver-dynamic
