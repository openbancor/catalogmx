name: Build and Publish SQLite Assets

on:
  push:
    branches: [main, master]
    paths:
      - "packages/shared-data/**"
      - ".github/workflows/sqlite-assets.yml"
  workflow_run:
    workflows: ["Update Dynamic Data (Daily)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download latest dynamic SQLite release asset
        run: |
          echo "📥 Downloading mexico_dynamic.sqlite3 from releases..."
          RELEASE_URL=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/tags/latest | \
            jq -r '.assets[] | select(.name == "mexico_dynamic.sqlite3") | .browser_download_url')

          if [ -z "$RELEASE_URL" ] || [ "$RELEASE_URL" = "null" ]; then
            echo "⚠️  Not found in tag 'latest', falling back to releases/latest..."
            RELEASE_URL=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | \
              jq -r '.assets[] | select(.name == "mexico_dynamic.sqlite3") | .browser_download_url')
          fi

          if [ -z "$RELEASE_URL" ] || [ "$RELEASE_URL" = "null" ]; then
            echo "❌ No mexico_dynamic.sqlite3 asset found in latest release"
            exit 1
          fi

          curl -L -o packages/shared-data/mexico_dynamic.sqlite3 "$RELEASE_URL"
          echo "✅ Downloaded mexico_dynamic.sqlite3 from latest release"

      - name: Build unified SQLite database
        working-directory: packages/shared-data
        run: |
          python build_unified_sqlite.py --output mexico.sqlite3

      - name: Close WAL mode for browser compatibility
        working-directory: packages/shared-data
        run: |
          # Close WAL on main database
          sqlite3 mexico.sqlite3 "PRAGMA wal_checkpoint(TRUNCATE); PRAGMA journal_mode=DELETE; VACUUM;"
          rm -f mexico.sqlite3-shm mexico.sqlite3-wal

          # Close WAL on individual databases
          shopt -s nullglob
          for db in sqlite/*.db sqlite/*.sqlite sqlite/*.sqlite3; do
            if [ -f "$db" ]; then
              sqlite3 "$db" "PRAGMA wal_checkpoint(TRUNCATE); PRAGMA journal_mode=DELETE; VACUUM;" || true
              rm -f "${db}-shm" "${db}-wal"
            fi
          done

          echo "✓ All databases cleaned for browser use"

      - name: Verify databases are browser-ready
        working-directory: packages/shared-data
        run: |
          echo "=== Main Database ==="
          ls -lh mexico.sqlite3
          echo "Journal mode: $(sqlite3 mexico.sqlite3 'PRAGMA journal_mode;')"
          echo "Tables: $(sqlite3 mexico.sqlite3 "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%';")"

          echo ""
          echo "=== Checking for WAL files (should be none) ==="
          ls -la *.sqlite3-* 2>/dev/null || echo "✓ No WAL files found"

      - name: Update or Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd packages/shared-data

          # Delete existing release and tag if exists
          gh release delete sqlite-assets --yes --cleanup-tag 2>/dev/null || true

          # Wait for GitHub to process deletion
          sleep 5

          # Create release notes file
          cat > release_notes.md << 'EOF'
          # Unified SQLite Databases for catalogmx

          ## mexico.sqlite3 - Complete database with all 58 catalogs

          - Optimized for browser (WAL disabled)
          - Compatible with SQLite WASM HTTP VFS
          - Ready for HTTP Range requests
          - 470,000+ records from SAT, INEGI, Banxico, SEPOMEX

          ## Individual databases - Lighter alternatives

          - sepomex.db (~25 MB)
          - localidades.db (~12 MB)
          - clave_prod_serv.db (~8 MB)

          Auto-updated on every push to main.
          Use for serverless data access.
          EOF

          # List files to upload
          echo "Files to upload:"
          ls -lh mexico.sqlite3 sqlite/*.db sqlite/*.sqlite3 2>/dev/null || true

          # Create new release with assets
          gh release create sqlite-assets \
            --repo "${GITHUB_REPOSITORY}" \
            --title "SQLite Assets (Auto-updated)" \
            --notes-file release_notes.md \
            mexico.sqlite3

          # Upload additional assets separately (more reliable)
          for f in sqlite/*.db sqlite/*.sqlite3; do
            if [ -f "$f" ]; then
              if [ "$(basename "$f")" = "mexico.sqlite3" ]; then
                continue
              fi
              echo "Uploading $f..."
              gh release upload sqlite-assets "$f" --clobber || true
            fi
          done

      - name: Summary
        run: |
          echo "✅ SQLite assets published to GitHub Releases"
          echo ""
          echo "📦 Main database:"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/sqlite-assets/mexico.sqlite3"
          echo ""
          echo "Use this URL in your webapp with SQLite WASM HTTP VFS"
