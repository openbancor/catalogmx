name: Format fiscal integrity

on:
  push:
    branches:
      - fix/fiscal-integrity-2026

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fiscal-integrity-2026
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: packages/typescript
        run: npm ci
      - name: Format
        working-directory: packages/typescript
        run: npx prettier --write src/calculators/imss-calculator.ts tests/fiscal-history.test.ts
      - name: Commit if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'catalogmx-data[bot]'
          git config user.email 'catalogmx-data[bot]@users.noreply.github.com'
          git add packages/typescript/src/calculators/imss-calculator.ts packages/typescript/tests/fiscal-history.test.ts
          git commit -m 'style(ts): format fiscal history changes'
          git push origin HEAD:fix/fiscal-integrity-2026
