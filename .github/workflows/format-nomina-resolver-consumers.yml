name: Format Nomina resolver consumers

on:
  push:
    branches:
      - feat/resolver-backed-sat-consumers

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'format Nomina resolver consumers') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/resolver-backed-sat-consumers
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Format and validate
        run: |
          python -m pip install black ruff
          black packages/python/catalogmx/catalogs/sat/_sqlite.py packages/python/catalogmx/catalogs/sat/nomina/_base.py packages/python/tests/test_sat_nomina_resolver_consumers.py
          ruff check --fix packages/python/catalogmx/catalogs/sat/_sqlite.py packages/python/catalogmx/catalogs/sat/nomina/_base.py packages/python/tests/test_sat_nomina_resolver_consumers.py
          black packages/python/catalogmx/catalogs/sat/_sqlite.py packages/python/catalogmx/catalogs/sat/nomina/_base.py packages/python/tests/test_sat_nomina_resolver_consumers.py
          ruff check packages/python/catalogmx/catalogs/sat/_sqlite.py packages/python/catalogmx/catalogs/sat/nomina/_base.py packages/python/tests/test_sat_nomina_resolver_consumers.py
          git diff --check
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'catalogmx-data[bot]'
          git config user.email 'catalogmx-data[bot]@users.noreply.github.com'
          git add packages/python/catalogmx/catalogs/sat/_sqlite.py packages/python/catalogmx/catalogs/sat/nomina/_base.py packages/python/tests/test_sat_nomina_resolver_consumers.py
          git commit -m 'style(data): format Nomina resolver consumers'
          git push origin HEAD:feat/resolver-backed-sat-consumers
