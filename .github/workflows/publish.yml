name: Publish to PyPI, NPM, pub.dev, and Maven Central

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish from the selected ref (for example, 0.7.0)
        required: true
        type: string
      source_ref:
        description: Existing version tag to build (for example, v0.7.0)
        required: true
        type: string
      publish_pypi:
        description: Publish PyPI for this existing version tag
        required: true
        default: false
        type: boolean
      pypi_artifact_run_id:
        description: Prior tag-run ID containing the verified PyPI artifact for recovery
        required: false
        type: string
      publish_maven:
        description: Publish Maven Central for this existing version tag
        required: true
        default: false
        type: boolean

jobs:
  # Preflight checks before publishing
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      source_sha: ${{ steps.get-version.outputs.source_sha }}
      publish_pypi: ${{ steps.release-mode.outputs.publish_pypi }}
      publish_maven: ${{ steps.release-mode.outputs.publish_maven }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Get version from tag
        id: get-version
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION_INPUT: ${{ inputs.version }}
          SOURCE_REF_INPUT: ${{ inputs.source_ref }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$VERSION_INPUT"
            SOURCE_REF="$SOURCE_REF_INPUT"
            if [[ "$SOURCE_REF" != "v${VERSION}" ]]; then
              echo "Manual recovery must build the matching version tag: v${VERSION}" >&2
              exit 1
            fi
            if ! git rev-parse --verify --quiet "refs/tags/${SOURCE_REF}^{commit}" >/dev/null; then
              echo "Version tag does not exist: ${SOURCE_REF}" >&2
              exit 1
            fi
            if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/tags/${SOURCE_REF}^{commit}")" ]]; then
              echo "Checked out commit does not match version tag: ${SOURCE_REF}" >&2
              exit 1
            fi
          else
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release tag: $GITHUB_REF_NAME"
              exit 1
            fi
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - name: Select release modes
        id: release-mode
        run: |
          if [[ "${{ github.event_name }}" == "push" || ("${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish_pypi }}" == "true") ]]; then
            echo "publish_pypi=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_pypi=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish_maven }}" == "true" ]]; then
            echo "publish_maven=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_maven=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Validate recovery artifact run
        if: steps.release-mode.outputs.publish_pypi != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.pypi_artifact_run_id }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "A numeric pypi_artifact_run_id is required when PyPI publication is skipped" >&2
            exit 1
          fi
          run_api="repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
          event=$(gh api "$run_api" --jq '.event')
          workflow_name=$(gh api "$run_api" --jq '.name')
          workflow_path=$(gh api "$run_api" --jq '.path')
          head_branch=$(gh api "$run_api" --jq '.head_branch')
          head_sha=$(gh api "$run_api" --jq '.head_sha')
          preflight_conclusion=$(gh api "${run_api}/jobs?per_page=100" --paginate --jq '.jobs[] | select(.name == "Preflight Checks") | .conclusion' | head -n 1)
          expected_sha=$(git rev-parse HEAD)
          if [ "$event" != "push" ] || [ "$workflow_name" != "Publish to PyPI, NPM, pub.dev, and Maven Central" ] || [ "$workflow_path" != ".github/workflows/publish.yml" ] || [ "$head_branch" != "$SOURCE_REF" ] || [ "$head_sha" != "$expected_sha" ]; then
            echo "Recovery artifact run ${RUN_ID} is not the tag push for ${SOURCE_REF} at ${expected_sha}" >&2
            exit 1
          fi
          if [ "$preflight_conclusion" != "success" ]; then
            echo "Recovery artifact run ${RUN_ID} does not have a successful preflight job" >&2
            exit 1
          fi
          echo "Recovery artifact run ${RUN_ID} is the successful preflight for ${SOURCE_REF} at ${expected_sha}"

      - name: Download verified PyPI artifact from recovery run
        if: steps.release-mode.outputs.publish_pypi != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: catalogmx-python-${{ steps.get-version.outputs.version }}
          path: packages/python/recovery-dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.pypi_artifact_run_id }}

      - name: Verify existing PyPI release for recovery
        if: steps.release-mode.outputs.publish_pypi != 'true'
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          set -euo pipefail
          metadata_file=$(mktemp)
          http_code=$(curl --silent --show-error --location --output "$metadata_file" --write-out '%{http_code}' "https://pypi.org/pypi/catalogmx/json")
          if [ "$http_code" != "200" ]; then
            echo "Cannot verify existing PyPI release: HTTP $http_code" >&2
            exit 1
          fi
          python - "$metadata_file" packages/python/recovery-dist "$VERSION" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          metadata_path, dist_dir, version = sys.argv[1:]
          metadata = json.loads(Path(metadata_path).read_text())
          releases = metadata.get("releases", {}).get(version, [])
          remote = {}
          for item in releases:
              filename = item.get("filename")
              if not filename:
                  raise SystemExit("PyPI release contains a file without a filename")
              if filename in remote:
                  raise SystemExit(f"PyPI release contains duplicate filename: {filename}")
              digest = item.get("digests", {}).get("sha256")
              if not digest:
                  raise SystemExit(f"PyPI release file lacks a SHA-256 digest: {filename}")
              remote[filename] = digest
          local_paths = sorted(path for path in Path(dist_dir).iterdir() if path.is_file())
          if not local_paths:
              raise SystemExit("recovery run has no Python distributions")
          local_names = {path.name for path in local_paths}
          if set(remote) != local_names:
              raise SystemExit(
                  f"PyPI release files do not match the verified recovery artifact: "
                  f"remote={sorted(remote)}, local={sorted(local_names)}"
              )
          mismatches = []
          for path in local_paths:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if remote[path.name] != digest:
                  mismatches.append(f"{path.name}: recovery {digest}, PyPI {remote[path.name]}")
          if mismatches:
              raise SystemExit("PyPI has different immutable artifacts: " + "; ".join(mismatches))
          print(f"PyPI catalogmx {version} matches the verified tag-run artifacts; recovery will skip its upload")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Dart/Flutter
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          flutter-version: '3.44.6'

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check version consistency
        run: |
          PYTHON_VERSION=$(grep '^version = ' packages/python/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          PYTHON_RUNTIME_VERSION=$(grep '^__version__ = ' packages/python/catalogmx/__init__.py | sed 's/__version__ = "\(.*\)"/\1/')
          TS_VERSION=$(node -p "require('./packages/typescript/package.json').version")
          DART_VERSION=$(grep '^version:' packages/dart/pubspec.yaml | awk '{print $2}')
          DART_ANDROID_VERSION=$(grep "^version '" packages/dart/android/build.gradle | sed "s/version '\(.*\)'/\1/")
          DART_IOS_VERSION=$(grep 's.version' packages/dart/ios/catalogmx.podspec | sed "s/.*= '\(.*\)'/\1/")
          KOTLIN_VERSION=$(grep '^version = ' packages/kotlin/build.gradle.kts | sed 's/version = "\(.*\)"/\1/')
          KOTLIN_RUNTIME_VERSION=$(grep '^const val CATALOGMX_VERSION' packages/kotlin/src/main/kotlin/com/openbancor/catalogmx/CatalogMx.kt | sed 's/.*= "\(.*\)"/\1/')

          echo "Python version: $PYTHON_VERSION"
          echo "Python runtime version: $PYTHON_RUNTIME_VERSION"
          echo "TypeScript version: $TS_VERSION"
          echo "Dart version: $DART_VERSION"
          echo "Dart Android version: $DART_ANDROID_VERSION"
          echo "Dart iOS version: $DART_IOS_VERSION"
          echo "Kotlin version: $KOTLIN_VERSION"
          echo "Kotlin runtime version: $KOTLIN_RUNTIME_VERSION"

          if [ "$PYTHON_VERSION" != "$PYTHON_RUNTIME_VERSION" ] || [ "$PYTHON_VERSION" != "$TS_VERSION" ] || [ "$TS_VERSION" != "$DART_VERSION" ] || [ "$DART_VERSION" != "$DART_ANDROID_VERSION" ] || [ "$DART_ANDROID_VERSION" != "$DART_IOS_VERSION" ] || [ "$DART_IOS_VERSION" != "$KOTLIN_VERSION" ] || [ "$KOTLIN_VERSION" != "$KOTLIN_RUNTIME_VERSION" ]; then
            echo "❌ Version mismatch!"
            exit 1
          fi

          if [ "$PYTHON_VERSION" != "${{ steps.get-version.outputs.version }}" ]; then
            echo "❌ Version mismatch with tag!"
            exit 1
          fi

          echo "✅ All versions are consistent: $PYTHON_VERSION"

      - name: Python - Build and verify distributions
        working-directory: packages/python
        run: |
          python -m pip install --disable-pip-version-check build==1.6.0 twine==7.0.0
          rm -rf dist/ build/ ./*.egg-info
          python -m build
          python -m twine check dist/*

      - name: Python - Install dependencies
        working-directory: packages/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Python - Run tests with coverage
        working-directory: packages/python
        run: |
          pytest tests/ --cov=catalogmx --cov-branch -q

      - name: Python - Check coverage threshold
        working-directory: packages/python
        run: |
          coverage report --fail-under=90

      - name: Python - Check code formatting
        working-directory: packages/python
        run: |
          black --check catalogmx/

      - name: Python - Run linting
        working-directory: packages/python
        run: |
          ruff check catalogmx/

      - name: TypeScript - Install dependencies
        working-directory: packages/typescript
        run: npm ci

      - name: TypeScript - Run linting
        working-directory: packages/typescript
        run: npm run lint

      - name: TypeScript - Check formatting
        working-directory: packages/typescript
        run: npm run format:check

      - name: TypeScript - Type checking
        working-directory: packages/typescript
        run: npm run typecheck

      - name: TypeScript - Run tests
        working-directory: packages/typescript
        run: npm test

      - name: TypeScript - Build
        working-directory: packages/typescript
        run: npm run build

      - name: TypeScript - Pack verified npm artifact
        working-directory: packages/typescript
        run: |
          mkdir -p release
          npm pack --pack-destination release

      - name: Dart - Get dependencies
        working-directory: packages/dart
        run: flutter pub get

      - name: Dart - Run analysis
        working-directory: packages/dart
        run: dart analyze

      - name: Dart - Check formatting
        working-directory: packages/dart
        run: dart format --set-exit-if-changed .

      - name: Dart - Run tests
        working-directory: packages/dart
        run: flutter test

      - name: Dart - Dry run publish
        working-directory: packages/dart
        run: flutter pub publish --dry-run

      - name: Kotlin - Run tests
        working-directory: packages/kotlin
        run: ./gradlew test

      - name: Kotlin - Build
        working-directory: packages/kotlin
        run: ./gradlew build

      - name: Kotlin - Dry run publish
        working-directory: packages/kotlin
        run: ./gradlew publishToMavenLocal

      - name: Archive verified Dart source
        run: |
          mkdir -p release
          git archive --format=tar.gz --prefix=packages/dart/ HEAD packages/dart > "release/catalogmx-dart-${{ steps.get-version.outputs.version }}.tar.gz"

      - name: Archive verified Maven artifacts
        run: |
          mkdir -p release/maven
          cp packages/kotlin/build/libs/catalogmx-${{ steps.get-version.outputs.version }}.jar release/maven/
          cp packages/kotlin/build/libs/catalogmx-${{ steps.get-version.outputs.version }}-sources.jar release/maven/
          cp packages/kotlin/build/libs/catalogmx-${{ steps.get-version.outputs.version }}-javadoc.jar release/maven/
          cp packages/kotlin/build/publications/maven/pom-default.xml release/maven/
          cp packages/kotlin/build/publications/maven/module.json release/maven/
          (cd release/maven && sha256sum -- catalogmx-*.jar pom-default.xml module.json) > release/maven/SHA256SUMS
          tar -czf "release/catalogmx-kotlin-${{ steps.get-version.outputs.version }}.tar.gz" -C release/maven .

      - name: Upload verified Python artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catalogmx-python-${{ steps.get-version.outputs.version }}
          path: packages/python/dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload verified npm artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catalogmx-npm-${{ steps.get-version.outputs.version }}
          path: packages/typescript/release/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload verified Dart source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catalogmx-dart-${{ steps.get-version.outputs.version }}
          path: release/catalogmx-dart-${{ steps.get-version.outputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload verified Maven artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catalogmx-kotlin-${{ steps.get-version.outputs.version }}
          path: release/catalogmx-kotlin-${{ steps.get-version.outputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Publish to PyPI
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.publish_pypi == 'true'
    outputs:
      version: ${{ needs.preflight.outputs.version }}
    environment: pypi
    permissions:
      contents: read
      id-token: write  # Required for trusted publishing

    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Download verified release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: catalogmx-python-${{ needs.preflight.outputs.version }}
          path: packages/python/dist

      - name: Install verification dependency
        run: |
          python -m pip install --disable-pip-version-check twine==7.0.0

      - name: Verify distribution
        run: |
          python -m twine check packages/python/dist/*

      - name: Check existing PyPI artifacts
        id: existing
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          metadata_file=$(mktemp)
          if ! http_code=$(curl --silent --show-error --location --output "$metadata_file" --write-out '%{http_code}' "https://pypi.org/pypi/catalogmx/json"); then
            echo "PyPI metadata request failed; refusing to publish without digest evidence" >&2
            exit 1
          fi
          if [ "$http_code" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$http_code" != "200" ]; then
            echo "Unexpected PyPI metadata response: HTTP $http_code" >&2
            exit 1
          fi
          python - "$metadata_file" packages/python/dist "$VERSION" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          metadata_path, dist_dir, version = sys.argv[1:]
          metadata = json.loads(Path(metadata_path).read_text())
          releases = metadata.get("releases", {}).get(version, [])
          remote = {}
          for item in releases:
              filename = item.get("filename")
              if not filename:
                  raise SystemExit("PyPI release contains a file without a filename")
              if filename in remote:
                  raise SystemExit(f"PyPI release contains duplicate filename: {filename}")
              digest = item.get("digests", {}).get("sha256")
              if not digest:
                  raise SystemExit(f"PyPI release file lacks a SHA-256 digest: {filename}")
              remote[filename] = digest
          local_paths = sorted(Path(dist_dir).glob("*"))
          if not local_paths:
              raise SystemExit("no Python distributions found")

          mismatches = []
          all_present = True
          for path in local_paths:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              expected = remote.get(path.name)
              if expected is None:
                  all_present = False
                  continue
              if expected != digest:
                  mismatches.append(f"{path.name}: local {digest}, PyPI {expected}")

          if mismatches:
              raise SystemExit("PyPI has a different immutable artifact: " + "; ".join(mismatches))

          extra_remote = sorted(set(remote) - {path.name for path in local_paths})
          if extra_remote:
              raise SystemExit(
                  "PyPI contains additional immutable artifacts not produced by "
                  "this build: " + ", ".join(extra_remote)
              )

          output = Path(os.environ["GITHUB_OUTPUT"])
          output.write_text(f"exists={'true' if all_present else 'false'}\n")
          if all_present:
              print(f"PyPI catalogmx {version} matches the verified artifacts; skipping immutable upload")
          else:
              print(f"PyPI catalogmx {version} is incomplete; uploading only missing artifacts")
          PY

      - name: Publish to PyPI
        if: steps.existing.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: packages/python/dist/
          skip-existing: true
          verbose: true

      - name: Verify PyPI release after publication
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          metadata_file=$(mktemp)
          deadline=$((SECONDS + 300))
          while :; do
            http_code=$(curl --silent --show-error --location --output "$metadata_file" --write-out '%{http_code}' "https://pypi.org/pypi/catalogmx/json")
            case "$http_code" in
              200)
                version_ready=$(python - "$metadata_file" packages/python/dist "$VERSION" <<'PY'
          import json
          import sys
          from pathlib import Path

          metadata_path, dist_dir, version = sys.argv[1:]
          releases = json.loads(Path(metadata_path).read_text()).get("releases", {}).get(version, [])
          local_names = {path.name for path in Path(dist_dir).iterdir() if path.is_file()}
          remote_names = {item.get("filename") for item in releases if item.get("filename")}
          print("true" if local_names and remote_names == local_names else "false")
          PY
                )
                if [ "$version_ready" = "true" ]; then
                  break
                fi
                ;;
              404) ;;
              *) echo "Unexpected PyPI metadata response: HTTP ${http_code}" >&2; exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "PyPI release ${VERSION} did not become visible within 5 minutes" >&2
              exit 1
            fi
            sleep 10
          done
          python - "$metadata_file" packages/python/dist "$VERSION" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          metadata_path, dist_dir, version = sys.argv[1:]
          releases = json.loads(Path(metadata_path).read_text()).get("releases", {}).get(version, [])
          remote = {}
          for item in releases:
              filename = item.get("filename")
              if not filename:
                  raise SystemExit("PyPI release contains a file without a filename")
              if filename in remote:
                  raise SystemExit(f"PyPI release contains duplicate filename: {filename}")
              digest = item.get("digests", {}).get("sha256")
              if not digest:
                  raise SystemExit(f"PyPI release file lacks a SHA-256 digest: {filename}")
              remote[filename] = digest
          local_paths = sorted(path for path in Path(dist_dir).iterdir() if path.is_file())
          if not local_paths:
              raise SystemExit("no Python distributions found")
          local_names = {path.name for path in local_paths}
          if set(remote) != local_names:
              raise SystemExit(
                  f"PyPI post-publication files do not match the verified artifact: "
                  f"remote={sorted(remote)}, local={sorted(local_names)}"
              )
          mismatches = []
          for path in local_paths:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if remote[path.name] != digest:
                  mismatches.append(f"{path.name}: local {digest}, PyPI {remote[path.name]}")
          if mismatches:
              raise SystemExit("PyPI post-publication digest mismatch: " + "; ".join(mismatches))
          print(f"PyPI catalogmx {version} is visible and matches the verified artifacts")
          PY

  # Publish to NPM
  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: [preflight, publish-pypi]
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped')
    outputs:
      version: ${{ needs.preflight.outputs.version }}
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Download verified release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: catalogmx-npm-${{ needs.preflight.outputs.version }}
          path: release

      - name: Publish to NPM
        id: publish
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          npm_package="./release/catalogmx-${VERSION}.tgz"
          test -f "$npm_package"
          local_shasum=$(shasum -a 1 "$npm_package" | awk '{print $1}')
          npm_error=$(mktemp)
          if ! remote_shasum=$(npm view "catalogmx@${VERSION}" dist.shasum 2>"$npm_error"); then
            if grep -q 'E404' "$npm_error"; then
              remote_shasum=""
            else
              cat "$npm_error" >&2
              echo "NPM registry evidence unavailable; refusing to publish without an immutable digest check" >&2
              exit 1
            fi
          fi
          if [ -n "$remote_shasum" ]; then
            remote_tarball=$(npm view "catalogmx@${VERSION}" dist.tarball)
            remote_file=$(mktemp)
            curl --fail --silent --show-error --location "$remote_tarball" -o "$remote_file"
            remote_actual_shasum=$(shasum -a 1 "$remote_file" | awk '{print $1}')
            if ! cmp --silent "$remote_file" "$npm_package"; then
              echo "NPM downloaded tarball differs from the verified artifact" >&2
              exit 1
            fi
            if [ "$remote_actual_shasum" != "$remote_shasum" ]; then
              echo "NPM metadata digest does not match the downloaded tarball" >&2
              exit 1
            fi
            if [ "$remote_shasum" != "$local_shasum" ]; then
              echo "NPM already contains ${VERSION} with a different artifact" >&2
              exit 1
            fi
            echo "NPM ${VERSION} already matches the verified artifact; skipping"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm publish "$npm_package"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Verify NPM release after publication
        if: steps.publish.outputs.published == 'true'
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          npm_package="./release/catalogmx-${VERSION}.tgz"
          local_shasum=$(shasum -a 1 "$npm_package" | awk '{print $1}')
          deadline=$((SECONDS + 300))
          while :; do
            npm_error=$(mktemp)
            if remote_shasum=$(npm view "catalogmx@${VERSION}" dist.shasum 2>"$npm_error"); then
              if [[ "$remote_shasum" =~ ^[0-9a-f]{40}$ ]]; then
                remote_tarball=$(npm view "catalogmx@${VERSION}" dist.tarball)
                remote_file=$(mktemp)
                curl --fail --silent --show-error --location "$remote_tarball" -o "$remote_file"
                remote_actual_shasum=$(shasum -a 1 "$remote_file" | awk '{print $1}')
                if [ "$remote_actual_shasum" = "$remote_shasum" ] && cmp --silent "$remote_file" "$npm_package"; then
                  break
                fi
                echo "NPM registry tarball digest does not match dist.shasum; refusing publication" >&2
                exit 1
              fi
            elif ! grep -q 'E404' "$npm_error"; then
              cat "$npm_error" >&2
              echo "NPM registry evidence unavailable after publication" >&2
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "NPM release ${VERSION} did not become visible within 5 minutes" >&2
              exit 1
            fi
            sleep 10
          done
          if [ "$remote_shasum" != "$local_shasum" ] || [ "$remote_actual_shasum" != "$local_shasum" ]; then
            echo "NPM post-publication digest mismatch: local ${local_shasum}, NPM ${remote_shasum}" >&2
            exit 1
          fi
          echo "NPM ${VERSION} is visible and matches the verified artifact"

  # Publish to pub.dev
  publish-pubdev:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    needs: [preflight, publish-npm]
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      needs.publish-npm.result == 'success'
    outputs:
      version: ${{ needs.preflight.outputs.version }}
    environment: pubdev
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}

      - name: Download verified Dart source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: catalogmx-dart-${{ needs.preflight.outputs.version }}
          path: release

      - name: Restore verified Dart source
        run: tar -xzf "release/catalogmx-dart-${{ needs.preflight.outputs.version }}.tar.gz" -C .

      - name: Set up Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1

      - name: Set up Flutter
        uses: flutter-actions/setup-flutter@6e2468fd827c4a7337cd4b835a6049b78bc0bd1f
        with:
          version: '3.44.6'

      - name: Check existing pub.dev version
        id: existing
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python - "$VERSION" <<'PY'
          import hashlib
          import json
          import os
          import sys
          import tarfile
          import urllib.request
          from io import BytesIO
          from pathlib import Path

          version = sys.argv[1]
          api = json.load(urllib.request.urlopen("https://pub.dev/api/packages/catalogmx"))
          entries = [item for item in api.get("versions", []) if item.get("version") == version]
          if len(entries) > 1:
              raise SystemExit(f"pub.dev metadata contains duplicate version entries: {version}")
          entry = entries[0] if entries else None
          output = Path(os.environ["GITHUB_OUTPUT"])
          if entry is None:
              output.write_text("exists=false\n")
              raise SystemExit(0)

          archive_url = entry.get("archive_url")
          if not archive_url:
              raise SystemExit("pub.dev version has no archive URL")
          archive = urllib.request.urlopen(archive_url).read()
          package_root = Path("packages/dart")
          ignored = {".gitignore", ".pubignore", "pubspec.lock"}
          expected = {
              str(path.relative_to(package_root))
              for path in package_root.rglob("*")
              if path.is_file()
              and path.name not in ignored
              and not any(part.startswith(".") for part in path.relative_to(package_root).parts)
          }
          archive_names = set()
          remote_names = set()
          mismatches = []
          with tarfile.open(fileobj=BytesIO(archive), mode="r:gz") as package:
              for member in package.getmembers():
                  relative = Path(member.name)
                  if relative.is_absolute() or ".." in relative.parts:
                      raise SystemExit(f"pub.dev archive contains unsafe path: {member.name}")
                  while relative.parts and relative.parts[0] == ".":
                      relative = Path(*relative.parts[1:])
                  if not relative.parts:
                      raise SystemExit("pub.dev archive contains an empty path")
                  relative_name = str(relative)
                  if relative_name in archive_names:
                      raise SystemExit(f"pub.dev archive contains duplicate member: {relative_name}")
                  archive_names.add(relative_name)
                  if member.isdir():
                      continue
                  if not member.isfile():
                      raise SystemExit(f"pub.dev archive contains unsupported member: {member.name}")
                  remote_names.add(relative_name)
                  local = package_root / relative
                  if not local.is_file():
                      mismatches.append(f"missing local file: {relative}")
                      continue
                  remote_digest = hashlib.sha256(package.extractfile(member).read()).hexdigest()
                  local_digest = hashlib.sha256(local.read_bytes()).hexdigest()
                  if remote_digest != local_digest:
                      mismatches.append(f"{relative}: local {local_digest}, pub.dev {remote_digest}")

          missing_remote = sorted(expected - remote_names)
          unexpected_remote = sorted(remote_names - expected)
          if missing_remote:
              mismatches.append("missing from pub.dev: " + ", ".join(missing_remote))
          if unexpected_remote:
              mismatches.append("unexpected files on pub.dev: " + ", ".join(unexpected_remote))

          if mismatches:
              raise SystemExit("pub.dev has a different immutable artifact: " + "; ".join(mismatches))
          output.write_text("exists=true\n")
          print(f"pub.dev catalogmx {version} matches the verified source; skipping immutable publish")
          PY

      - name: Publish to pub.dev
        id: publish
        if: steps.existing.outputs.exists != 'true'
        working-directory: packages/dart
        run: |
          flutter pub get
          flutter pub publish --dry-run
          flutter pub publish -f
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Verify pub.dev release after publication
        if: steps.publish.outputs.published == 'true'
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python - "$VERSION" <<'PY'
          import hashlib
          import json
          import sys
          import tarfile
          import time
          import urllib.error
          import urllib.request
          from io import BytesIO
          from pathlib import Path

          version = sys.argv[1]
          package_root = Path("packages/dart")
          ignored = {".gitignore", ".pubignore", "pubspec.lock"}
          expected = {
              str(path.relative_to(package_root))
              for path in package_root.rglob("*")
              if path.is_file()
              and path.name not in ignored
              and not any(part.startswith(".") for part in path.relative_to(package_root).parts)
          }

          def verify_archive(archive: bytes) -> None:
              archive_names = set()
              remote_names = set()
              mismatches = []
              with tarfile.open(fileobj=BytesIO(archive), mode="r:gz") as package:
                  for member in package.getmembers():
                      relative = Path(member.name)
                      if relative.is_absolute() or ".." in relative.parts:
                          raise SystemExit(f"pub.dev archive contains unsafe path: {member.name}")
                      while relative.parts and relative.parts[0] == ".":
                          relative = Path(*relative.parts[1:])
                      if not relative.parts:
                          raise SystemExit("pub.dev archive contains an empty path")
                      relative_name = str(relative)
                      if relative_name in archive_names:
                          raise SystemExit(f"pub.dev archive contains duplicate member: {relative_name}")
                      archive_names.add(relative_name)
                      if member.isdir():
                          continue
                      if not member.isfile():
                          raise SystemExit(f"pub.dev archive contains unsupported member: {member.name}")
                      remote_names.add(relative_name)
                      local = package_root / relative
                      if not local.is_file():
                          mismatches.append(f"missing local file: {relative}")
                          continue
                      remote_digest = hashlib.sha256(package.extractfile(member).read()).hexdigest()
                      local_digest = hashlib.sha256(local.read_bytes()).hexdigest()
                      if remote_digest != local_digest:
                          mismatches.append(f"{relative}: local {local_digest}, pub.dev {remote_digest}")
              missing = sorted(expected - remote_names)
              unexpected = sorted(remote_names - expected)
              if missing:
                  mismatches.append("missing from pub.dev: " + ", ".join(missing))
              if unexpected:
                  mismatches.append("unexpected files on pub.dev: " + ", ".join(unexpected))
              if mismatches:
                  raise SystemExit("pub.dev post-publication mismatch: " + "; ".join(mismatches))

          deadline = time.monotonic() + 300
          while True:
              try:
                  api = json.load(urllib.request.urlopen("https://pub.dev/api/packages/catalogmx"))
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  api = {}
              entries = [item for item in api.get("versions", []) if item.get("version") == version]
              if len(entries) > 1:
                  raise SystemExit(f"pub.dev metadata contains duplicate version entries: {version}")
              entry = entries[0] if entries else None
              archive_url = entry.get("archive_url") if entry else None
              if archive_url:
                  try:
                      archive = urllib.request.urlopen(archive_url).read()
                  except urllib.error.HTTPError as error:
                      if error.code != 404:
                          raise
                  else:
                      try:
                          verify_archive(archive)
                      except tarfile.ReadError:
                          pass
                      else:
                          print(f"pub.dev catalogmx {version} is visible and matches the verified source")
                          break
              if time.monotonic() >= deadline:
                  raise SystemExit(f"pub.dev release {version} did not become visible within 5 minutes")
              time.sleep(10)
          PY

  # Publish to Maven Central
  publish-maven:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: [publish-pubdev, preflight]
    if: needs.preflight.outputs.publish_maven == 'true'
    environment: maven

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}

      - name: Get version
        id: get-version
        run: echo "version=${{ needs.preflight.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Check Maven Central credentials
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          for credential in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD MAVEN_SIGNING_KEY MAVEN_SIGNING_PASSWORD; do
            if [ -z "${!credential}" ]; then
              echo "Missing required Maven Central credential: $credential" >&2
              exit 1
            fi
          done

      - name: Download verified Maven artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: catalogmx-kotlin-${{ steps.get-version.outputs.version }}
          path: release

      - name: Restore verified Maven artifacts
        run: |
          mkdir -p release/verified
          tar -xzf "release/catalogmx-kotlin-${{ steps.get-version.outputs.version }}.tar.gz" -C release/verified

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

      - name: Rebuild and compare Maven artifacts
        working-directory: packages/kotlin
        run: |
          ./gradlew build publishToMavenLocal --no-daemon
          {
            (cd build/libs && sha256sum "catalogmx-${{ steps.get-version.outputs.version }}.jar" "catalogmx-${{ steps.get-version.outputs.version }}-sources.jar" "catalogmx-${{ steps.get-version.outputs.version }}-javadoc.jar")
            (cd build/publications/maven && sha256sum pom-default.xml module.json)
          } > ../../release/current-maven.SHA256SUMS
          diff -u <(sort ../../release/verified/SHA256SUMS) <(sort ../../release/current-maven.SHA256SUMS)

      - name: Check existing Maven Central release
        id: existing
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          set -euo pipefail
          base="https://repo1.maven.org/maven2/com/openbancor/catalogmx/${VERSION}"
          files=(
            "catalogmx-${VERSION}.jar"
            "catalogmx-${VERSION}-sources.jar"
            "catalogmx-${VERSION}-javadoc.jar"
            "catalogmx-${VERSION}.pom"
            "catalogmx-${VERSION}.module"
          )
          present=0
          for file in "${files[@]}"; do
            if ! http_code=$(curl --silent --show-error --location -o /dev/null --write-out '%{http_code}' "${base}/${file}"); then
              echo "Maven Central evidence unavailable; refusing to publish without an immutable artifact check" >&2
              exit 1
            fi
            case "$http_code" in
              200) present=$((present + 1)) ;;
              404) ;;
              *) echo "Unexpected Maven Central response for ${file}: HTTP ${http_code}" >&2; exit 1 ;;
            esac
          done
          if [ "$present" -eq 0 ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$present" -ne "${#files[@]}" ]; then
            echo "Maven Central contains a partial immutable release for ${VERSION}" >&2
            exit 1
          fi

          verified_dir=$(mktemp -d)
          for file in "${files[@]}"; do
            curl --fail --silent --show-error --location "${base}/${file}" -o "${verified_dir}/${file}"
          done
          declare -A local_files=(
            ["catalogmx-${VERSION}.jar"]="packages/kotlin/build/libs/catalogmx-${VERSION}.jar"
            ["catalogmx-${VERSION}-sources.jar"]="packages/kotlin/build/libs/catalogmx-${VERSION}-sources.jar"
            ["catalogmx-${VERSION}-javadoc.jar"]="packages/kotlin/build/libs/catalogmx-${VERSION}-javadoc.jar"
            ["catalogmx-${VERSION}.pom"]="packages/kotlin/build/publications/maven/pom-default.xml"
            ["catalogmx-${VERSION}.module"]="packages/kotlin/build/publications/maven/module.json"
          )
          for file in "${files[@]}"; do
            remote_sha=$(shasum -a 256 "${verified_dir}/${file}" | awk '{print $1}')
            local_sha=$(shasum -a 256 "${local_files[$file]}" | awk '{print $1}')
            if [ "$remote_sha" != "$local_sha" ]; then
              echo "Maven Central ${file} differs from the verified artifact" >&2
              exit 1
            fi
          done
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "Maven Central ${VERSION} matches the verified artifacts; skipping immutable publish"

      - name: Publish to Maven Central
        if: steps.existing.outputs.exists != 'true'
        working-directory: packages/kotlin
        run: ./gradlew publishAndReleaseToMavenCentral --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signAllPublications: 'true'
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}

      - name: Verify newly published Maven Central release
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          set -euo pipefail
          base="https://repo1.maven.org/maven2/com/openbancor/catalogmx/${VERSION}"
          files=(
            "catalogmx-${VERSION}.jar"
            "catalogmx-${VERSION}-sources.jar"
            "catalogmx-${VERSION}-javadoc.jar"
            "catalogmx-${VERSION}.pom"
            "catalogmx-${VERSION}.module"
          )
          deadline=$((SECONDS + 600))
          while :; do
            ready=true
            for file in "${files[@]}"; do
              http_code=$(curl --silent --show-error --location -o /dev/null --write-out '%{http_code}' "${base}/${file}")
              case "$http_code" in
                200) ;;
                404) ready=false ;;
                *) echo "Unexpected Maven Central response for ${file}: HTTP ${http_code}" >&2; exit 1 ;;
              esac
            done
            if [ "$ready" = true ]; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Maven Central release ${VERSION} did not become visible within 10 minutes" >&2
              exit 1
            fi
            sleep 15
          done

          verified_dir=$(mktemp -d)
          for file in "${files[@]}"; do
            curl --fail --silent --show-error --location "${base}/${file}" -o "${verified_dir}/${file}"
          done
          declare -A local_files=(
            ["catalogmx-${VERSION}.jar"]="packages/kotlin/build/libs/catalogmx-${VERSION}.jar"
            ["catalogmx-${VERSION}-sources.jar"]="packages/kotlin/build/libs/catalogmx-${VERSION}-sources.jar"
            ["catalogmx-${VERSION}-javadoc.jar"]="packages/kotlin/build/libs/catalogmx-${VERSION}-javadoc.jar"
            ["catalogmx-${VERSION}.pom"]="packages/kotlin/build/publications/maven/pom-default.xml"
            ["catalogmx-${VERSION}.module"]="packages/kotlin/build/publications/maven/module.json"
          )
          for file in "${files[@]}"; do
            remote_sha=$(shasum -a 256 "${verified_dir}/${file}" | awk '{print $1}')
            local_sha=$(shasum -a 256 "${local_files[$file]}" | awk '{print $1}')
            if [ "$remote_sha" != "$local_sha" ]; then
              echo "Maven Central ${file} differs from the verified artifact" >&2
              exit 1
            fi
          done
          echo "Maven Central ${VERSION} is visible and matches the verified artifacts"

  # Create GitHub Release
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [preflight, publish-pypi, publish-npm, publish-pubdev, publish-maven]
    if: >-
      always() &&
      (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped') &&
      needs.publish-npm.result == 'success' &&
      needs.publish-pubdev.result == 'success' &&
      (needs.publish-maven.result == 'success' || needs.publish-maven.result == 'skipped')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}

      - name: Get version
        id: get-version
        run: echo "version=${{ needs.publish-pubdev.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog
        id: changelog
        run: |
          VERSION=${{ steps.get-version.outputs.version }}

          # Try to extract from Python CHANGELOG first
          if [ -f packages/python/CHANGELOG.rst ]; then
            CHANGELOG=$(sed -n "/^${VERSION}/,/^[0-9]/p" packages/python/CHANGELOG.rst | head -n -1)
          fi

          # Fallback to Dart CHANGELOG
          if [ -z "$CHANGELOG" ] && [ -f packages/dart/CHANGELOG.md ]; then
            CHANGELOG=$(sed -n "/## \[${VERSION}\]/,/## \[/p" packages/dart/CHANGELOG.md | head -n -1)
          fi

          # If no changelog found, use generic message
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Release version ${VERSION}"
          fi

          # Save to file for multiline output
          echo "$CHANGELOG" > changelog.txt

      - name: Annotate registry publication status
        run: |
          if [ "${{ needs.publish-pypi.result }}" = "skipped" ]; then
            printf '\n\nPyPI: existing version verified; upload skipped during recovery.\n' >> changelog.txt
          else
            printf '\n\nPyPI: published or already matched the verified artifacts.\n' >> changelog.txt
          fi
          printf 'NPM: published or already matched the verified artifact.\npub.dev: published or already matched the verified source.\n' >> changelog.txt
          if [ "${{ needs.publish-maven.result }}" = "skipped" ]; then
            printf '\n\nMaven Central: pending separate opt-in publication.\n' >> changelog.txt
          else
            printf '\n\nMaven Central: published and verified.\n' >> changelog.txt
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.get-version.outputs.version }}
          name: catalogmx v${{ steps.get-version.outputs.version }}
          body_path: changelog.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post-release summary
        run: |
          VERSION=${{ steps.get-version.outputs.version }}
          echo "🎉 Successfully published catalogmx v${VERSION} to:"
          if [ "${{ needs.publish-pypi.result }}" = "skipped" ]; then
            echo "  📦 PyPI:    already present (recovery verified): https://pypi.org/project/catalogmx/${VERSION}/"
          else
            echo "  📦 PyPI:    https://pypi.org/project/catalogmx/${VERSION}/"
          fi
          echo "  📦 NPM:     https://www.npmjs.com/package/catalogmx/v/${VERSION}"
          echo "  📦 pub.dev: https://pub.dev/packages/catalogmx/versions/${VERSION}"
          if [ "${{ needs.publish-maven.result }}" = "skipped" ]; then
            echo "  📦 Maven:   pending (not published)"
          else
            echo "  📦 Maven:   https://central.sonatype.com/artifact/com.openbancor/catalogmx/${VERSION}"
          fi
          echo "  🏷️  GitHub:  https://github.com/openbancor/catalogmx/releases/tag/v${VERSION}"
