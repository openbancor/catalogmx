name: Publish to PyPI, NPM, pub.dev, and Maven Central

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # Preflight checks before publishing
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    environment: maven
    outputs:
      version: ${{ steps.get-version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get-version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Dart/Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check version consistency
        run: |
          PYTHON_VERSION=$(grep '^version = ' packages/python/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          PYTHON_RUNTIME_VERSION=$(grep '^__version__ = ' packages/python/catalogmx/__init__.py | sed 's/__version__ = "\(.*\)"/\1/')
          TS_VERSION=$(node -p "require('./packages/typescript/package.json').version")
          DART_VERSION=$(grep '^version:' packages/dart/pubspec.yaml | awk '{print $2}')
          DART_ANDROID_VERSION=$(grep "^version '" packages/dart/android/build.gradle | sed "s/version '\(.*\)'/\1/")
          DART_IOS_VERSION=$(grep 's.version' packages/dart/ios/catalogmx.podspec | sed "s/.*= '\(.*\)'/\1/")
          KOTLIN_VERSION=$(grep '^version = ' packages/kotlin/build.gradle.kts | sed 's/version = "\(.*\)"/\1/')
          KOTLIN_RUNTIME_VERSION=$(grep '^const val CATALOGMX_VERSION' packages/kotlin/src/main/kotlin/com/openbancor/catalogmx/CatalogMx.kt | sed 's/.*= "\(.*\)"/\1/')

          echo "Python version: $PYTHON_VERSION"
          echo "Python runtime version: $PYTHON_RUNTIME_VERSION"
          echo "TypeScript version: $TS_VERSION"
          echo "Dart version: $DART_VERSION"
          echo "Dart Android version: $DART_ANDROID_VERSION"
          echo "Dart iOS version: $DART_IOS_VERSION"
          echo "Kotlin version: $KOTLIN_VERSION"
          echo "Kotlin runtime version: $KOTLIN_RUNTIME_VERSION"

          if [ "$PYTHON_VERSION" != "$PYTHON_RUNTIME_VERSION" ] || [ "$PYTHON_VERSION" != "$TS_VERSION" ] || [ "$TS_VERSION" != "$DART_VERSION" ] || [ "$DART_VERSION" != "$DART_ANDROID_VERSION" ] || [ "$DART_ANDROID_VERSION" != "$DART_IOS_VERSION" ] || [ "$DART_IOS_VERSION" != "$KOTLIN_VERSION" ] || [ "$KOTLIN_VERSION" != "$KOTLIN_RUNTIME_VERSION" ]; then
            echo "❌ Version mismatch!"
            exit 1
          fi

          if [ "$PYTHON_VERSION" != "${{ steps.get-version.outputs.version }}" ]; then
            echo "❌ Version mismatch with tag!"
            exit 1
          fi

          echo "✅ All versions are consistent: $PYTHON_VERSION"

      - name: Python - Build and verify distributions
        working-directory: packages/python
        run: |
          python -m pip install --disable-pip-version-check build==1.6.0 twine==7.0.0
          rm -rf dist/ build/ ./*.egg-info
          python -m build
          python -m twine check dist/*

      - name: Check Maven Central credentials
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          for credential in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD MAVEN_SIGNING_KEY MAVEN_SIGNING_PASSWORD; do
            if [ -z "${!credential}" ]; then
              echo "Missing required Maven Central credential: $credential"
              exit 1
            fi
          done

      - name: Python - Install dependencies
        working-directory: packages/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Python - Run tests with coverage
        working-directory: packages/python
        run: |
          pytest tests/ --cov=catalogmx --cov-branch -q

      - name: Python - Check coverage threshold
        working-directory: packages/python
        run: |
          coverage report --fail-under=90

      - name: Python - Check code formatting
        working-directory: packages/python
        run: |
          black --check catalogmx/

      - name: Python - Run linting
        working-directory: packages/python
        run: |
          ruff check catalogmx/

      - name: TypeScript - Install dependencies
        working-directory: packages/typescript
        run: npm ci

      - name: TypeScript - Run linting
        working-directory: packages/typescript
        run: npm run lint

      - name: TypeScript - Check formatting
        working-directory: packages/typescript
        run: npm run format:check

      - name: TypeScript - Type checking
        working-directory: packages/typescript
        run: npm run typecheck

      - name: TypeScript - Run tests
        working-directory: packages/typescript
        run: npm test

      - name: TypeScript - Build
        working-directory: packages/typescript
        run: npm run build

      - name: TypeScript - Pack verified npm artifact
        working-directory: packages/typescript
        run: |
          mkdir -p release
          npm pack --pack-destination release

      - name: Dart - Get dependencies
        working-directory: packages/dart
        run: flutter pub get

      - name: Dart - Run analysis
        working-directory: packages/dart
        run: dart analyze

      - name: Dart - Check formatting
        working-directory: packages/dart
        run: dart format --set-exit-if-changed .

      - name: Dart - Run tests
        working-directory: packages/dart
        run: flutter test

      - name: Dart - Dry run publish
        working-directory: packages/dart
        run: flutter pub publish --dry-run

      - name: Kotlin - Run tests
        working-directory: packages/kotlin
        run: ./gradlew test

      - name: Kotlin - Build
        working-directory: packages/kotlin
        run: ./gradlew build

      - name: Kotlin - Dry run publish
        working-directory: packages/kotlin
        run: ./gradlew publishToMavenLocal

      - name: Upload verified Python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: catalogmx-python-${{ steps.get-version.outputs.version }}
          path: packages/python/dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload verified npm artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalogmx-npm-${{ steps.get-version.outputs.version }}
          path: packages/typescript/release/*
          if-no-files-found: error
          retention-days: 7

  # Publish to PyPI
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: preflight
    outputs:
      version: ${{ needs.preflight.outputs.version }}
    environment: pypi
    permissions:
      contents: read
      id-token: write  # Required for trusted publishing

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download verified release artifacts
        uses: actions/download-artifact@v4
        with:
          name: catalogmx-python-${{ needs.preflight.outputs.version }}
          path: packages/python/dist

      - name: Install verification dependency
        run: |
          python -m pip install --disable-pip-version-check twine==7.0.0

      - name: Verify distribution
        run: |
          python -m twine check packages/python/dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist/
          skip-existing: true
          verbose: true

  # Publish to NPM
  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: publish-pypi
    outputs:
      version: ${{ needs.publish-pypi.outputs.version }}
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Download verified release artifacts
        uses: actions/download-artifact@v4
        with:
          name: catalogmx-npm-${{ needs.publish-pypi.outputs.version }}
          path: release

      - name: Publish to NPM
        env:
          VERSION: ${{ needs.publish-pypi.outputs.version }}
        run: |
          npm_package="release/catalogmx-${VERSION}.tgz"
          local_shasum=$(shasum -a 1 "$npm_package" | awk '{print $1}')
          remote_shasum=$(npm view "catalogmx@${VERSION}" dist.shasum 2>/dev/null || true)
          if [ -n "$remote_shasum" ]; then
            if [ "$remote_shasum" != "$local_shasum" ]; then
              echo "NPM already contains ${VERSION} with a different artifact"
              exit 1
            fi
            echo "NPM ${VERSION} already matches the verified artifact; skipping"
            exit 0
          fi
          npm publish "$npm_package"

  # Publish to pub.dev
  publish-pubdev:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    needs: publish-npm
    outputs:
      version: ${{ needs.publish-npm.outputs.version }}
    environment: pubdev
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1

      - name: Set up Flutter
        uses: flutter-actions/setup-flutter@6e2468fd827c4a7337cd4b835a6049b78bc0bd1f
        with:
          channel: stable

      - name: Check existing pub.dev version
        id: existing
        env:
          VERSION: ${{ needs.publish-npm.outputs.version }}
        run: |
          versions=$(curl --fail --silent --show-error https://pub.dev/api/packages/catalogmx)
          if jq -e --arg version "$VERSION" '.versions[] | select(.version == $version)' >/dev/null <<< "$versions"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "pub.dev already contains catalogmx ${VERSION}; skipping immutable publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to pub.dev
        if: steps.existing.outputs.exists != 'true'
        working-directory: packages/dart
        run: |
          flutter pub get
          flutter pub publish --dry-run
          flutter pub publish -f

  # Publish to Maven Central
  publish-maven:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: publish-pubdev
    environment: maven

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: get-version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Check existing Maven Central release
        id: existing
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          count=$(curl --fail --silent --show-error \
            "https://search.maven.org/solrsearch/select?q=g:%22com.openbancor%22%20AND%20a:%22catalogmx%22%20AND%20v:%22${VERSION}%22&rows=1&wt=json" \
            | jq -r '.response.numFound')
          if [ "$count" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Maven Central already contains com.openbancor:catalogmx:${VERSION}; skipping immutable publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build and publish package
        if: steps.existing.outputs.exists != 'true'
        working-directory: packages/kotlin
        run: ./gradlew build publishAndReleaseToMavenCentral --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signAllPublications: 'true'
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}

  # Create GitHub Release
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-pypi, publish-npm, publish-pubdev, publish-maven]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: get-version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog
        id: changelog
        run: |
          VERSION=${{ steps.get-version.outputs.version }}

          # Try to extract from Python CHANGELOG first
          if [ -f packages/python/CHANGELOG.rst ]; then
            CHANGELOG=$(sed -n "/^${VERSION}/,/^[0-9]/p" packages/python/CHANGELOG.rst | head -n -1)
          fi

          # Fallback to Dart CHANGELOG
          if [ -z "$CHANGELOG" ] && [ -f packages/dart/CHANGELOG.md ]; then
            CHANGELOG=$(sed -n "/## \[${VERSION}\]/,/## \[/p" packages/dart/CHANGELOG.md | head -n -1)
          fi

          # If no changelog found, use generic message
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Release version ${VERSION}"
          fi

          # Save to file for multiline output
          echo "$CHANGELOG" > changelog.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get-version.outputs.version }}
          name: catalogmx v${{ steps.get-version.outputs.version }}
          body_path: changelog.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post-release summary
        run: |
          VERSION=${{ steps.get-version.outputs.version }}
          echo "🎉 Successfully published catalogmx v${VERSION} to:"
          echo "  📦 PyPI:    https://pypi.org/project/catalogmx/${VERSION}/"
          echo "  📦 NPM:     https://www.npmjs.com/package/catalogmx/v/${VERSION}"
          echo "  📦 pub.dev: https://pub.dev/packages/catalogmx/versions/${VERSION}"
          echo "  📦 Maven:   https://central.sonatype.com/artifact/com.openbancor/catalogmx/${VERSION}"
          echo "  🏷️  GitHub:  https://github.com/openbancor/catalogmx/releases/tag/v${VERSION}"
