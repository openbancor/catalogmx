name: Format Nómina parity

on:
  push:
    branches:
      - feat/sat-nomina-api-parity

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[nomina-formatted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sat-nomina-api-parity
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Format Python
        run: |
          python -m pip install black==26.5.1
          black packages/python/catalogmx/catalogs/sat/nomina

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Format TypeScript
        working-directory: packages/typescript
        run: |
          npm install
          npx prettier --write src/catalogs/sat/nomina src/catalogs/index.ts tests/nomina-parity.test.ts tests/sat-catalogs-complete.test.ts
          npm run lint

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Format Dart
        run: dart format packages/dart/lib/src/catalogs/sat/nomina_all.dart packages/dart/test/nomina_parity_test.dart

      - name: Commit formatter output
        run: |
          rm .github/workflows/format-nomina-parity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: format Nómina parity changes [nomina-formatted]"
          git push origin HEAD:feat/sat-nomina-api-parity
