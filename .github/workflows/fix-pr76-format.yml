name: Fix PR76 Format

on:
  push:
    branches: [feat/data-resolver-conapo-ift]
    paths:
      - 'scripts/fix_pr76_format.py'
      - '.github/workflows/fix-pr76-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/data-resolver-conapo-ift
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Black
        run: python -m pip install 'black>=23.0.0'

      - name: Restore package formatting
        run: |
          python scripts/fix_pr76_format.py
          black --config packages/python/pyproject.toml --check packages/python/catalogmx/
          git diff --check

      - name: Commit package-only formatting fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'catalogmx-format[bot]'
          git config user.email 'catalogmx-format[bot]@users.noreply.github.com'
          git add \
            packages/python/catalogmx/catalogs/ift/codigos_lada.py \
            packages/python/catalogmx/catalogs/ift/operadores_moviles.py
          git commit -m 'style: restore Python package formatting'
          git push origin HEAD:feat/data-resolver-conapo-ift
