name: PR96 Final P2 Once

on:
  push:
    branches:
      - fix/fiscal-integrity-2026
    paths:
      - '.github/workflows/pr96-final-p2-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fiscal-integrity-2026
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final Codex P2 fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          ts_path = Path('packages/typescript/src/calculators/imss-calculator.ts')
          ts = ts_path.read_text(encoding='utf-8')
          old_uma = '''export interface UMAInfo {\n  diaria: number;\n  mensual: number;\n  anual: number;\n  vigencia_desde?: string;\n  vigencia_hasta?: string;\n  source_id?: string;\n}\n'''
          new_uma = '''export interface UMAInfo {\n  diaria: number;\n  mensual: number;\n  anual: number;\n}\n\ntype UMATableRow = UMAInfo & {\n  vigencia_desde?: string;\n  vigencia_hasta?: string;\n  source_id?: string;\n};\n'''
          if ts.count(old_uma) != 1:
              raise SystemExit(f'expected one public UMAInfo block, found {ts.count(old_uma)}')
          ts = ts.replace(old_uma, new_uma, 1)
          old_table = '  uma: Record<string, UMAInfo>;\n'
          new_table = '  uma: Record<string, UMATableRow>;\n'
          if ts.count(old_table) != 1:
              raise SystemExit(f'expected one UMA table declaration, found {ts.count(old_table)}')
          ts = ts.replace(old_table, new_table, 1)
          marker = '''  /**\n   * UMA publicada para un ejercicio. Para cálculos de enero, donde todavía\n   * puede seguir vigente la UMA del ejercicio previo, usar getUMAForDate().\n   */\n'''
          helper = '''  private static toPublicUMA(uma: UMATableRow): UMAInfo {\n    return {\n      diaria: uma.diaria,\n      mensual: uma.mensual,\n      anual: uma.anual,\n    };\n  }\n\n'''
          if ts.count(marker) != 1:
              raise SystemExit(f'expected one getUMA doc marker, found {ts.count(marker)}')
          ts = ts.replace(marker, helper + marker, 1)
          if ts.count('    return { ...uma };\n') != 2:
              raise SystemExit(f'expected two UMA spread returns, found {ts.count("    return { ...uma };\\n")}')
          ts = ts.replace('    return { ...uma };\n', '    return this.toPublicUMA(uma);\n', 2)
          ts_path.write_text(ts, encoding='utf-8')

          vector_path = Path('packages/typescript/tests/imss-vectors.test.ts')
          vectors = vector_path.read_text(encoding='utf-8')
          vector_marker = "describe('IMSS shared vectors', () => {\n"
          vector_test = '''  test('UMA public helpers expose the cross-runtime value shape only', () => {\n    const expected = { diaria: 117.31, mensual: 3566.22, anual: 42794.64 };\n    expect(IMSSCalculator.getUMA(2026)).toEqual(expected);\n    expect(IMSSCalculator.getUMAForDate('2026-02-01')).toEqual(expected);\n  });\n\n'''
          if vectors.count(vector_marker) != 1:
              raise SystemExit(f'expected one IMSS describe marker, found {vectors.count(vector_marker)}')
          vector_path.write_text(vectors.replace(vector_marker, vector_marker + vector_test, 1), encoding='utf-8')

          manifest_script_path = Path('scripts/build_fiscal_manifest.py')
          script = manifest_script_path.read_text(encoding='utf-8')
          old_imports = '''import argparse\nimport hashlib\nimport json\nfrom pathlib import Path\n'''
          new_imports = '''import argparse\nimport hashlib\nimport json\nfrom datetime import date, timedelta\nfrom pathlib import Path\n'''
          if script.count(old_imports) != 1:
              raise SystemExit(f'expected one manifest import block, found {script.count(old_imports)}')
          script = script.replace(old_imports, new_imports, 1)
          old_loop = '''    wage_entries: dict[str, Any] = {}\n    for row in sorted(wage_rows, key=lambda item: item["año"]):\n        year = int(row["año"])\n'''
          new_loop = '''    wage_entries: dict[str, Any] = {}\n    sorted_wage_rows = sorted(wage_rows, key=lambda item: item["año"])\n    for index, row in enumerate(sorted_wage_rows):\n        year = int(row["año"])\n        next_valid_from = (\n            sorted_wage_rows[index + 1].get("vigencia_inicio")\n            if index + 1 < len(sorted_wage_rows)\n            else None\n        )\n        valid_to = None\n        if next_valid_from:\n            successor_boundary = date.fromisoformat(next_valid_from) - timedelta(days=1)\n            exercise_boundary = date(year, 12, 31)\n            valid_to = min(successor_boundary, exercise_boundary).isoformat()\n'''
          if script.count(old_loop) != 1:
              raise SystemExit(f'expected one wage loop, found {script.count(old_loop)}')
          script = script.replace(old_loop, new_loop, 1)
          old_entry = '''            row.get("vigencia_inicio"),\n            None,\n            [source_id],\n            values,\n        )\n    datasets["minimum_wage"] = {\n'''
          new_entry = '''            row.get("vigencia_inicio"),\n            valid_to,\n            [source_id],\n            values,\n        )\n    datasets["minimum_wage"] = {\n'''
          if script.count(old_entry) != 1:
              raise SystemExit(f'expected one minimum-wage entry block, found {script.count(old_entry)}')
          manifest_script_path.write_text(script.replace(old_entry, new_entry, 1), encoding='utf-8')

          fiscal_test_path = Path('packages/typescript/tests/fiscal-history.test.ts')
          fiscal_tests = fiscal_test_path.read_text(encoding='utf-8')
          fiscal_marker = '''    expect(fiscalSources('uma', 2026)[0]?.source?.authority).toBe('INEGI');\n\n'''
          fiscal_regression = '''    expect(assertFiscalDataVerified('minimum_wage', 2024).valid_to).toBe('2024-12-31');\n    expect(assertFiscalDataVerified('minimum_wage', 2025).valid_to).toBe('2025-12-31');\n    expect(assertFiscalDataVerified('minimum_wage', 2026).valid_to).toBeNull();\n\n'''
          if fiscal_tests.count(fiscal_marker) != 1:
              raise SystemExit(f'expected one fiscal provenance marker, found {fiscal_tests.count(fiscal_marker)}')
          fiscal_test_path.write_text(\n              fiscal_tests.replace(fiscal_marker, fiscal_marker + fiscal_regression, 1),\n              encoding='utf-8',\n          )
          PY
      - name: Regenerate fiscal manifest
        run: |
          python scripts/build_fiscal_manifest.py
          python scripts/build_fiscal_manifest.py --check
      - name: Validate TypeScript changes
        working-directory: packages/typescript
        run: |
          npm ci
          npx prettier --write src/calculators/imss-calculator.ts tests/imss-vectors.test.ts tests/fiscal-history.test.ts
          npm run format:check
          npm run typecheck
          npm run lint
          npx jest tests/imss-vectors.test.ts tests/fiscal-history.test.ts --runInBand
      - name: Recheck generated artifacts
        run: |
          python scripts/build_fiscal_manifest.py --check
          git diff --check
      - name: Commit final P2 fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/typescript/src/calculators/imss-calculator.ts \
            packages/typescript/tests/imss-vectors.test.ts \
            packages/typescript/tests/fiscal-history.test.ts \
            scripts/build_fiscal_manifest.py \
            packages/shared-data/fiscal-manifest.json \
            packages/typescript/src/fiscal/manifest.generated.ts
          git diff --cached --check
          git commit -m "fix(fiscal): close final provenance parity gaps"
          git push origin HEAD:fix/fiscal-integrity-2026
