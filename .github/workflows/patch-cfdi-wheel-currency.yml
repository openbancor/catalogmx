name: Patch CFDI wheel currency coverage

on:
  push:
    branches:
      - feat/resolver-backed-cce-cfdi-dependencies

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/resolver-backed-cce-cfdi-dependencies
          fetch-depth: 0
      - name: Patch workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/python-cfdi-consumer-data.yml')
          text = path.read_text(encoding='utf-8')

          marker = '''              connection.execute(\n                  "CREATE TABLE cfdi_40_reglas_tasa_cuota ("\n'''
          currency = '''              connection.execute(\n                  "CREATE TABLE cfdi_40_monedas ("\n                  "id TEXT PRIMARY KEY, texto TEXT NOT NULL, decimales INTEGER, "\n                  "porcentaje_variacion TEXT, vigencia_desde TEXT, vigencia_hasta TEXT)"\n              )\n              connection.executemany(\n                  "INSERT INTO cfdi_40_monedas VALUES (?, ?, ?, ?, ?, ?)",\n                  [\n                      ("EUR", "Euro", 2, "0.01", "2022-01-01", ""),\n                      ("MXN", "Peso Mexicano", 2, "0.01", "2022-01-01", ""),\n                      ("USD", "Dolar americano", 2, "0.01", "2022-01-01", ""),\n                  ],\n              )\n\n'''
          if marker not in text:
              raise SystemExit('currency insertion marker missing')
          text = text.replace(marker, currency + marker, 1)

          old_hash = 'catalogmx-cfdi-installed-wheel-consumer-fixture-v2'
          new_hash = 'catalogmx-cfdi-installed-wheel-consumer-fixture-v3'
          if old_hash not in text:
              raise SystemExit('fixture version marker missing')
          text = text.replace(old_hash, new_hash, 1)

          import_marker = '''          from catalogmx.catalogs.sat.cfdi_4.tipo_factor import TipoFactor\n          from catalogmx.data import DatasetResolver\n'''
          import_replacement = '''          from catalogmx.catalogs.sat.cfdi_4.tipo_factor import TipoFactor\n          from catalogmx.catalogs.sat.comercio_exterior import MonedaCatalog\n          from catalogmx.data import DatasetResolver\n'''
          if import_marker not in text:
              raise SystemExit('import marker missing')
          text = text.replace(import_marker, import_replacement, 1)

          assertion_marker = '''          assert unidad["fechaDeInicioDeVigencia"] == "01-01-2022"\n\n          resolver = DatasetResolver()\n'''
          assertion_replacement = '''          assert unidad["fechaDeInicioDeVigencia"] == "01-01-2022"\n\n          moneda = MonedaCatalog.get_moneda("MXN")\n          assert moneda is not None\n          assert moneda["nombre"] == "Peso Mexicano"\n          assert moneda["decimales"] == 2\n          assert moneda["pais"] is None\n          assert [item["codigo"] for item in MonedaCatalog.search("Euro")] == ["EUR"]\n\n          resolver = DatasetResolver()\n'''
          if assertion_marker not in text:
              raise SystemExit('assertion marker missing')
          text = text.replace(assertion_marker, assertion_replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'catalogmx-data[bot]'
          git config user.email 'catalogmx-data[bot]@users.noreply.github.com'
          git add .github/workflows/python-cfdi-consumer-data.yml
          git commit -m 'ci(data): cover Comercio Exterior currency dependency'
          git push origin HEAD:feat/resolver-backed-cce-cfdi-dependencies
