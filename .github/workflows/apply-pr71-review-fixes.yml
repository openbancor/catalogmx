name: Apply PR71 Review Fixes

on:
  push:
    branches: [feat/data-resolver-profiles]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/data-resolver-profiles
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply resolver and consumer fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match in {path}, found {text.count(old)}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "packages/python/catalogmx/catalogs/banxico/instituciones_financieras.py",
              "from pathlib import Path\nfrom typing import TypedDict\n\nfrom catalogmx.utils.text import normalize_text\n",
              "from typing import TypedDict\n\nfrom catalogmx.utils.shared_data import get_shared_data_path\nfrom catalogmx.utils.text import normalize_text\n",
          )
          replace_once(
              "packages/python/catalogmx/catalogs/banxico/instituciones_financieras.py",
              '''        # Path: catalogmx/packages/python/catalogmx/catalogs/banxico/instituciones_financieras.py\n        # Target: catalogmx/packages/shared-data/banxico/instituciones_financieras.json\n        data_path = (\n            Path(__file__).parent.parent.parent.parent.parent\n            / "shared-data"\n            / "banxico"\n            / "instituciones_financieras.json"\n        )\n''',
              '''        data_path = get_shared_data_path(\n            "banxico", "instituciones_financieras.json"\n        )\n''',
          )

          replace_once(
              "packages/python/catalogmx/catalogs/banxico/monedas_divisas.py",
              "from pathlib import Path\nfrom typing import TypedDict\n",
              "from typing import TypedDict\n\nfrom catalogmx.utils.shared_data import get_shared_data_path\n",
          )
          replace_once(
              "packages/python/catalogmx/catalogs/banxico/monedas_divisas.py",
              '''        # Path: catalogmx/packages/python/catalogmx/catalogs/banxico/monedas_divisas.py\n        # Target: catalogmx/packages/shared-data/banxico/monedas_divisas.json\n        data_path = (\n            Path(__file__).parent.parent.parent.parent.parent\n            / "shared-data"\n            / "banxico"\n            / "monedas_divisas.json"\n        )\n''',
              '''        data_path = get_shared_data_path("banxico", "monedas_divisas.json")\n''',
          )

          replace_once(
              "packages/python/catalogmx/data/resolver.py",
              "import hashlib\n",
              "import errno\nimport hashlib\n",
          )
          replace_once(
              "packages/python/catalogmx/data/resolver.py",
              "import tempfile\nimport uuid\n",
              "import tempfile\nimport time\nimport uuid\n",
          )
          replace_once(
              "packages/python/catalogmx/data/resolver.py",
              '''        if os.name == "nt":\n            import msvcrt\n\n            msvcrt.locking(handle.fileno(), msvcrt.LK_LOCK, 1)\n            try:\n                yield\n            finally:\n                handle.seek(0)\n                msvcrt.locking(handle.fileno(), msvcrt.LK_UNLCK, 1)\n''',
              '''        if os.name == "nt":\n            import msvcrt\n\n            while True:\n                handle.seek(0)\n                try:\n                    msvcrt.locking(handle.fileno(), msvcrt.LK_NBLCK, 1)\n                    break\n                except OSError as exc:\n                    if exc.errno not in {errno.EACCES, errno.EAGAIN}:\n                        raise\n                    time.sleep(0.05)\n            try:\n                yield\n            finally:\n                handle.seek(0)\n                msvcrt.locking(handle.fileno(), msvcrt.LK_UNLCK, 1)\n''',
          )

          replace_once(
              "packages/python/tests/test_dataset_resolver_hardening.py",
              "import gzip\n",
              "import errno\nimport gzip\n",
          )
          replace_once(
              "packages/python/tests/test_dataset_resolver_hardening.py",
              "import shutil\nimport tarfile\nfrom pathlib import Path\n",
              "import shutil\nimport sys\nimport tarfile\nfrom pathlib import Path\nfrom types import SimpleNamespace\n",
          )
          hardening = Path("packages/python/tests/test_dataset_resolver_hardening.py")
          hardening.write_text(
              hardening.read_text(encoding="utf-8")
              + '''\n\ndef test_windows_lock_retries_beyond_msvcrt_default_limit(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n):\n    attempts = 0\n    unlocks = 0\n    sleeps: list[float] = []\n    lk_nblck = 1\n    lk_unlck = 2\n\n    def locking(_fd: int, mode: int, nbytes: int) -> None:\n        nonlocal attempts, unlocks\n        assert nbytes == 1\n        if mode == lk_unlck:\n            unlocks += 1\n            return\n        assert mode == lk_nblck\n        attempts += 1\n        if attempts <= 12:\n            raise OSError(errno.EACCES, "simulated lock contention")\n\n    fake_msvcrt = SimpleNamespace(\n        LK_NBLCK=lk_nblck,\n        LK_UNLCK=lk_unlck,\n        locking=locking,\n    )\n    monkeypatch.setitem(sys.modules, "msvcrt", fake_msvcrt)\n    monkeypatch.setattr(resolver_module.os, "name", "nt")\n    monkeypatch.setattr(resolver_module.time, "sleep", sleeps.append)\n\n    with resolver_module._exclusive_file_lock(tmp_path / "windows.lock"):\n        assert attempts == 13\n\n    assert unlocks == 1\n    assert sleeps == [0.05] * 12\n''',
              encoding="utf-8",
          )
          PY

          python -m pip install --upgrade black==26.5.1
          black packages/python/catalogmx/data/resolver.py \
            packages/python/catalogmx/catalogs/banxico/instituciones_financieras.py \
            packages/python/catalogmx/catalogs/banxico/monedas_divisas.py \
            packages/python/tests/test_dataset_resolver_hardening.py
          git diff --check
      - name: Commit code fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/python
          git commit -m 'fix(data): address final resolver review findings'
          git push origin HEAD:feat/data-resolver-profiles
