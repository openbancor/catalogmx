name: PR96 Python Dart Format Once

on:
  push:
    branches:
      - fix/fiscal-integrity-2026
    paths:
      - '.github/workflows/pr96-py-dart-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fiscal-integrity-2026
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Format Python
        working-directory: packages/python
        run: |
          pip install 'black>=23.0.0'
          black catalogmx/calculators/imss.py
      - name: Format Dart
        run: |
          dart format packages/dart/lib/src/calculators/imss.dart packages/dart/test/imss_vectors_test.dart
      - name: Commit formatter-only changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/python/catalogmx/calculators/imss.py \
                  packages/dart/lib/src/calculators/imss.dart \
                  packages/dart/test/imss_vectors_test.dart
          git diff --cached --check
          git commit -m "style: format IMSS integrity guards"
          git push origin HEAD:fix/fiscal-integrity-2026
