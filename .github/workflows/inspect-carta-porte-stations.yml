name: Inspect Carta Porte station projections

on:
  push:
    branches:
      - feat/resolver-backed-carta-porte-consumers

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect station transport families
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sqlite3
          import urllib.request
          from pathlib import Path

          url = (
              'https://github.com/openbancor/catalogmx/releases/download/'
              'data-sat-carta-porte-3-1-04a0d49e0121a12e1409bca82a7c9c2317e05b114832d1ddea955c119e2883b4/'
              'sat_carta_porte_31.sqlite3'
          )
          db = Path('/tmp/cp.sqlite3')
          urllib.request.urlretrieve(url, db)
          con = sqlite3.connect(db)
          try:
              print('COUNTS')
              for row in con.execute(
                  'SELECT clave_transporte, COUNT(*) FROM ccp_31_estaciones GROUP BY clave_transporte ORDER BY clave_transporte'
              ):
                  print(row)
              for key in ('02', '03', '04'):
                  print('TRANSPORT', key)
                  for row in con.execute(
                      'SELECT id,texto,clave_transporte,nacionalidad,designador_iata,linea_ferrea '
                      'FROM ccp_31_estaciones WHERE clave_transporte=? ORDER BY id LIMIT 25',
                      (key,),
                  ):
                      print(row)
              print('MATCH LEGACY NAMES')
              for needle in ('Acapulco', 'Manzanillo', 'Veracruz', 'Ciudad de México', 'Benito Juárez', 'Cancún'):
                  rows = con.execute(
                      'SELECT id,texto,clave_transporte,nacionalidad,designador_iata,linea_ferrea '
                      'FROM ccp_31_estaciones WHERE texto LIKE ? ORDER BY clave_transporte,id LIMIT 20',
                      (f'%{needle}%',),
                  ).fetchall()
                  print(needle, rows)
          finally:
              con.close()
          PY
