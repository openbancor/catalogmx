name: Format Nómina Dart in CI context

on:
  push:
    branches:
      - feat/sat-nomina-api-parity

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[nomina-dart-ci-formatted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sat-nomina-api-parity
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Reproduce Dart CI dependency context and format
        working-directory: packages/dart
        run: |
          flutter pub get
          git checkout -- analysis_options.yaml
          dart format .
          git checkout -- pubspec.lock 2>/dev/null || true

      - name: Verify the formatting diff is scoped
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          test "$changed" = "packages/dart/lib/src/catalogs/sat/nomina_all.dart"

      - name: Commit CI-context formatting and remove helper
        run: |
          rm .github/workflows/format-nomina-dart-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/dart/lib/src/catalogs/sat/nomina_all.dart .github/workflows/format-nomina-dart-ci.yml
          git diff --cached --check
          git commit -m "style(dart): match package-context formatter [nomina-dart-ci-formatted]"
          git push origin HEAD:feat/sat-nomina-api-parity
