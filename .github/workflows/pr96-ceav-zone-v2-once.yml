name: PR96 CEAV Zone V2 Once

on:
  push:
    branches:
      - fix/fiscal-integrity-2026
    paths:
      - '.github/workflows/pr96-ceav-zone-v2-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fiscal-integrity-2026
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply CEAV zone/parity fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('packages/typescript/src/calculators/imss-calculator.ts')
          s = p.read_text(encoding='utf-8')
          old = '''  static getCEAVPatronRate(salarioDiario: number, year: IMSSYear, fecha?: string | Date): number {\n    this.assertFechaMatchesExercise(year, fecha);\n'''
          new = '''  static getCEAVPatronRate(\n    salarioDiario: number,\n    year: IMSSYear,\n    zona: ZonaSalario,\n    fecha?: string | Date\n  ): number {\n    this.assertFechaMatchesExercise(year, fecha);\n'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          old = '''    const isMinimumWage =\n      this.almostEqual(salarioDiario, minimum.general) ||\n      this.almostEqual(salarioDiario, minimum.frontera);\n    if (isMinimumWage) return rates[0].tasa;\n'''
          new = '''    if (this.almostEqual(salarioDiario, minimum[zona])) return rates[0].tasa;\n'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          old = '''    claseRiesgo: ClaseRiesgo = 1,\n    fecha?: string | Date\n  ): CuotasIMSSResult {\n'''
          new = '''    claseRiesgo: ClaseRiesgo = 1,\n    fecha?: string | Date,\n    zona: ZonaSalario = 'general'\n  ): CuotasIMSSResult {\n'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          old = '    const ceavPatronRate = this.getCEAVPatronRate(salarioDiario, year, fecha);\n'
          new = '    const ceavPatronRate = this.getCEAVPatronRate(salarioDiario, year, zona, fecha);\n'
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          old = '''    ultimoSbcMensual: number,\n    year: IMSSYear,\n    fecha?: string | Date\n  ): Modalidad40Result {\n'''
          new = '''    ultimoSbcMensual: number,\n    year: IMSSYear,\n    fecha?: string | Date,\n    zona: ZonaSalario = 'general'\n  ): Modalidad40Result {\n'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          old = '    const ceavPatronRate = this.getCEAVPatronRate(salarioDiarioEquivalente, year, fecha);\n'
          new = '''    const ceavPatronRate = this.getCEAVPatronRate(\n      salarioDiarioEquivalente,\n      year,\n      zona,\n      fecha\n    );\n'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('packages/typescript/tests/imss-vectors.test.ts')
          s = p.read_text(encoding='utf-8')
          marker = '''  test('modalidad 40 preserves the special 1 SM CEAV band', () => {\n'''
          test = '''  test('CEAV selector uses only the applicable wage zone', () => {\n    expect(IMSSCalculator.getCEAVPatronRate(315.04, 2026, 'general')).toBeCloseTo(0.0315, 8);\n    expect(IMSSCalculator.getCEAVPatronRate(440.87, 2026, 'general')).toBeCloseTo(0.06613, 8);\n    expect(IMSSCalculator.getCEAVPatronRate(440.87, 2026, 'frontera')).toBeCloseTo(0.0315, 8);\n  });\n\n'''
          assert s.count(marker) == 1, s.count(marker)
          p.write_text(s.replace(marker, test + marker, 1), encoding='utf-8')

          p = Path('packages/python/catalogmx/calculators/imss.py')
          s = p.read_text(encoding='utf-8')
          old = '''def _get_ceav_patron_rate(\n    salario_diario: float, year: IMSSYear, fecha: DateInput | None = None\n) -> float:\n    """Select the employer CEAV rate, preserving the special 1-SM row."""\n'''
          new = '''def get_ceav_patron_rate(\n    salario_diario: float,\n    year: IMSSYear,\n    fecha: DateInput | None = None,\n    *,\n    zona: ZonaSalario,\n) -> float:\n    """Select the employer CEAV rate for the applicable minimum-wage zone."""\n'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          old = '''    minimum = tables["salario_minimo"][str(year)]\n    if _almost_equal(salario_diario, float(minimum["general"])) or _almost_equal(\n        salario_diario, float(minimum["frontera"])\n    ):\n        return float(rates[0]["tasa"])\n'''
          new = '''    minimum = tables["salario_minimo"][str(year)]\n    if _almost_equal(salario_diario, float(minimum[zona])):\n        return float(rates[0]["tasa"])\n'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          old = '''    clase_riesgo: ClaseRiesgo = 1,\n    fecha: DateInput | None = None,\n) -> CuotasIMSSResult:\n'''
          new = '''    clase_riesgo: ClaseRiesgo = 1,\n    fecha: DateInput | None = None,\n    zona: ZonaSalario = "general",\n) -> CuotasIMSSResult:\n'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          old = '    ceav_patron_rate = _get_ceav_patron_rate(salario_diario, year, fecha)\n'
          new = '    ceav_patron_rate = get_ceav_patron_rate(salario_diario, year, fecha, zona=zona)\n'
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          old = '''    ultimo_sbc_mensual: float,\n    year: IMSSYear,\n    fecha: DateInput | None = None,\n) -> Modalidad40Result:\n'''
          new = '''    ultimo_sbc_mensual: float,\n    year: IMSSYear,\n    fecha: DateInput | None = None,\n    zona: ZonaSalario = "general",\n) -> Modalidad40Result:\n'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          old = '    ceav_patron_rate = _get_ceav_patron_rate(salario_diario_equivalente, year, fecha)\n'
          new = '''    ceav_patron_rate = get_ceav_patron_rate(\n        salario_diario_equivalente, year, fecha, zona=zona\n    )\n'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('packages/python/catalogmx/calculators/__init__.py')
          s = p.read_text(encoding='utf-8')
          marker = '    get_salario_minimo,\n'
          assert s.count(marker) == 1, s.count(marker)
          s = s.replace(marker, '    get_ceav_patron_rate,\n' + marker, 1)
          marker = '    "get_salario_minimo",\n'
          assert s.count(marker) == 1, s.count(marker)
          s = s.replace(marker, '    "get_ceav_patron_rate",\n' + marker, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('packages/python/tests/test_imss_vectors_shared.py')
          s = p.read_text(encoding='utf-8')
          old = 'from catalogmx.calculators import get_uma_for_date\n'
          new = 'from catalogmx.calculators import get_ceav_patron_rate, get_uma_for_date\n'
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          marker = '''def test_imss_cuotas_obrero_patronales_vectors_shared() -> None:\n'''
          test = '''def test_public_ceav_selector_uses_only_applicable_wage_zone() -> None:\n    assert get_ceav_patron_rate(315.04, 2026, zona="general") == pytest.approx(0.0315)\n    assert get_ceav_patron_rate(440.87, 2026, zona="general") == pytest.approx(0.06613)\n    assert get_ceav_patron_rate(440.87, 2026, zona="frontera") == pytest.approx(0.0315)\n\n\n'''
          assert s.count(marker) == 1, s.count(marker)
          p.write_text(s.replace(marker, test + marker, 1), encoding='utf-8')

          p = Path('packages/dart/lib/src/calculators/imss.dart')
          s = p.read_text(encoding='utf-8')
          old = '''  static double _getCEAVPatronRate(\n    double salarioDiario,\n    IMSSYear year, [\n    DateTime? fecha,\n  ]) {\n'''
          new = '''  /// Select the employer CEAV rate for the applicable minimum-wage zone.\n  static double getCEAVPatronRate(\n    double salarioDiario,\n    IMSSYear year, {\n    required ZonaSalario zona,\n    DateTime? fecha,\n  }) {\n'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          old = '''    final general = (minimum['general']! as num).toDouble();\n    final frontera = (minimum['frontera']! as num).toDouble();\n    if (_almostEqual(salarioDiario, general) ||\n        _almostEqual(salarioDiario, frontera)) {\n      return ((rates[0] as Map<String, dynamic>)['tasa']! as num).toDouble();\n    }\n'''
          new = '''    final applicableMinimum = (minimum[zona.value]! as num).toDouble();\n    if (_almostEqual(salarioDiario, applicableMinimum)) {\n      return ((rates[0] as Map<String, dynamic>)['tasa']! as num).toDouble();\n    }\n'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          old = '''    ClaseRiesgo claseRiesgo = ClaseRiesgo.clase1,\n    DateTime? fecha,\n  }) {\n'''
          new = '''    ClaseRiesgo claseRiesgo = ClaseRiesgo.clase1,\n    DateTime? fecha,\n    ZonaSalario zona = ZonaSalario.general,\n  }) {\n'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          old = '    final ceavPatronRate = _getCEAVPatronRate(salarioDiario, year, fecha);\n'
          new = '''    final ceavPatronRate = getCEAVPatronRate(\n      salarioDiario,\n      year,\n      zona: zona,\n      fecha: fecha,\n    );\n'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          old = '''    IMSSYear year = IMSSYear.year2026,\n    DateTime? fecha,\n  }) {\n    _assertFechaMatchesExercise(year, fecha);\n    final tables = _loadIMSSTables();\n    final uma = fecha == null ? getUMA(year) : getUMAForDate(fecha);\n    final mod40 = tables['modalidad_40']! as Map<String, dynamic>;\n'''
          new = '''    IMSSYear year = IMSSYear.year2026,\n    DateTime? fecha,\n    ZonaSalario zona = ZonaSalario.general,\n  }) {\n    _assertFechaMatchesExercise(year, fecha);\n    final tables = _loadIMSSTables();\n    final uma = fecha == null ? getUMA(year) : getUMAForDate(fecha);\n    final mod40 = tables['modalidad_40']! as Map<String, dynamic>;\n'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          old = '''    final ceavPatronRate = _getCEAVPatronRate(\n      salarioDiarioEquivalente,\n      year,\n      fecha,\n    );\n'''
          new = '''    final ceavPatronRate = getCEAVPatronRate(\n      salarioDiarioEquivalente,\n      year,\n      zona: zona,\n      fecha: fecha,\n    );\n'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('packages/dart/test/imss_vectors_test.dart')
          s = p.read_text(encoding='utf-8')
          marker = '''  test('Modalidad 40 preserves the special one-minimum-wage CEAV row', () {\n'''
          test = '''  test('Public CEAV selector uses only the applicable wage zone', () {\n    expect(IMSSCalculator.getCEAVPatronRate(315.04, IMSSYear.year2026, zona: ZonaSalario.general), closeTo(0.0315, 0.00000001));\n    expect(IMSSCalculator.getCEAVPatronRate(440.87, IMSSYear.year2026, zona: ZonaSalario.general), closeTo(0.06613, 0.00000001));\n    expect(IMSSCalculator.getCEAVPatronRate(440.87, IMSSYear.year2026, zona: ZonaSalario.frontera), closeTo(0.0315, 0.00000001));\n  });\n\n'''
          assert s.count(marker) == 1, s.count(marker)
          p.write_text(s.replace(marker, test + marker, 1), encoding='utf-8')

          p = Path('packages/webapp-svelte/src/routes/calculadoras/imss/+page.svelte')
          s = p.read_text(encoding='utf-8')
          old = '''\ttype ClaseRiesgo = 1 | 2 | 3 | 4 | 5;\n\ttype Year = 2024 | 2025 | 2026;\n'''
          new = '''\ttype ClaseRiesgo = 1 | 2 | 3 | 4 | 5;\n\ttype ZonaSalario = 'general' | 'frontera';\n\ttype Year = 2024 | 2025 | 2026;\n'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          old = '''\tlet claseRiesgo = $state<ClaseRiesgo>(1);\n\tlet year = $state<Year>(2025);\n'''
          new = '''\tlet claseRiesgo = $state<ClaseRiesgo>(1);\n\tlet zonaSalario = $state<ZonaSalario>('general');\n\tlet year = $state<Year>(2025);\n'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          old = '''\t\t\tyear,\n\t\t\tclaseRiesgo\n\t\t);\n'''
          new = '''\t\t\tyear,\n\t\t\tclaseRiesgo,\n\t\t\tundefined,\n\t\t\tzonaSalario\n\t\t);\n'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          old = '''\t\t\t\tultimoSbcDiario * factorMensual,\n\t\t\t\tyear\n\t\t\t);\n'''
          new = '''\t\t\t\tultimoSbcDiario * factorMensual,\n\t\t\t\tyear,\n\t\t\t\tundefined,\n\t\t\t\tzonaSalario\n\t\t\t);\n'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          year_block = '''\t\t\t\t\t<!-- Año -->\n\t\t\t\t\t<div>\n\t\t\t\t\t\t<label for="year" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">\n\t\t\t\t\t\t\tAño\n\t\t\t\t\t\t</label>\n\t\t\t\t\t\t<select\n\t\t\t\t\t\t\tid="year"\n\t\t\t\t\t\t\tbind:value={year}\n\t\t\t\t\t\t\tclass="input"\n\t\t\t\t\t\t>\n\t\t\t\t\t\t\t{#each years as y}\n\t\t\t\t\t\t\t\t<option value={y}>{y}</option>\n\t\t\t\t\t\t\t{/each}\n\t\t\t\t\t\t</select>\n\t\t\t\t\t</div>\n'''
          zone_block = year_block + '''\n\t\t\t\t\t{#if tipoCalculo !== 'modalidad10'}\n\t\t\t\t\t\t<div>\n\t\t\t\t\t\t\t<label for="zonaSalario" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">\n\t\t\t\t\t\t\t\tZona salarial aplicable\n\t\t\t\t\t\t\t</label>\n\t\t\t\t\t\t\t<select id="zonaSalario" bind:value={zonaSalario} class="input">\n\t\t\t\t\t\t\t\t<option value="general">General</option>\n\t\t\t\t\t\t\t\t<option value="frontera">Zona Libre de la Frontera Norte</option>\n\t\t\t\t\t\t\t</select>\n\t\t\t\t\t\t\t<p class="text-xs text-slate-500 mt-1">Se usa para identificar correctamente la fila especial CEAV de 1 salario mínimo.</p>\n\t\t\t\t\t\t</div>\n\t\t\t\t\t{/if}\n'''
          assert s.count(year_block) == 1, s.count(year_block)
          p.write_text(s.replace(year_block, zone_block, 1), encoding='utf-8')
          PY
      - name: Validate TypeScript
        working-directory: packages/typescript
        run: |
          npm ci
          npx prettier --write src/calculators/imss-calculator.ts tests/imss-vectors.test.ts
          npm run format:check
          npm run typecheck
          npm run lint
          npx jest tests/imss-vectors.test.ts --runInBand
      - name: Validate Python
        working-directory: packages/python
        run: |
          pip install -e '.[dev]'
          ruff check --fix catalogmx/calculators/imss.py catalogmx/calculators/__init__.py tests/test_imss_vectors_shared.py
          black catalogmx/calculators/imss.py catalogmx/calculators/__init__.py tests/test_imss_vectors_shared.py
          ruff check catalogmx/calculators/imss.py catalogmx/calculators/__init__.py tests/test_imss_vectors_shared.py
          black --check catalogmx/calculators/imss.py catalogmx/calculators/__init__.py tests/test_imss_vectors_shared.py
          mypy catalogmx/calculators/imss.py
          pytest tests/test_imss_vectors_shared.py -v
      - name: Validate Dart
        working-directory: packages/dart
        run: |
          flutter pub get
          git checkout -- analysis_options.yaml
          dart format lib/src/calculators/imss.dart test/imss_vectors_test.dart
          dart analyze
          dart format --output=none --set-exit-if-changed lib/src/calculators/imss.dart test/imss_vectors_test.dart
          flutter test test/imss_vectors_test.dart
      - name: Validate Svelte
        working-directory: packages/webapp-svelte
        run: |
          npm ci
          npm run check
          npm run build
      - name: Commit CEAV zone/parity fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/typescript/src/calculators/imss-calculator.ts packages/typescript/tests/imss-vectors.test.ts packages/python/catalogmx/calculators/imss.py packages/python/catalogmx/calculators/__init__.py packages/python/tests/test_imss_vectors_shared.py packages/dart/lib/src/calculators/imss.dart packages/dart/test/imss_vectors_test.dart packages/webapp-svelte/src/routes/calculadoras/imss/+page.svelte
          git diff --cached --check
          git commit -m "fix(imss): make CEAV zone explicit across runtimes"
          git push origin HEAD:fix/fiscal-integrity-2026
